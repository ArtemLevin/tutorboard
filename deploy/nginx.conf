server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 ipv6=off valid=30s;
  set $formula_recognition_upstream "math-ink-proxy:8787";

  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self' blob:" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /api/v1/formula-recognition/recognize {
    client_max_body_size 1m;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_send_timeout 8s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-TutorBoard-Request-Id $http_x_tutorboard_request_id;
    proxy_pass http://$formula_recognition_upstream/v1/recognize;
  }

  location ~* \.(?:css|js|json|png|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
