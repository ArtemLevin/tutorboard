services:
  tutorboard:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_FEATURE_HANDWRITTEN_FUNCTIONS: "true"
        VITE_FEATURE_MATH_INK_RECOGNITION: "true"
    depends_on:
      math-ink-proxy:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  math-ink-proxy:
    build:
      context: ..
      dockerfile: Dockerfile.math-ink-proxy
    environment:
      FORMULA_RECOGNITION_MAX_CONCURRENCY: "4"
      FORMULA_RECOGNITION_PROVIDER_TIMEOUT_MS: "15000"
      FORMULA_RECOGNITION_RATE_LIMIT: "30"
      FORMULA_RECOGNITION_RATE_WINDOW_MS: "60000"
      FORMULA_RECOGNITION_TRUSTED_PROXY_HOPS: "1"
      LOCAL_OCR_LLM_ALLOW_INSECURE_UPSTREAM: ${LOCAL_OCR_LLM_ALLOW_INSECURE_UPSTREAM:-false}
      LOCAL_OCR_LLM_API_KEY: ${LOCAL_OCR_LLM_API_KEY:-}
      LOCAL_OCR_LLM_API_URL: ${LOCAL_OCR_LLM_API_URL:-}
      LOCAL_OCR_LLM_MODEL: ${LOCAL_OCR_LLM_MODEL:-}
      PADDLE_OCR_ALLOW_INSECURE_UPSTREAM: ${PADDLE_OCR_ALLOW_INSECURE_UPSTREAM:-false}
      PADDLE_OCR_API_TOKEN: ${PADDLE_OCR_API_TOKEN:-}
      PADDLE_OCR_API_URL: ${PADDLE_OCR_API_URL:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_IAM_TOKEN: ${YANDEX_IAM_TOKEN:-}
      YANDEX_OCR_ALLOW_INSECURE_UPSTREAM: ${YANDEX_OCR_ALLOW_INSECURE_UPSTREAM:-false}
      YANDEX_OCR_API_URL: ${YANDEX_OCR_API_URL:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
