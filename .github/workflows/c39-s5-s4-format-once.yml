name: C3.9-S5.4 one-time project formatter

on:
  pull_request:
    paths:
      - .github/workflows/c39-s5-s4-format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/c39-s5-s4-pixel-root-cause'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply locked Prettier to research files
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write \
            tests/e2e/c39-s5-s4-pixel-diagnostics.spec.ts \
            tests/e2e/c39-s5-s4-lifecycle.spec.ts \
            tests/e2e/standalone-launch.spec.ts \
            tests/e2e/server-sync.spec.ts \
            src/adapters/canvas-konva/wheel-ink-cache.ts \
            src/adapters/canvas-konva/BoardStage.tsx
          git diff --check
          git add \
            tests/e2e/c39-s5-s4-pixel-diagnostics.spec.ts \
            tests/e2e/c39-s5-s4-lifecycle.spec.ts \
            tests/e2e/standalone-launch.spec.ts \
            tests/e2e/server-sync.spec.ts \
            src/adapters/canvas-konva/wheel-ink-cache.ts \
            src/adapters/canvas-konva/BoardStage.tsx
          if ! git diff --cached --quiet; then
            git -c user.name='TutorBoard CI Formatter' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format C3.9-S5.4 diagnostics and browser regressions'
            git push origin 'HEAD:refs/heads/test/c39-s5-s4-pixel-root-cause'
          fi
