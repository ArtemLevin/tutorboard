name: Fix GeometryOS test API

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-test:
    if: github.event.pull_request.head.ref == 'feature-embedded-image-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature-embedded-image-import
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Update test to current adapter API
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/app/App.test.tsx')
          text = path.read_text(encoding='utf-8')
          anchor = '  it("runs the GeometryOS vertical flow and selects one atomic import", async () => {\n    const fetchMock = vi.fn((input: RequestInfo | URL) => {'
          replacement = '  it("runs the GeometryOS vertical flow and selects one atomic import", async () => {\n    const requestId = geometryOsRequestId("request:unit");\n    const fetchMock = vi.fn((input: RequestInfo | URL) => {'
          if text.count(anchor) != 1:
              raise SystemExit('request id anchor mismatch')
          text = text.replace(anchor, replacement)
          text = text.replace(
              'headers: { "Content-Type": "application/json" },',
              'headers: {\n              "Content-Type": "application/json",\n              "X-Request-ID": requestId,\n            },',
          )
          old_client = '''    const client = createGeometryOsHttpClient({
      baseUrl: "https://geometryos.example.test",
      fetchImpl: fetchMock,
    });
    render(
      <App
        geometryOsClient={client}
        requestIdFactory={() => geometryOsRequestId("request:unit")}
      />,
    );'''
          new_client = '''    const client = createGeometryOsHttpClient({
      baseUrl: "https://geometryos.example.test",
      createRequestId: () => requestId,
      fetch: fetchMock,
    });
    render(<App geometryOsClient={client} />);'''
          if text.count(old_client) != 1:
              raise SystemExit('client API anchor mismatch')
          text = text.replace(old_client, new_client)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-geometry-test-api.yml').unlink()
          PY
          npx prettier --write src/app/App.test.tsx
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: use current GeometryOS client API"
          git push origin HEAD:feature-embedded-image-import
