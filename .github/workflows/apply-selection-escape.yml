name: Apply selection Escape fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-selection-escape
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/minimal-board-chrome'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/minimal-board-chrome
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python scripts/fix-selection-escape.py
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - name: Commit selection fix
        run: |
          rm -f \
            .agent/selection-escape.trigger \
            .github/workflows/apply-selection-escape.yml \
            scripts/fix-selection-escape.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: cancel active selection previews on Escape"
          git push origin HEAD:feature/minimal-board-chrome
