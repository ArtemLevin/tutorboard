name: UX2 durability repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-ux-structure-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and verify the durable lifecycle
        run: |
          npx prettier --write tests/e2e/coordinate-plot-production.spec.ts
          npm run typecheck
          npx playwright install --with-deps chromium firefox
          npm run build
          npm run e2e:plot-production
      - name: Push formatted lifecycle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/coordinate-plot-production.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format durable coordinate plot lifecycle"
          git push origin HEAD:feature/coordinate-plot-ux-structure-discovery
