name: Update PR 2.8.2 documentation

on:
  push:
    branches:
      - fix/2.8.2-geometryos-live-gate
    paths:
      - .github/scripts/update-pr-2-8-2-docs.mjs
      - .github/workflows/update-pr-2-8-2-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Apply verified documentation changes
        run: node .github/scripts/update-pr-2-8-2-docs.mjs

      - name: Commit documentation and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close PR 2.8.2 live-contract gate"
          git push
