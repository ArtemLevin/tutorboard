name: C3.9-S4 one-time branch formatter

on:
  pull_request:
    paths:
      - .github/workflows/c39-s4-format-once.yml

permissions:
  contents: write

jobs:
  format-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/c39-s4-scene-hit-causal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Format C3.9-S4 research files with pinned Prettier
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write \
            tests/e2e/c39-scene-hit-causal.ts \
            tests/unit/adapters/canvas-konva/c39-scene-hit-causal.test.ts \
            tests/e2e/c39-large-board-profile.spec.ts \
            .github/workflows/c39-scene-hit-causal.yml
          git diff --check
          git add \
            tests/e2e/c39-scene-hit-causal.ts \
            tests/unit/adapters/canvas-konva/c39-scene-hit-causal.test.ts \
            tests/e2e/c39-large-board-profile.spec.ts \
            .github/workflows/c39-scene-hit-causal.yml
          if ! git diff --cached --quiet; then
            git -c user.name='TutorBoard CI Formatter' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format C3.9-S4 research'
            git push origin 'HEAD:refs/heads/perf/c39-s4-scene-hit-causal'
          fi
