name: Temporary 3D sweep formatting
on:
  push:
    paths:
      - ".github/workflows/temporary-3d-sweep-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply repository formatter
        run: |
          npx prettier --write \
            src/app/solid-3d/Solid3DEditorPanel.tsx \
            src/app/solid-3d/Solid3DEditorPanel.sweep.test.tsx \
            src/modules/solid-3d/section-sweep.ts \
            tests/unit/modules/solid-3d/section-sweep.test.ts \
            src/app/board/controllers/useBoardSolid3DController.ts \
            src/app/solid-3d/Solid3DSections.css
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/solid-3d src/modules/solid-3d tests/unit/modules/solid-3d src/app/board/controllers/useBoardSolid3DController.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): apply project prettier to plane sweep"
            git push origin HEAD:refs/heads/feat/solid-3d-plane-sweep-20261020
          fi
