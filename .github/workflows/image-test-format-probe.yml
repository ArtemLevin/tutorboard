name: Image test format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    if: github.event.pull_request.head.ref == 'feature-embedded-image-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Show formatter diff
        run: |
          npx prettier --write src/app/App.test.tsx
          git diff -- src/app/App.test.tsx
          test -z "$(git status --short src/app/App.test.tsx)"
