name: Image test format probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-probe:
    if: github.event.pull_request.head.ref == 'feature-embedded-image-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature-embedded-image-import
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply formatter output
        run: |
          npx prettier --write src/app/App.test.tsx
          rm .github/workflows/image-test-format-probe.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format embedded image test"
          git push origin HEAD:feature-embedded-image-import
