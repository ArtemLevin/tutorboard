name: Temporary 3D-4A preset test correction

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Correct X-axis preset test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/solid-3d/Solid3DOrientationPresets.test.tsx')
          text = path.read_text()
          old = 'screen.getAllByRole("button", { name: "180°" })[1]!'
          new = 'screen.getAllByRole("button", { name: "180°" })[0]!'
          if old not in text:
              raise SystemExit('preset test marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit correction and self-cleanup
        run: |
          git rm -f .github/workflows/__temp-3d4a-preset-test-fix.yml
          git rm -f .3d4a-preset-test-fix-trigger || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(3d): correct X-axis orientation preset selection"
          git push
