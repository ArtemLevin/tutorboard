name: Debug object settings E2E

on:
  push:
    branches:
      - feature/object-settings-right-double-click

permissions:
  contents: read

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/object-settings-right-double-click
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - name: Run isolated browser scenario
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/object-settings-right-double-click.spec.ts --reporter=list 2>&1 | tee object-settings-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: object-settings-e2e-debug-${{ github.sha }}
          path: |
            object-settings-e2e.log
            test-results
          if-no-files-found: warn
          retention-days: 3
