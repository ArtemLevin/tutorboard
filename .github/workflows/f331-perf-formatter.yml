name: Temporary F3.3.1 perf formatter
on:
  push:
    branches: [test/f3-3-1-real-media-baseline]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Emit formatted performance tests
        run: |
          set -euo pipefail
          paths=(tests/performance/asset-scene-baseline.test.ts tests/fullstack/media-asset-baseline.spec.ts)
          npx prettier --write "${paths[@]}"
          for path in "${paths[@]}"; do
            echo "F331B_FILE:${path}:$(base64 -w0 "$path")"
          done
