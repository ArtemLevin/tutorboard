name: Temporary 3D review formatting (second pass)
on:
  push:
    branches:
      - fix/solid-3d-review-2026-10-21
    paths:
      - .github/workflows/temporary-solid-3d-review-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only reviewed changes
        run: |
          npx prettier --write \
            playwright.config.ts \
            src/adapters/solid-3d-three/camera-framing.ts \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/core/board/commands/reducer.ts \
            src/core/solid-3d/anchors.ts \
            tests/unit/adapters/solid-3d-three/camera-framing.test.ts \
            tests/unit/core/solid-3d/analytic-anchor.test.ts \
            tests/unit/core/solid-3d/project-section-stale.test.ts \
            tests/unit/core/solid-3d/validation.test.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/adapters/solid-3d-three/camera-framing.ts \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/core/board/commands/reducer.ts \
            src/core/solid-3d/anchors.ts \
            tests/unit/adapters/solid-3d-three/camera-framing.test.ts \
            tests/unit/core/solid-3d/analytic-anchor.test.ts \
            tests/unit/core/solid-3d/project-section-stale.test.ts \
            tests/unit/core/solid-3d/validation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): apply project Prettier to review fixes"
            git push origin HEAD:refs/heads/fix/solid-3d-review-2026-10-21
          fi
