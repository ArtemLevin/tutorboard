              )?.object.style;''',
              '''  const selectedStyle = scene.items.find(({ object }) =>
                selectionState.selectedObjectIds.includes(object.id),
              )?.object.style;
              const selectedCoordinatePlot =
                selectedObjects.length === 1 &&
                selectedObjects[0]?.kind === "math.coordinate-plot"
