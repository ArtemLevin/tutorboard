              '''                <dt>V / L / H / P / I / R / E / T</dt>
                    <dd>Выбор инструмента</dd>''',
              '''                <dt>V / L / H / P / I / R / E / T / G</dt>
                    <dd>Выбор инструмента и создание графика</dd>''',
