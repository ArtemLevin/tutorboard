name: PR5 editor bootstrap

on:
  push:
    branches:
      - feature/coordinate-plot-editor
    paths:
      - .github/workflows/pr5-bootstrap.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-editor
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integrate coordinate plot editor
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}, found {source.count(old)}: {old[:80]!r}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          # Renderer registry wiring.
          replace_once(
              "src/adapters/canvas-konva/default-renderers.tsx",
              '''  {
                kind: "math.coordinate-plot",
                render(object, context) {
                  return (
                    <CoordinatePlotRenderer
                      object={expectKind(object, "math.coordinate-plot")}
                      zoom={context.zoom}
                    />
                  );
                },
              },''',
              '''  {
                kind: "math.coordinate-plot",
                render(object, context) {
                  const plot = expectKind(object, "math.coordinate-plot");
                  const interaction = context.coordinatePlot;
                  const editing = interaction?.activeObjectId === plot.id;
                  const renderedPlot =
                    editing && interaction.definitionOverride !== undefined
                      ? { ...plot, definition: interaction.definitionOverride }
                      : plot;
                  return (
                    <CoordinatePlotRenderer
                      editing={editing}
                      object={renderedPlot}
                      zoom={context.zoom}
                      {...(interaction?.onEditRequest === undefined
                        ? {}
                        : {
                            onEditRequest: () =>
                              interaction.onEditRequest?.(plot.id),
                          })}
                      {...(!editing
                        ? {}
                        : {
                            onSelectedSeriesChange: (seriesId) =>
                              interaction?.onSelectedSeriesChange?.(
                                plot.id,
                                seriesId,
                              ),
                            onViewportChange: (viewport) =>
                              interaction?.onViewportChange?.(plot.id, viewport),
                            selectedSeriesId:
                              interaction?.selectedSeriesId ?? null,
                          })}
                    />
                  );
                },
              },''',
          )

          # BoardStage forwards transient plot interaction through the renderer context.
          replace_once(
              "src/adapters/canvas-konva/BoardStage.tsx",
              'import type { KonvaRendererRegistry } from "./renderer-registry";',
              '''import type {
                CoordinatePlotRenderInteraction,
                KonvaRendererRegistry,
              } from "./renderer-registry";''',
          )
          replace_once(
              "src/adapters/canvas-konva/BoardStage.tsx",
              '''export interface BoardStageProps {
                readonly drawingModeKey: string | null;''',
              '''export interface BoardStageProps {
                readonly coordinatePlotInteraction?:
                  | CoordinatePlotRenderInteraction
                  | undefined;
                readonly drawingModeKey: string | null;''',
          )
          replace_once(
              "src/adapters/canvas-konva/BoardStage.tsx",
              '''  options: {
                readonly interactive: boolean;
                readonly previewDelta?: Vec2 | null;
                readonly zoom: number;
              },''',
              '''  options: {
                readonly coordinatePlotInteraction?:
                  | CoordinatePlotRenderInteraction
                  | undefined;
                readonly interactive: boolean;
                readonly previewDelta?: Vec2 | null;
                readonly zoom: number;
              },''',
          )
          replace_once(
              "src/adapters/canvas-konva/BoardStage.tsx",
              '''        registry.render(item, { zoom: options.zoom }),''',
              '''        registry.render(item, {
                  zoom: options.zoom,
                  ...(options.coordinatePlotInteraction === undefined
                    ? {}
                    : { coordinatePlot: options.coordinatePlotInteraction }),
                }),''',
          )
          replace_once(
              "src/adapters/canvas-konva/BoardStage.tsx",
              '''export function BoardStage({
                drawingModeKey,''',
              '''export function BoardStage({
                coordinatePlotInteraction,
                drawingModeKey,''',
          )
          replace_once(
              "src/adapters/canvas-konva/BoardStage.tsx",
              '''                  renderItem(item, registry, {
                    interactive: true,
                    zoom: previewViewport.zoom,''',
              '''                  renderItem(item, registry, {
                    coordinatePlotInteraction,
                    interactive: true,
                    zoom: previewViewport.zoom,''',
          )
          replace_once(
              "src/adapters/canvas-konva/BoardStage.tsx",
              '''      data-drawing={isDrawing}
              data-lasso-points={selectionLasso?.length ?? 0}''',
              '''      data-coordinate-plot-editing={
                coordinatePlotInteraction?.activeObjectId !== null &&
                coordinatePlotInteraction?.activeObjectId !== undefined
              }
              data-drawing={isDrawing}
              data-lasso-points={selectionLasso?.length ?? 0}''',
          )

          # CoordinatePlotRenderer gains double-click entry, controlled line selection,
          # pointer-relative wheel zoom and drag-to-pan inside the clipping rectangle.
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''import { useMemo, useState, type ReactElement } from "react";''',
              '''import Konva from "konva";
              import { useMemo, useRef, useState, type ReactElement } from "react";''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''  type CoordinatePlotObject,
                type CoordinatePlotSeriesSamplingResult,
                type PlotSeries,
                type PlotSeriesId,''',
              '''  type CoordinatePlotObject,
                type CoordinatePlotSeriesSamplingResult,
                type CoordinatePlotViewport,
                type PlotSeries,
                type PlotSeriesId,
                type Vec2,''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''import { createCoordinatePlotRenderModel } from "./coordinate-plot-render-model";''',
              '''import {
                panCoordinatePlotViewport,
                zoomCoordinatePlotViewportAt,
              } from "./coordinate-plot-editing";
              import { createCoordinatePlotRenderModel } from "./coordinate-plot-render-model";''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''export interface CoordinatePlotRendererProps {
                readonly object: CoordinatePlotObject;''',
              '''export interface CoordinatePlotRendererProps {
                readonly editing?: boolean | undefined;
                readonly object: CoordinatePlotObject;
                readonly onEditRequest?: (() => void) | undefined;''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''  readonly onSelectedSeriesChange?:
                  ((seriesId: PlotSeriesId | null) => void) | undefined;
                readonly selectedSeriesId?: PlotSeriesId | null | undefined;''',
              '''  readonly onSelectedSeriesChange?:
                  ((seriesId: PlotSeriesId | null) => void) | undefined;
                readonly onViewportChange?:
                  ((viewport: CoordinatePlotViewport) => void) | undefined;
                readonly selectedSeriesId?: PlotSeriesId | null | undefined;''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''const axisLabelFontSize = 13;

              export interface CoordinatePlotRendererProps''',
              '''const axisLabelFontSize = 13;
              const plotWheelZoomStep = 1.12;

              interface PlotViewportDragSession {
                readonly startPointer: Vec2;
                readonly startViewport: CoordinatePlotViewport;
              }

              function localPointer(node: Konva.Node): Vec2 | null {
                const stage = node.getStage();
                const pointer = stage?.getPointerPosition();
                if (pointer === null || pointer === undefined) return null;
                const local = node
                  .getAbsoluteTransform()
                  .copy()
                  .invert()
                  .point(pointer);
                return Number.isFinite(local.x) && Number.isFinite(local.y)
                  ? local
                  : null;
              }

              export interface CoordinatePlotRendererProps''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''export function CoordinatePlotRenderer({
                object,
                onSelectedSeriesChange,
                selectedSeriesId,
                zoom,
              }: CoordinatePlotRendererProps): ReactElement {''',
              '''export function CoordinatePlotRenderer({
                editing = false,
                object,
                onEditRequest,
                onSelectedSeriesChange,
                onViewportChange,
                selectedSeriesId,
                zoom,
              }: CoordinatePlotRendererProps): ReactElement {''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''  const [hoveredSeriesId, setHoveredSeriesId] = useState<PlotSeriesId | null>(
                null,
              );''',
              '''  const [hoveredSeriesId, setHoveredSeriesId] = useState<PlotSeriesId | null>(
                null,
              );
              const viewportDragRef = useRef<PlotViewportDragSession | null>(null);''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''    <Group
                  name="board-transform-target coordinate-plot-root"''',
              '''    <Group
                  name="board-transform-target coordinate-plot-root"
                  onDblClick={(event) => {
                    if (onEditRequest === undefined) return;
                    event.cancelBubble = true;
                    onEditRequest();
                  }}''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''      <Group clipHeight={height} clipWidth={width} clipX={0} clipY={0}>''',
              '''      <Group
                clipHeight={height}
                clipWidth={width}
                clipX={0}
                clipY={0}
                onWheel={(event) => {
                  if (!editing || onViewportChange === undefined) return;
                  event.cancelBubble = true;
                  event.evt.preventDefault();
                  const pointer = localPointer(event.currentTarget);
                  if (pointer === null) return;
                  const direction =
                    (event.evt.deltaY < 0 ? -1 : 1) *
                    (event.evt.ctrlKey ? -1 : 1);
                  const axis = event.evt.shiftKey
                    ? "x"
                    : event.evt.altKey
                      ? "y"
                      : "both";
                  onViewportChange(
                    zoomCoordinatePlotViewportAt(
                      definition.coordinateViewport,
                      definition.size,
                      pointer,
                      direction < 0
                        ? 1 / plotWheelZoomStep
                        : plotWheelZoomStep,
                      axis,
                    ),
                  );
                }}
              >''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''        {visibleSeries.flatMap((series) => {''',
              '''        {editing && onViewportChange !== undefined ? (
                  <Rect
                    dragBoundFunc={() => ({ x: 0, y: 0 })}
                    draggable
                    fill="rgba(15,23,42,0.001)"
                    height={height}
                    name="coordinate-plot-pan-surface"
                    onDragEnd={(event) => {
                      event.cancelBubble = true;
                      const session = viewportDragRef.current;
                      const pointer = localPointer(event.currentTarget);
                      viewportDragRef.current = null;
                      if (session === null || pointer === null) return;
                      onViewportChange(
                        panCoordinatePlotViewport(
                          session.startViewport,
                          definition.size,
                          {
                            x: pointer.x - session.startPointer.x,
                            y: pointer.y - session.startPointer.y,
                          },
                        ),
                      );
                    }}
                    onDragMove={(event) => {
                      event.cancelBubble = true;
                      const session = viewportDragRef.current;
                      const pointer = localPointer(event.currentTarget);
                      if (session === null || pointer === null) return;
                      onViewportChange(
                        panCoordinatePlotViewport(
                          session.startViewport,
                          definition.size,
                          {
                            x: pointer.x - session.startPointer.x,
                            y: pointer.y - session.startPointer.y,
                          },
                        ),
                      );
                    }}
                    onDragStart={(event) => {
                      event.cancelBubble = true;
                      const pointer = localPointer(event.currentTarget);
                      if (pointer === null) return;
                      viewportDragRef.current = {
                        startPointer: pointer,
                        startViewport: definition.coordinateViewport,
                      };
                    }}
                    onPointerDown={(event) => {
                      event.cancelBubble = true;
                      event.evt.preventDefault();
                    }}
                    width={width}
                  />
                ) : null}
                {visibleSeries.flatMap((series) => {''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''                onMouseLeave={() =>
                  setHoveredSeriesId((current) =>
                    current === series.id ? null : current,
                  )
                }
                onTap={() => selectSeries(series.id)}''',
              '''                onMouseLeave={() =>
                  setHoveredSeriesId((current) =>
                    current === series.id ? null : current,
                  )
                }
                onPointerDown={(event) => {
                  if (!editing) return;
                  event.cancelBubble = true;
                  event.evt.preventDefault();
                }}
                onTap={() => selectSeries(series.id)}''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''                onMouseLeave={() =>
                  setHoveredSeriesId((current) =>
                    current === series.id ? null : current,
                  )
                }
                onTap={() => selectSeries(series.id)}
                y={rowY}''',
              '''                onMouseLeave={() =>
                  setHoveredSeriesId((current) =>
                    current === series.id ? null : current,
                  )
                }
                onPointerDown={(event) => {
                  if (!editing) return;
                  event.cancelBubble = true;
                  event.evt.preventDefault();
                }}
                onTap={() => selectSeries(series.id)}
                y={rowY}''',
          )
          replace_once(
              "src/adapters/canvas-konva/coordinate-plot-renderer.tsx",
              '''      {problematicSeriesCount > 0 && (''',
              '''      {editing ? (
                <Text
                  align="center"
                  fill="#1d4ed8"
                  fontSize={12}
                  fontStyle="bold"
                  listening={false}
                  text="Редактирование координатной плоскости"
                  width={Math.max(0, width - 32)}
                  x={16}
                  y={8}
                />
              ) : null}
              {problematicSeriesCount > 0 && (''',
          )

          # App session, creation command, live draft and editor panel.
          replace_once(
              "src/app/App.tsx",
              '''  createDefaultKonvaRendererRegistry,
                type BoardObjectTransformSnapshot,''',
              '''  createDefaultKonvaRendererRegistry,
                type BoardObjectTransformSnapshot,
                type CoordinatePlotRenderInteraction,''',
          )
          replace_once(
              "src/app/App.tsx",
              '''  geometryImportId,
                groupId,
                reduceBoardDocument,''',
              '''  geometryImportId,
                groupId,
                plotParameterId,
                plotSeriesId,
                reduceBoardDocument,''',
          )
          replace_once(
              "src/app/App.tsx",
              '''  type CommandMetadata,
                type VisualStyleOverride,
                type ViewportState,''',
              '''  type CommandMetadata,
                type CoordinatePlotDefinition,
                type PlotSeriesId,
                type VisualStyleOverride,
                type ViewportState,''',
          )
          replace_once(
              "src/app/App.tsx",
              '''import { ColorPalette } from "./ColorPalette";''',
              '''import {
                addCoordinatePlotParameter,
                addCoordinatePlotSeries,
                createDefaultCoordinatePlotObject,
                validateCoordinatePlotEditorDefinition,
              } from "../modules/coordinate-plot-editor/public";
              import { ColorPalette } from "./ColorPalette";
              import { CoordinatePlotEditorPanel } from "./CoordinatePlotEditorPanel";''',
          )
          replace_once(
              "src/app/App.tsx",
              '''const initialDrawingState: DrawingInteractionState = { kind: "idle" };

              export interface AppPersistenceStatus''',
              '''const initialDrawingState: DrawingInteractionState = { kind: "idle" };

              interface CoordinatePlotEditorSession {
                readonly draft: CoordinatePlotDefinition;
                readonly expected: CoordinatePlotDefinition;
                readonly objectId: BoardObjectId;
                readonly selectedSeriesId: PlotSeriesId | null;
              }

              export interface AppPersistenceStatus''',
          )
          replace_once(
              "src/app/App.tsx",
              '''  const [selectionState, setSelectionState] = useState(initialSelectionState);
                const selectionStateRef = useRef<SelectionState>(initialSelectionState);''',
              '''  const [selectionState, setSelectionState] = useState(initialSelectionState);
                const selectionStateRef = useRef<SelectionState>(initialSelectionState);
                const [coordinatePlotEditor, setCoordinatePlotEditor] =
                  useState<CoordinatePlotEditorSession | null>(null);''',
          )
          replace_once(
              "src/app/App.tsx",
              '''  const activateTool = useCallback(
                (tool: ActiveToolId) => {''',
              '''  const activateTool = useCallback(
                (tool: ActiveToolId) => {''',
          )
          # Insert editor callbacks immediately after activateTool.
          marker = '''  const importImageFiles = useCallback(
            async (files: readonly File[]) => {'''
          callbacks = '''  const beginCoordinatePlotEditing = useCallback(
                (objectId: BoardObjectId) => {
                  const current = documentRef.current;
                  const object = current.objects[objectId];
                  const groupLocked =
                    object?.groupId === null || object?.groupId === undefined
                      ? false
                      : current.groups[object.groupId]?.locked === true;
                  if (
                    object?.kind !== "math.coordinate-plot" ||
                    object.source.kind !== "user" ||
                    object.locked ||
                    groupLocked
                  ) {
                    setBoardState((latest) => ({
                      ...latest,
                      commandError:
                        "Для редактирования выберите разблокированную пользовательскую координатную плоскость.",
                    }));
                    return;
                  }
                  const selected: SelectionState = {
                    interaction: { kind: "idle" },
                    selectedObjectIds: [object.id],
                  };
                  selectionStateRef.current = selected;
                  setSelectionState(selected);
                  activateTool(selectionToolId);
                  setCoordinatePlotEditor({
                    draft: object.definition,
                    expected: object.definition,
                    objectId: object.id,
                    selectedSeriesId:
                      object.definition.series.find(({ visible }) => visible)?.id ??
                      object.definition.series[0]?.id ??
                      null,
                  });
                },
                [activateTool],
              );

              const createCoordinatePlot = useCallback(() => {
                const current = documentRef.current;
                const workspace = workspaceRef.current?.getBoundingClientRect();
                const center =
                  lastPointerWorldRef.current ??
                  screenToWorld(
                    {
                      x: Math.max(1, workspace?.width ?? window.innerWidth) / 2,
                      y: Math.max(1, workspace?.height ?? window.innerHeight) / 2,
                    },
                    current.viewport,
                  );
                const token = crypto.randomUUID();
                let seriesSequence = 0;
                let parameterSequence = 0;
                const object = createDefaultCoordinatePlotObject({
                  center,
                  ids: {
                    objectId: boardObjectId(`object:plot:${token}`),
                    parameterId: () =>
                      plotParameterId(
                        `plot-parameter:${token}:${parameterSequence++}`,
                      ),
                    seriesId: () =>
                      plotSeriesId(`plot-series:${token}:${seriesSequence++}`),
                  },
                });
                const result = commitCommand({
                  ...createCommandMetadata(),
                  kind: "core.objects.add",
                  objects: [object],
                });
                if (result.ok) beginCoordinatePlotEditing(object.id);
              }, [
                beginCoordinatePlotEditing,
                commitCommand,
                createCommandMetadata,
              ]);

              const updateCoordinatePlotDraft = useCallback(
                (definition: CoordinatePlotDefinition) => {
                  setCoordinatePlotEditor((current) =>
                    current === null ? null : { ...current, draft: definition },
                  );
                },
                [],
              );

              const selectCoordinatePlotSeries = useCallback(
                (objectId: BoardObjectId, seriesId: PlotSeriesId | null) => {
                  setCoordinatePlotEditor((current) =>
                    current === null || current.objectId !== objectId
                      ? current
                      : { ...current, selectedSeriesId: seriesId },
                  );
                },
                [],
              );

              const updateCoordinatePlotViewport = useCallback(
                (objectId: BoardObjectId, viewport: CoordinatePlotDefinition["coordinateViewport"]) => {
                  setCoordinatePlotEditor((current) =>
                    current === null || current.objectId !== objectId
                      ? current
                      : {
                          ...current,
                          draft: {
                            ...current.draft,
                            coordinateViewport: viewport,
                          },
                        },
                  );
                },
                [],
              );

              const saveCoordinatePlotEditor = useCallback(() => {
                const session = coordinatePlotEditor;
                if (session === null) return;
                const result = commitCommand({
                  ...createCommandMetadata(),
                  expected: session.expected,
                  kind: "core.coordinate-plot.update",
                  objectId: session.objectId,
                  replacement: session.draft,
                });
                if (!result.ok) return;
                setCoordinatePlotEditor((current) =>
                  current === null || current.objectId !== session.objectId
                    ? current
                    : {
                        ...current,
                        expected: session.draft,
                      },
                );
                setAccessibilityNotice("Координатная плоскость сохранена");
              }, [
                commitCommand,
                coordinatePlotEditor,
                createCommandMetadata,
              ]);

              const addCoordinatePlotEditorSeries = useCallback(
                (kind: "explicit" | "parametric") => {
                  const id = plotSeriesId(`plot-series:${crypto.randomUUID()}`);
                  setCoordinatePlotEditor((current) => {
                    if (current === null) return null;
                    const draft = addCoordinatePlotSeries(current.draft, kind, id);
                    return {
                      ...current,
                      draft,
                      selectedSeriesId: id,
                    };
                  });
                },
                [],
              );

              const addCoordinatePlotEditorParameter = useCallback(() => {
                const id = plotParameterId(
                  `plot-parameter:${crypto.randomUUID()}`,
                );
                setCoordinatePlotEditor((current) =>
                  current === null
                    ? null
                    : {
                        ...current,
                        draft: addCoordinatePlotParameter(current.draft, id),
                      },
                );
              }, []);

              const coordinatePlotInteraction =
                useMemo<CoordinatePlotRenderInteraction>(
                  () => ({
                    activeObjectId: coordinatePlotEditor?.objectId ?? null,
                    selectedSeriesId:
                      coordinatePlotEditor?.selectedSeriesId ?? null,
                    ...(coordinatePlotEditor === null
                      ? {}
                      : { definitionOverride: coordinatePlotEditor.draft }),
                    onEditRequest: beginCoordinatePlotEditing,
                    onSelectedSeriesChange: selectCoordinatePlotSeries,
                    onViewportChange: updateCoordinatePlotViewport,
                  }),
                  [
                    beginCoordinatePlotEditing,
                    coordinatePlotEditor,
                    selectCoordinatePlotSeries,
                    updateCoordinatePlotViewport,
                  ],
                );

          ''' + marker
          replace_once("src/app/App.tsx", marker, callbacks)

          # Keyboard entry/exit and shortcut G.
          replace_once(
              "src/app/App.tsx",
              '''      const accelerator = event.ctrlKey || event.metaKey;''',
              '''      if (event.key === "Escape" && coordinatePlotEditor !== null) {
                event.preventDefault();
                setCoordinatePlotEditor(null);
                return;
              }
              if (
                event.key === "Enter" &&
                !editing &&
                selectionStateRef.current.selectedObjectIds.length === 1
              ) {
                const objectId = selectionStateRef.current.selectedObjectIds[0]!;
                if (documentRef.current.objects[objectId]?.kind === "math.coordinate-plot") {
                  event.preventDefault();
                  beginCoordinatePlotEditing(objectId);
                  return;
                }
              }
              const accelerator = event.ctrlKey || event.metaKey;''',
          )
          replace_once(
              "src/app/App.tsx",
              '''      if (event.key.toLowerCase() === "h") {
                activateTool(navigationToolId);
                return;
              }''',
