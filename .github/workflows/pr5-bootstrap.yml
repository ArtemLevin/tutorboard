                closeShortcuts,''',
              '''    activateTool,
                beginCoordinatePlotEditing,
                closeShortcuts,
                coordinatePlotEditor,
                createCoordinatePlot,''',
          )

          # Selection derivation and transformer suppression during internal editing.
          replace_once(
