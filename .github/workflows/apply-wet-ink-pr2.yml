name: Apply wet ink PR 2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/wet-ink-renderer
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply integration transform
        id: transform
        continue-on-error: true
        run: node .automation/apply-wet-ink-pr2.mjs > /tmp/wet-ink-transform.log 2>&1
      - name: Publish transform failure
        if: steps.transform.outcome == 'failure'
        run: |
          mkdir -p .automation
          cp /tmp/wet-ink-transform.log .automation/wet-ink-transform-error.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .automation/wet-ink-transform-error.log
          git commit -m "chore: publish wet ink transform error"
          git push origin HEAD:feature/wet-ink-renderer
          exit 1
      - name: Format integrated sources
        if: steps.transform.outcome == 'success'
        run: |
          npx prettier --write \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/adapters/canvas-konva/pointer-samples.ts \
            src/adapters/canvas-konva/public.ts \
            src/adapters/canvas-konva/wet-ink-renderer.ts \
            src/app/App.tsx \
            tests/e2e/wet-ink-renderer.spec.ts \
            tests/performance/wet-ink-renderer.test.ts \
            tests/unit/adapters/canvas-konva/predicted-pointer-samples.test.ts \
            tests/unit/adapters/canvas-konva/wet-ink-renderer.test.ts
      - name: Commit integrated implementation
        if: steps.transform.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(ink): integrate wet ink renderer"
          git push origin HEAD:feature/wet-ink-renderer
