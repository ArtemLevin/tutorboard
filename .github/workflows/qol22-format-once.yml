name: QoL Sprint 2 temporary formatter
on:
  push:
    branches:
      - feat/qol-2-2-viewport-bookmarks
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Format changed QoL files and remove temporary formatter
        run: |
          npx prettier --write src/app/board-chrome/viewport-bookmarks.ts src/app/board-chrome/viewport-bookmarks.test.ts src/app/board/views/BoardViewportBookmarks.tsx src/app/board/views/BoardViewportBookmarks.css tests/e2e/viewport-bookmarks.spec.ts
          git rm .github/workflows/qol22-format-once.yml
          git add src/app/board-chrome/viewport-bookmarks.ts src/app/board-chrome/viewport-bookmarks.test.ts src/app/board/views/BoardViewportBookmarks.tsx src/app/board/views/BoardViewportBookmarks.css tests/e2e/viewport-bookmarks.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(qol): format viewport bookmarks with pinned Prettier"
          git push origin HEAD:feat/qol-2-2-viewport-bookmarks
