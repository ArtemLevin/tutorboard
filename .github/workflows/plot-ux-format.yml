name: Temporary plot editor formatting
on:
  pull_request:
    paths:
      - '.github/workflows/plot-ux-format.yml'
      - 'src/app/CoordinatePlotEditorPanel.tsx'
      - 'src/app/CoordinatePlotEditorPanel.css'
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/plot-editor-ux-redesign-20261115
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/CoordinatePlotEditorPanel.tsx src/app/CoordinatePlotEditorPanel.css tests/e2e/coordinate-plot-visual.spec.ts tests/e2e/coordinate-plot-workspace.spec.ts tests/e2e/piecewise-coordinate-plot.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/CoordinatePlotEditorPanel.tsx src/app/CoordinatePlotEditorPanel.css tests/e2e/coordinate-plot-visual.spec.ts tests/e2e/coordinate-plot-workspace.spec.ts tests/e2e/piecewise-coordinate-plot.spec.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style(plot-ui): apply project Prettier formatting"
            git push origin HEAD:feat/plot-editor-ux-redesign-20261115
          fi
