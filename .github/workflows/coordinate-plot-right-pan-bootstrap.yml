name: Coordinate plot right-pan bootstrap

on:
  push:
    branches:
      - feature/coordinate-plot-right-drag-pan

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[skip right-pan bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/coordinate-plot-right-drag-pan
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply right-pan implementation
        run: node scripts/apply-coordinate-plot-right-drag-pan.mjs

      - name: Format
        run: npm run format

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run focused unit tests
        run: >-
          npm run test --
          tests/unit/adapters/canvas-konva/coordinate-plot-editing.test.ts
          tests/unit/adapters/canvas-konva/coordinate-plot-rendering.test.ts
          src/app/CoordinatePlotEditorPanel.test.tsx

      - name: Build
        run: npm run build

      - name: Publish product commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-coordinate-plot-right-drag-pan.mjs
          git add src tests docs
          git commit -m "feat: pan coordinate plots with the right mouse button [skip right-pan bootstrap]"
          git push origin HEAD:feature/coordinate-plot-right-drag-pan
