name: Temporary Smart Ink Studio Prettier probe
on:
  pull_request:
    paths:
      - 'tools/smart-ink-calibration-studio*'
      - 'tests/node/smart-ink-calibration-studio.test.mjs'
      - 'tests/e2e/smart-ink-calibration-studio.spec.ts'
      - 'vite.config.ts'
      - '.github/workflows/smart-ink-studio-format-probe.yml'
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write tools/smart-ink-calibration-studio.html tools/smart-ink-calibration-studio.mjs tools/smart-ink-calibration-studio-core.mjs tests/node/smart-ink-calibration-studio.test.mjs tests/e2e/smart-ink-calibration-studio.spec.ts vite.config.ts
          git diff -- tools/smart-ink-calibration-studio.html tools/smart-ink-calibration-studio.mjs tools/smart-ink-calibration-studio-core.mjs tests/node/smart-ink-calibration-studio.test.mjs tests/e2e/smart-ink-calibration-studio.spec.ts vite.config.ts
