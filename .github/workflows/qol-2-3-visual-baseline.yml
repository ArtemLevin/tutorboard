name: QoL 2.3 audited visual baseline update

on:
  push:
    branches: [feat/qol-2-3-lesson-mode]
    paths: [.github/workflows/qol-2-3-visual-baseline.yml]

permissions:
  contents: write

jobs:
  guarded-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm run e2e:plot-visual:update
      - name: Verify only audited bookmark and dock pixels changed
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { basename } from 'node:path';
          import { PNG } from 'pngjs';

          const directory='tests/e2e/coordinate-plot-visual.spec.ts-snapshots';
          const files=execFileSync('git',['diff','--name-only','--',directory],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const expected=['coordinate-plot-bounded-legend-visual-chromium-desktop-linux.png','coordinate-plot-bounded-legend-visual-firefox-desktop-linux.png','coordinate-plot-functions-visual-chromium-desktop-linux.png','coordinate-plot-functions-visual-firefox-desktop-linux.png'].sort();
          if(JSON.stringify(files.map(basename))!==JSON.stringify(expected)) {
            throw Error('Unexpected visual snapshot set: '+JSON.stringify(files));
          }
          for(const path of files) {
            const before=PNG.sync.read(execFileSync('git',['show',`HEAD:${path}`]));
            const after=PNG.sync.read(readFileSync(path));
            if(before.width!==1440||after.width!==1440||before.height!==900||after.height!==900) {
              throw Error('Unexpected dimensions: '+path);
            }
            let dock=0,bookmarks=0,unexpected=0;
            for(let y=0;y<after.height;y++) for(let x=0;x<after.width;x++) {
              const i=(y*after.width+x)*4;
              if([0,1,2,3].every(k=>before.data[i+k]===after.data[i+k])) continue;
              // Dedicated bounding margins from independently reviewed original/actual screenshots.
              if(y>=810 && x>=260 && x<=1180) dock++;
              else if(path.includes('bounded-legend') && y>=0 && y<=75 && x>=1290 && x<=1439) bookmarks++;
              else unexpected++;
            }
            if(unexpected!==0||dock<1000||dock>20000||
               (path.includes('bounded-legend') && (bookmarks<500||bookmarks>9000))||
               (!path.includes('bounded-legend') && bookmarks!==0)) {
              throw Error(`Snapshot mismatch outside audited zones: ${path}, dock=${dock}, bookmarks=${bookmarks}, unexpected=${unexpected}`);
            }
            process.stdout.write(`${basename(path)}: dock=${dock}, bookmarks=${bookmarks}, outside=0\n`);
          }
          NODE
      - name: Commit guarded visual baselines and remove one-time workflow
        run: |
          rm .github/workflows/qol-2-3-visual-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/coordinate-plot-visual.spec.ts-snapshots .github/workflows/qol-2-3-visual-baseline.yml
          git commit -m "test(qol): update audited bookmark and lesson-dock visual baselines"
          git push
