name: QoL 2.3 visual mismatch diagnostics

on:
  push:
    branches: [feat/qol-2-3-lesson-mode]
    paths: [.github/workflows/qol-2-3-visual-baseline.yml]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - name: Generate candidate visual baselines
        run: npm run e2e:plot-visual:update
      - name: Analyze all changed image regions
        run: |
          mkdir -p visual-evidence
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, copyFileSync } from 'node:fs';
          import { basename, join } from 'node:path';
          import { PNG } from 'pngjs';

          const dir='tests/e2e/coordinate-plot-visual.spec.ts-snapshots';
          const files=execFileSync('git',['diff','--name-only','--',dir],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          let report='';
          for(const path of files) {
            const before=PNG.sync.read(execFileSync('git',['show',`HEAD:${path}`]));
            const after=PNG.sync.read(readFileSync(path));
            if(before.width!==after.width||before.height!==after.height) throw Error('dimensions changed: '+path);
            let pixels=0,minX=after.width,minY=after.height,maxX=-1,maxY=-1;
            const buckets=new Array(Math.ceil(after.height/50)).fill(0);
            const diff=new PNG({width:after.width,height:after.height});
            for(let y=0;y<after.height;y++) for(let x=0;x<after.width;x++) {
              const i=(y*after.width+x)*4;
              const changed=[0,1,2,3].some(k=>before.data[i+k]!==after.data[i+k]);
              if(changed){pixels++;minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);buckets[Math.floor(y/50)]++;diff.data[i]=255;diff.data[i+1]=0;diff.data[i+2]=70;diff.data[i+3]=255;}
              else {diff.data[i]=0;diff.data[i+1]=0;diff.data[i+2]=0;diff.data[i+3]=255;}
            }
            const name=basename(path,'.png');
            writeFileSync(join('visual-evidence',name+'-before.png'),PNG.sync.write(before));
            copyFileSync(path,join('visual-evidence',name+'-after.png'));
            writeFileSync(join('visual-evidence',name+'-diff.png'),PNG.sync.write(diff));
            const line=`${name} pixels=${pixels},bbox=(${minX},${minY})-(${maxX},${maxY}), buckets50px=${JSON.stringify(buckets)}\n`;
            report+=line;
            process.stdout.write(line);
          }
          writeFileSync('visual-evidence/report.txt', report);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qol-2-3-visual-evidence
          path: visual-evidence
          retention-days: 7
