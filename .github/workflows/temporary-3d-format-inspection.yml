name: Temporary 3D format inspection
on:
  push:
    paths:
      - ".github/workflows/temporary-3d-format-inspection.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Print precise prettier diff
        run: npx prettier src/app/solid-3d/Solid3DEditorPanel.tsx | diff -u src/app/solid-3d/Solid3DEditorPanel.tsx - || true
