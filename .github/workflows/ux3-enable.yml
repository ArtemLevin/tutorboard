name: UX3 bootstrap enable

on:
  push:
    branches:
      - feature/coordinate-plot-ux-canvas-mobile

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-ux-canvas-mobile
          fetch-depth: 0
      - name: Enable implementation workflow on branch pushes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ux3-implementation.yml')
          source = path.read_text(encoding='utf-8')
          old = '''on:
            pull_request:
              paths:
                - .github/workflows/ux3-implementation.yml
          '''
          new = '''on:
            push:
              branches:
                - feature/coordinate-plot-ux-canvas-mobile
          '''
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ux3-implementation.yml
          git commit -m "chore: run UX3 implementation on branch push"
          git push origin HEAD:feature/coordinate-plot-ux-canvas-mobile
