name: Selection transform implementation helper

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/selection-transform-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/selection-transform-controls
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply prepared implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-selection-transform.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('"   const canGroup =\\n"', '"  const canGroup =\\n"')
          path.write_text(source, encoding='utf-8')
          PY
          python scripts/apply-selection-transform.py
      - name: Install dependencies
        run: npm ci
      - name: Format implementation
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Focused tests
        run: npx vitest run src/modules/selection/transform.test.ts
      - name: Remove one-time helper
        run: |
          rm scripts/apply-selection-transform.py
          rm .github/workflows/selection-transform-helper.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "feat: transform selected figures"
          git push origin HEAD:agent/selection-transform-controls
