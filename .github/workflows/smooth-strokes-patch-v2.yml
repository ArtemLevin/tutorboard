name: Apply smooth stroke integration v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature-smooth-freehand-strokes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature-smooth-freehand-strokes
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integrate adaptive smoothing
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"marker missing in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, count))

          replace(
              "src/adapters/canvas-konva/renderer-registry.tsx",
              '''export interface KonvaObjectRenderer {
            readonly kind: BoardObjectKind;
            render(object: BoardObject): ReactElement;
          }'''.replace("            ", ""),
              '''export interface KonvaRenderContext {
            readonly zoom: number;
          }

          export interface KonvaObjectRenderer {
            readonly kind: BoardObjectKind;
            render(object: BoardObject, context: KonvaRenderContext): ReactElement;
          }'''.replace("          ", ""),
          )
          replace(
              "src/adapters/canvas-konva/renderer-registry.tsx",
              "  render(item: BoardRenderItem): ReactElement {",
              '''  render(
            item: BoardRenderItem,
            context: KonvaRenderContext = { zoom: 1 },
          ): ReactElement {'''.replace("          ", ""),
          )
          replace(
              "src/adapters/canvas-konva/renderer-registry.tsx",
              "    return renderer.render(item.object);",
              "    return renderer.render(item.object, context);",
          )

          replace(
              "src/adapters/canvas-konva/BoardStage.tsx",
              """  options: {
    readonly interactive: boolean;
    readonly previewDelta?: Vec2 | null;
  },""",
              """  options: {
    readonly interactive: boolean;
    readonly previewDelta?: Vec2 | null;
    readonly zoom: number;
  },""",
          )
          replace(
              "src/adapters/canvas-konva/BoardStage.tsx",
              "{applyTransforms(registry.render(item), item.transforms)}",
              """{applyTransforms(
        registry.render(item, { zoom: options.zoom }),
        item.transforms,
      )}""",
          )
          replace(
              "src/adapters/canvas-konva/BoardStage.tsx",
              """                    interactive: true,
                    previewDelta:""",
              """                    interactive: true,
                    zoom: previewViewport.zoom,
                    previewDelta:""",
          )
          replace(
              "src/adapters/canvas-konva/BoardStage.tsx",
              "              renderItem(item, registry, { interactive: false }),",
              """              renderItem(item, registry, {
                interactive: false,
                zoom: previewViewport.zoom,
              }),""",
          )

          renderer = Path("src/adapters/canvas-konva/default-renderers.tsx")
          text = renderer.read_text()
          text = text.replace(
              'import { renderSafeMathLabel } from "../../shared/safe-math-label";\n',
              '''import { renderSafeMathLabel } from "../../shared/safe-math-label";
          import {
            buildCachedSmoothStrokePoints,
            buildSmoothStrokePoints,
            flattenStrokePoints,
          } from "../../shared/stroke-smoothing";
          '''.replace("          ", ""),
              1,
          )
          old = '''function linePoints(
            object: Extract<BoardObject, { readonly kind: "drawing.line" }>,
          ): readonly number[] {
            return object.style.strokeStyle === "wavy"
              ? createWavySegment(object.end)
              : [0, 0, object.end.x, object.end.y];
          }'''.replace("          ", "")
          new = '''function linePoints(
            object: Extract<BoardObject, { readonly kind: "drawing.line" }>,
            zoom: number,
          ): readonly number[] {
            return object.style.strokeStyle === "wavy"
              ? createWavySegment(object.end, zoom)
              : [0, 0, object.end.x, object.end.y];
          }

          function pointPairs(points: readonly number[]): readonly Vec2[] {
            const output: Vec2[] = [];
            for (let index = 0; index + 1 < points.length; index += 2) {
              output.push({ x: points[index]!, y: points[index + 1]! });
            }
            return output;
          }

          function smoothFlatPoints(
            points: readonly number[],
            zoom: number,
          ): readonly number[] {
            return flattenStrokePoints(
              buildSmoothStrokePoints(pointPairs(points), { zoom }),
            );
          }'''.replace("          ", "")
          if old not in text:
              raise SystemExit("linePoints marker missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '      tension={object.style.strokeStyle === "hand-pen" && !closed ? 0.12 : 0}\n    />',
              '      perfectDrawEnabled\n      tension={0}\n    />',
              1,
          )
          old = '''function sketchPoints(
            source: readonly Vec2[],
            pass: SketchPass,
            closed: boolean,
          ): readonly number[] {
            return createSketchPath(source, pass.intensity, pass.seed, closed);
          }'''.replace("          ", "")
          new = '''function sketchPoints(
            source: readonly Vec2[],
            pass: SketchPass,
            closed: boolean,
            zoom = 1,
          ): readonly number[] {
            const renderPoints = closed
              ? source
              : buildSmoothStrokePoints(source, { zoom });
            return createSketchPath(
              renderPoints,
              pass.intensity,
              pass.seed,
              closed,
            );
          }'''.replace("          ", "")
          if old not in text:
              raise SystemExit("sketchPoints marker missing")
          text = text.replace(old, new, 1)
          old = '''    render(object) {
            const stroke = expectKind(object, "drawing.pen-stroke");
            if (isSketchStrokeStyle(stroke.style.strokeStyle)) {
              return renderSketchPath(
                stroke,
                (pass) => sketchPoints(stroke.points, pass, false),
                false,
              );
            }
            return (
              <Line
                {...commonShapeProps(stroke)}
                {...strokeProps(stroke)}
                points={stroke.points.flatMap(({ x, y }) => [x, y])}
                tension={0}
              />
            );
          },'''.replace("          ", "")
          new = '''    render(object, context) {
            const stroke = expectKind(object, "drawing.pen-stroke");
            const smoothed = buildCachedSmoothStrokePoints(
              stroke.points,
              context.zoom,
            );
            if (isSketchStrokeStyle(stroke.style.strokeStyle)) {
              return renderSketchPath(
                stroke,
                (pass) => sketchPoints(smoothed, pass, false, context.zoom),
                false,
              );
            }
            return (
              <Line
                {...commonShapeProps(stroke)}
                {...strokeProps(stroke)}
                perfectDrawEnabled
                points={[...flattenStrokePoints(smoothed)]}
                tension={0}
              />
            );
          },'''.replace("          ", "")
          if old not in text:
              raise SystemExit("pen renderer marker missing")
          text = text.replace(old, new, 1)
          old = '''    render(object) {
            const line = expectKind(object, "drawing.line");
            if (isSketchStrokeStyle(line.style.strokeStyle)) {
              return renderSketchPath(
                line,
                (pass) => createHandDrawnSegment(line.end, pass.intensity, pass.seed),
                false,
              );
            }'''.replace("          ", "")
          new = '''    render(object, context) {
            const line = expectKind(object, "drawing.line");
            if (isSketchStrokeStyle(line.style.strokeStyle)) {
              return renderSketchPath(
                line,
                (pass) =>
                  smoothFlatPoints(
                    createHandDrawnSegment(
                      line.end,
                      pass.intensity,
                      pass.seed,
                      context.zoom,
                    ),
                    context.zoom,
                  ),
                false,
              );
            }'''.replace("          ", "")
          if old not in text:
              raise SystemExit("line renderer marker missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              "          points={[...linePoints(line)]}",
              "          perfectDrawEnabled\n          points={[...linePoints(line, context.zoom)]}",
              1,
          )
          renderer.write_text(text)

          style = Path("src/adapters/canvas-konva/stroke-style.ts")
          text = style.read_text()
          text = text.replace(
              "export function createWavySegment(end: Vec2): readonly number[] {",
              """export function createWavySegment(
            end: Vec2,
            zoom = 1,
          ): readonly number[] {""".replace("          ", ""),
              1,
          )
          text = text.replace(
              "  const samples = Math.max(12, Math.ceil(length / 8));",
              """  const renderZoom = Math.min(8, Math.max(0.1, zoom));
            const samples = Math.min(
              4096,
              Math.max(
                12,
                Math.ceil(length / Math.max(1.5, 8 / Math.sqrt(renderZoom))),
              ),
            );""".replace("          ", ""),
              1,
          )
          text = text.replace(
              "function segmentPoints(end: Vec2): readonly Vec2[] {",
              "function segmentPoints(end: Vec2, zoom = 1): readonly Vec2[] {",
              1,
          )
          text = text.replace(
              "  const samples = Math.max(8, Math.ceil(length / 12));",
              """  const renderZoom = Math.min(8, Math.max(0.1, zoom));
            const samples = Math.min(
              4096,
              Math.max(
                8,
                Math.ceil(length / Math.max(1.5, 12 / Math.sqrt(renderZoom))),
              ),
            );""".replace("          ", ""),
              1,
          )
          text = text.replace(
              "  const output: number[] = [];\n  for (let index = 0; index < sourcePoints.length; index += 1) {",
              """  const output: number[] = [];
            const pathDistances: number[] = [0];
            for (let index = 1; index < sourcePoints.length; index += 1) {
              const previous = sourcePoints[index - 1];
              const point = sourcePoints[index];
              pathDistances.push(
                (pathDistances[index - 1] ?? 0) +
                  (previous === undefined || point === undefined
                    ? 0
                    : Math.hypot(point.x - previous.x, point.y - previous.y)),
              );
            }
            for (let index = 0; index < sourcePoints.length; index += 1) {""".replace("          ", ""),
              1,
          )
          old_noise = '''    const progress = lastIndex === 0 ? 0 : index / lastIndex;
            const endpointEnvelope = closed
              ? 1
              : 0.22 + Math.sin(progress * Math.PI) * 0.78;
            const noise =
              Math.sin((index + 1) * (12.9898 + seed * 0.071) + seed * 0.37) * 0.68 +
              Math.cos((index + 1) * (4.123 + seed * 0.053) + point.x * 0.011) * 0.32;'''.replace("          ", "")
          new_noise = '''    const progress = lastIndex === 0 ? 0 : index / lastIndex;
            const endpointEnvelope = closed
              ? 1
              : 0.22 + Math.sin(progress * Math.PI) * 0.78;
            const distanceAlong = pathDistances[index] ?? 0;
            const noise =
              Math.sin(
                (distanceAlong + 1) * (0.17 + seed * 0.0017) + seed * 0.37,
              ) * 0.68 +
              Math.cos(
                (distanceAlong + 1) * (0.071 + seed * 0.0011) + point.x * 0.011,
              ) * 0.32;'''.replace("          ", "")
          if old_noise not in text:
              raise SystemExit("sketch noise marker missing")
          text = text.replace(old_noise, new_noise, 1)
          old = '''export function createHandDrawnSegment(
            end: Vec2,
            intensity: number,
            seed = 0,
          ): readonly number[] {
            return createSketchPath(segmentPoints(end), intensity, seed);
          }'''.replace("          ", "")
          new = '''export function createHandDrawnSegment(
            end: Vec2,
            intensity: number,
            seed = 0,
            zoom = 1,
          ): readonly number[] {
            return createSketchPath(segmentPoints(end, zoom), intensity, seed);
          }'''.replace("          ", "")
          if old not in text:
              raise SystemExit("hand segment marker missing")
          text = text.replace(old, new, 1)
          style.write_text(text)

          smoothing = Path("src/shared/stroke-smoothing.ts")
          text = smoothing.read_text()
          old = '''  const smoothed = buildSmoothStrokePoints(rawPoints, {
            maxOutputPoints: quality.maxOutputPoints,
            maxSubdivisions: quality.subdivisions,
            minPointDistance: quality.minPointDistance,
            minSubdivisions: quality.subdivisions,
            baseSegmentLength: quality.targetSegmentLength,
            zoom: quality.zoomBucket,
          });'''.replace("          ", "")
          new = '''  const smoothed = buildSmoothStrokePoints(rawPoints, {
            zoom: quality.zoomBucket,
          });'''.replace("          ", "")
          if old not in text:
              raise SystemExit("cache marker missing")
          smoothing.write_text(text.replace(old, new, 1))

          snapshot = Path("src/modules/document-transfer/snapshot.ts")
          text = snapshot.read_text()
          text = text.replace(
              'import { renderSafeMathLabel } from "../../shared/safe-math-label";\n',
              'import { renderSafeMathLabel } from "../../shared/safe-math-label";\nimport { buildSmoothStrokePoints } from "../../shared/stroke-smoothing";\n',
              1,
          )
          text = text.replace(
              "function objectMarkup(object: BoardObject): string {",
              "function objectMarkup(object: BoardObject, zoom: number): string {",
              1,
          )
          text = text.replace(
              '''    case "drawing.pen-stroke":
                return `<polyline ${common} points="${object.points.map(({ x, y }) => `${number(x)},${number(y)}`).join(" ")}"/>`;'''.replace("              ", ""),
              '''    case "drawing.pen-stroke": {
                const points = buildSmoothStrokePoints(object.points, { zoom });
                return `<polyline ${common} stroke-linecap="round" stroke-linejoin="round" points="${points.map(({ x, y }) => `${number(x)},${number(y)}`).join(" ")}"/>`;
              }'''.replace("              ", ""),
              1,
          )
          text = text.replace(
              "function itemMarkup(item: BoardRenderItem): string {",
              "function itemMarkup(item: BoardRenderItem, zoom: number): string {",
              1,
          )
          text = text.replace(
              "    objectMarkup(item.object),",
              "    objectMarkup(item.object, zoom),",
              1,
          )
          text = text.replace(
              '    visibleItems.map(itemMarkup).join(""),',
              '    visibleItems.map((item) => itemMarkup(item, scene.viewport.zoom)).join(""),',
              1,
          )
          snapshot.write_text(text)

          Path("tests/e2e/stroke-smoothing.spec.ts").write_text(r'''import { expect, test } from "@playwright/test";
          import type { Page } from "@playwright/test";

          async function stagePoint(page: Page, x: number, y: number) {
            const bounds = await page.getByTestId("board-stage").boundingBox();
            expect(bounds).not.toBeNull();
            if (bounds === null) throw new Error("Canvas has no bounds.");
            return { x: bounds.x + x, y: bounds.y + y };
          }

          test("keeps a freehand stroke transformable through high zoom", async ({ page }) => {
            await page.goto("/");
            await expect(
              page.getByRole("application", {
                name: "Бесконечное полотно TutorBoard",
              }),
            ).toBeVisible();
            await page.getByRole("button", { name: "Перо (P)" }).click();
            const points = [[260, 320], [300, 270], [350, 310], [410, 250], [470, 300]] as const;
            const first = await stagePoint(page, points[0][0], points[0][1]);
            await page.mouse.move(first.x, first.y);
            await page.mouse.down();
            for (const [x, y] of points.slice(1)) {
              const point = await stagePoint(page, x, y);
              await page.mouse.move(point.x, point.y, { steps: 6 });
            }
            await page.mouse.up();
            await expect(page.getByTestId("object-count")).toHaveText("1 объекта");
            await page.getByRole("button", { name: "Выделение (V)" }).click();
            const hit = await stagePoint(page, 350, 310);
            await page.mouse.click(hit.x, hit.y);
            await expect(page.getByTestId("selection-count")).toHaveText("1 выбрано");
            const zoomPoint = await stagePoint(page, 380, 290);
            await page.mouse.move(zoomPoint.x, zoomPoint.y);
            for (let index = 0; index < 18; index += 1) {
              await page.mouse.wheel(0, -240);
            }
            await expect(page.getByTestId("viewport-zoom")).not.toHaveText("100%");
            await expect(page.getByTestId("board-stage")).toHaveAttribute(
              "data-transformable-count",
              "1",
            );
            await page.getByRole("button", { name: "Увеличить выделение на 10%" }).click();
            await page.getByRole("button", { name: "Повернуть выделение на 15 градусов" }).click();
            await expect(page.getByTestId("first-object-transform")).toHaveText(
              "Масштаб: 1.1, 1.1 · Поворот: 15°",
            );
          });
          '''.replace("          ", ""))

          Path("docs/architecture/STROKE_SMOOTHING.md").write_text('''# Stroke smoothing

          Freehand `drawing.pen-stroke` objects retain their original BoardDocument points. Rendering uses deterministic resampling and Catmull–Rom interpolation from `src/shared/stroke-smoothing.ts`. Detail increases in quarter-step zoom buckets up to the canvas maximum, while bounded point budgets protect responsiveness.

          The shared implementation serves Konva and document snapshots. Pencil and pen sketchbook passes use a smoothed support curve, and marker strokes use the same curve with their wide translucent style. Straight lines and strict geometric primitives retain exact geometry. Cached results are keyed by the immutable source point array and zoom bucket.
          '''.replace("          ", ""))
          PY
          npx prettier --write src/shared/stroke-smoothing.ts src/shared/stroke-smoothing.test.ts src/adapters/canvas-konva/renderer-registry.tsx src/adapters/canvas-konva/BoardStage.tsx src/adapters/canvas-konva/default-renderers.tsx src/adapters/canvas-konva/stroke-style.ts src/modules/document-transfer/snapshot.ts tests/e2e/stroke-smoothing.spec.ts docs/architecture/STROKE_SMOOTHING.md
          npm run typecheck
          npm run test -- src/shared/stroke-smoothing.test.ts src/adapters/canvas-konva/stroke-style.test.ts
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/smooth-strokes-patch.yml .github/workflows/smooth-strokes-patch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: smooth freehand strokes at high zoom"
          git push origin HEAD:feature-smooth-freehand-strokes
