name: Temporary coordinate plot snapshot refresh
on:
  pull_request:
    paths:
      - '.github/workflows/piecewise-refresh-visual.yml'
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/piecewise-math-invariants-20261115
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - name: Refresh coordinate plot visual snapshots
        run: npm run e2e:plot-visual:update
      - name: Commit expected visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/coordinate-plot-visual.spec.ts-snapshots
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "test(plot): refresh visual baselines for piecewise editor"
            git push origin HEAD:fix/piecewise-math-invariants-20261115
          fi
