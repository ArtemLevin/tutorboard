name: Handwritten function formatter

on:
  push:
    branches:
      - feat/handwritten-function-session

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format-bot]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/handwritten-function-session
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed source
        run: npx prettier --write src/modules/handwritten-function tests/unit/modules/handwritten-function
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/handwritten-function tests/unit/modules/handwritten-function
          git commit -m "style: format handwritten function files [skip-format-bot]"
          git push origin HEAD:feat/handwritten-function-session
