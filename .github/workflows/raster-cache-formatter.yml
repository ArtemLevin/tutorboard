name: Raster cache formatter

on:
  push:
    branches:
      - perf/raster-decode-cache

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/adapters/canvas-konva/board-scene-content.tsx src/adapters/canvas-konva/raster-decode-cache.ts src/app/image-import.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format raster decode cache"
          git push origin HEAD:perf/raster-decode-cache
