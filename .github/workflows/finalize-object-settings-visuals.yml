name: Finalize object settings visuals

on:
  push:
    branches:
      - feature/object-settings-right-double-click

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/object-settings-right-double-click
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/finalize-object-settings-visuals.mjs
      - run: npx --yes prettier@3.9.6 --write src/app/App.tsx tests/e2e/coordinate-plot-interaction.ts
      - name: Commit product-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx tests/e2e/coordinate-plot-interaction.ts
          git rm .github/workflows/finalize-object-settings-visuals.yml scripts/finalize-object-settings-visuals.mjs
          git commit -m "fix: stabilize object settings visual coverage"
          git push origin HEAD:feature/object-settings-right-double-click
