name: UX2 format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-ux-structure-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/coordinate-plot-production.spec.ts
      - run: npx prettier --check tests/e2e/coordinate-plot-production.spec.ts
      - name: Push formatted lifecycle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/coordinate-plot-production.spec.ts
          git commit -m "style: format coordinate plot discovery lifecycle"
          git push origin HEAD:feature/coordinate-plot-ux-structure-discovery
