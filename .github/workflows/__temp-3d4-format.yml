name: Temporary 3D-4A formatter

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          src/adapters/solid-3d-three/Solid3DViewport.tsx
          src/app/solid-3d/Solid3DOrientationEditor.tsx
          src/core/solid-3d/model-transform.ts
          tests/unit/core/solid-3d/model-transform.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/solid-3d-three/Solid3DViewport.tsx src/app/solid-3d/Solid3DOrientationEditor.tsx src/core/solid-3d/model-transform.ts tests/unit/core/solid-3d/model-transform.test.ts
          git commit -m "style(3d): apply Prettier to 3D-4A"
          git push
