name: Temporary static IndexedDB style

on:
  pull_request:
    paths:
      - .github/workflows/c39-static-idb-formatter.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format test helper and print source
        run: |
          set -euo pipefail
          npx prettier --write tests/e2e/c39-large-board-profile.spec.ts
          printf 'C39IDBFMT='
          base64 -w0 tests/e2e/c39-large-board-profile.spec.ts
          printf '\n'
