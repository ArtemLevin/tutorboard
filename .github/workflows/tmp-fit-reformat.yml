name: Temporary viewport formatting repair
on:
  push:
    branches:
      - feat/qol-4-fit-board-viewport
permissions:
  contents: write
jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/App.tsx src/app/board/viewport-fit.ts src/app/board/viewport-fit.test.ts
      - name: Commit format
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/board/viewport-fit.ts src/app/board/viewport-fit.test.ts
          git commit -m "style(qol): format refactored viewport fitting"
          git push origin HEAD:feat/qol-4-fit-board-viewport
