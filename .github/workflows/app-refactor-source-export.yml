name: Apply App decomposition

on:
  push:
    branches:
      - agent/app-decomposition

permissions:
  contents: write

concurrency:
  group: app-decomposition-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/app-decomposition

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Assemble and verify staged refactor
        run: |
          cat .github/refactor-payload/* > /tmp/refactor-files.b64
          test "$(wc -c < /tmp/refactor-files.b64)" -eq 45108
          echo "8ade07f653b8ae6d5a2eea5b669c2e61663e49e67d60b0b9f03edb40a7d181e1  /tmp/refactor-files.b64" | sha256sum --check
          base64 --decode /tmp/refactor-files.b64 | tar -xzf -
          rm .github/app-refactor-files.b64
          rm -rf .github/refactor-payload
          rm .github/workflows/app-refactor-source-export.yml

      - name: Format refactor
        run: npm run format

      - name: Validate lint
        run: npm run lint

      - name: Validate types
        run: npm run typecheck

      - name: Validate unit tests
        run: npm run test

      - name: Validate architecture
        run: npm run architecture

      - name: Validate production build
        run: npm run build

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(app): decompose board orchestration"
          git push origin HEAD:agent/app-decomposition
