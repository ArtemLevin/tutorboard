name: Apply App decomposition

on:
  push:
    branches:
      - agent/app-decomposition

permissions:
  contents: write

concurrency:
  group: app-decomposition-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/app-decomposition

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore verified staged refactor
        env:
          SOURCE_COMMIT: bf9354437a7654d3d59a2bdf12c7f5ba10f95a2a
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          : > /tmp/refactor-files.b64
          for chunk in 00 01 02 03 04; do
            git show "${SOURCE_COMMIT}:.github/refactor-payload/${chunk}" >> /tmp/refactor-files.b64
          done
          test "$(wc -c < /tmp/refactor-files.b64)" -eq 45108
          echo "8ade07f653b8ae6d5a2eea5b669c2e61663e49e67d60b0b9f03edb40a7d181e1  /tmp/refactor-files.b64" | sha256sum --check
          base64 --decode /tmp/refactor-files.b64 | tar -xzf -

      - name: Apply final refactor corrections
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path("src/app/App.tsx")
          source = app.read_text()
          source = source.replace(
              """  const selectionInspectorOpen =\n    plots.editor === null &&\n    selectionInspectorObjectId !== null &&\n    selection.state.selectedObjectIds.includes(selectionInspectorObjectId);\n""",
              """  const selectionInspectorOpen =\n    plots.editor === null &&\n    selectionInspectorObjectId !== null &&\n    Object.hasOwn(document.objects, selectionInspectorObjectId) &&\n    selection.state.selectedObjectIds.includes(selectionInspectorObjectId);\n""",
          )
          stale_inspector_effect = """\n  useEffect(() => {\n    if (\n      selectionInspectorObjectId !== null &&\n      (!Object.hasOwn(document.objects, selectionInspectorObjectId) ||\n        !selection.state.selectedObjectIds.includes(selectionInspectorObjectId))\n    ) {\n      setSelectionInspectorObjectId(null);\n    }\n  }, [\n    document.objects,\n    selectionInspectorObjectId,\n    selection.state.selectedObjectIds,\n  ]);\n"""
          if stale_inspector_effect not in source:
              raise SystemExit("selection inspector effect not found")
          app.write_text(source.replace(stale_inspector_effect, "\n"))

          geometry = Path("src/app/board/controllers/useBoardGeometryController.ts")
          source = geometry.read_text()
          stale_vertex_effect = """\n  useEffect(() => {\n    if (\n      vertexObjectId !== null &&\n      inspectTextShapeVertex(document, vertexObjectId) === null\n    ) {\n      setVertexObjectId(null);\n    }\n  }, [document, vertexObjectId]);\n"""
          if stale_vertex_effect not in source:
              raise SystemExit("stale vertex effect not found")
          source = source.replace(stale_vertex_effect, "\n")
          source = source.replace(
              """  const selectedVertex = useMemo(\n    () =>\n      vertexObjectId === null\n        ? null\n        : inspectTextShapeVertex(document, vertexObjectId),\n    [document, vertexObjectId],\n  );\n""",
              """  const selectedVertex = useMemo(\n    () =>\n      vertexObjectId === null\n        ? null\n        : inspectTextShapeVertex(document, vertexObjectId),\n    [document, vertexObjectId],\n  );\n  const effectiveVertexObjectId = selectedVertex?.vertexObjectId ?? null;\n""",
          )
          source = source.replace(
              """    (kind: VertexConstructionKind) => {\n      if (vertexObjectId === null) return;\n      const command = createVertexConstructionCommand({\n        document: getDocument(),\n        kind,\n        metadata: createCommandMetadata(),\n        token: crypto.randomUUID(),\n        vertexObjectId,\n      });\n""",
              """    (kind: VertexConstructionKind) => {\n      if (effectiveVertexObjectId === null) return;\n      const command = createVertexConstructionCommand({\n        document: getDocument(),\n        kind,\n        metadata: createCommandMetadata(),\n        token: crypto.randomUUID(),\n        vertexObjectId: effectiveVertexObjectId,\n      });\n""",
          )
          source = source.replace(
              """    [announce, commitCommand, createCommandMetadata, getDocument, vertexObjectId],\n""",
              """    [\n      announce,\n      commitCommand,\n      createCommandMetadata,\n      effectiveVertexObjectId,\n      getDocument,\n    ],\n""",
          )
          source = source.replace(
              """    vertexObjectId,\n  } as const;\n""",
              """    vertexObjectId: effectiveVertexObjectId,\n  } as const;\n""",
          )
          geometry.write_text(source)

          rules = Path("scripts/architecture-rules.mjs")
          source = rules.read_text()
          old_guard = '      if (target?.layer === "modules" || target?.layer === "adapters") {\n'
          new_guard = '''      if (\n        (target?.layer === "modules" || target?.layer === "adapters") &&\n        isPublicModuleImport(specifier)\n      ) {\n'''
          if old_guard not in source:
              raise SystemExit("APP-001 guard not found")
          rules.write_text(source.replace(old_guard, new_guard, 1))

          tests = Path("tests/architecture/architecture-rules.test.mjs")
          source = tests.read_text()
          anchor = '''  it("requires app composition to use module public contracts", () => {\n    expect(\n      analyze(\n        "app/App.tsx",\n        'import { drawingTools } from "../modules/drawing/tools";',\n      ),\n    ).toEqual([\n      expect.objectContaining({\n        invariant: "ARCH-004",\n      }),\n    ]);\n  });\n\n'''
          addition = anchor + '''  it("keeps App.tsx as a thin composition root", () => {\n    expect(\n      analyze(\n        "app/App.tsx",\n        'import { drawingTools } from "../modules/drawing/public";',\n      ),\n    ).toEqual([\n      expect.objectContaining({\n        invariant: "APP-001",\n      }),\n    ]);\n  });\n\n'''
          if anchor not in source:
              raise SystemExit("architecture test anchor not found")
          tests.write_text(source.replace(anchor, addition, 1))
          PY

      - name: Remove temporary staging transport
        run: |
          rm -f .github/app-refactor-files.b64
          rm -rf .github/refactor-payload
          rm .github/workflows/app-refactor-source-export.yml

      - name: Format refactor
        run: npm run format

      - name: Validate lint
        run: npm run lint

      - name: Validate types
        run: npm run typecheck

      - name: Validate unit tests
        run: npm run test

      - name: Validate architecture
        run: npm run architecture

      - name: Validate production build
        run: npm run build

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(app): decompose board orchestration"
          git push origin HEAD:agent/app-decomposition
