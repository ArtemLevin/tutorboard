name: C3.9-S5.3 one-time formatter
on:
  pull_request:
    paths:
      - .github/workflows/c39-s5-s3-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/c39-s5-s3-guarded-konva-crop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Format touched source using locked Prettier
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/adapters/canvas-konva/board-scene-content.tsx \
            src/adapters/canvas-konva/wheel-ink-cache.ts \
            tests/unit/adapters/canvas-konva/bounded-ink-activation.test.ts \
            tests/e2e/c39-s5-crop-fidelity.spec.ts
          git diff --check
          git add \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/adapters/canvas-konva/board-scene-content.tsx \
            src/adapters/canvas-konva/wheel-ink-cache.ts \
            tests/unit/adapters/canvas-konva/bounded-ink-activation.test.ts \
            tests/e2e/c39-s5-crop-fidelity.spec.ts
          if ! git diff --cached --quiet; then
            git -c user.name='TutorBoard CI Formatter' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format S5.3 guarded crop and fidelity tests'
            git push origin 'HEAD:refs/heads/perf/c39-s5-s3-guarded-konva-crop'
          fi
