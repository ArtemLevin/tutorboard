name: Temporary F2 focused test formatter

on:
  push:
    branches:
      - feat/media-asset-renderer-a2

permissions:
  contents: write

jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write tests/unit/adapters/canvas-konva/raster-decode-cache.test.ts
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/adapters/canvas-konva/raster-decode-cache.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(media): format asset decoder regression tests"
          git push origin HEAD:feat/media-asset-renderer-a2
