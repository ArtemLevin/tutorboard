name: Apply lasso selection

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/lasso-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/lasso-selection
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply lasso integration
        run: |
          python3 scripts/apply-lasso-selection.py
          rm -f scripts/apply-lasso-selection.mjs
          sed -i 's/import { normalizeRect, type Rect2 } from "\.\/interaction";/import type { Rect2 } from "\.\/interaction";/' src/modules/selection/geometry.ts
          sed -i 's/readonly areaOperation: BoardSelectionAreaOperation;/readonly areaOperation?: BoardSelectionAreaOperation;/' src/adapters/canvas-konva/BoardStage.tsx
          sed -i 's/areaOperation: sample.areaOperation,/areaOperation: sample.areaOperation ?? (sample.additive ? "add" : "replace"),/' src/app/App.tsx
          python3 <<'PY'
          from pathlib import Path
          path = Path("src/modules/selection/interaction.ts")
          text = path.read_text()
          old = '''      const baseObjectIds = areaBaseSelection(
                  state.selectedObjectIds,
                  operation,
                );'''
          new = '''      const baseObjectIds = state.selectedObjectIds;
                const selectedObjectIds = areaBaseSelection(
                  state.selectedObjectIds,
                  operation,
                );'''
          if old not in text:
              raise SystemExit("lasso base selection marker missing")
          text = text.replace(old, new, 1)
          text = text.replace("selectedObjectIds: baseObjectIds,", "selectedObjectIds,", 2)
          path.write_text(text)
          PY

      - name: Format changed sources
        run: |
          npx prettier --write \
            src/app/App.tsx \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/adapters/canvas-konva/public.ts \
            src/modules/selection/interaction.ts \
            src/modules/selection/geometry.ts \
            src/modules/selection/tools.ts \
            src/modules/selection/public.ts \
            src/modules/selection/interaction-lasso.test.ts \
            src/modules/selection/geometry-lasso.test.ts \
            tests/e2e/selection.spec.ts

      - name: Verify focused implementation
        run: |
          npm run lint
          npm run typecheck
          npm run test -- \
            src/modules/selection/interaction-lasso.test.ts \
            src/modules/selection/geometry-lasso.test.ts

      - name: Commit product changes
        run: |
          rm -f scripts/apply-lasso-selection.py
          rm -f .github/workflows/apply-lasso-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add freeform lasso selection"
          git push origin HEAD:feature/lasso-selection
