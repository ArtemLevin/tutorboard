name: Input UX foundation verification

on:
  push:
    branches: [feat/input-ux-contract-foundation]

permissions:
  contents: write

concurrency:
  group: input-ux-foundation-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/input-ux-contract-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format foundation sources and tests
        run: |
          npx prettier --write \
            src/core/board/document.ts \
            src/core/board/vector-ink.ts \
            src/core/board/validation/schema.ts \
            src/core/board/migrations.ts \
            src/core/board/validation/read.ts \
            src/core/board/serialization/serialization.ts \
            src/core/board/commands/commands.ts \
            src/core/board/commands/reducer.ts \
            src/core/board/commands/codec/command-codec.ts \
            src/core/ports/board-sync-repository.ts \
            src/core/public.ts \
            src/modules/server-sync/sync.ts \
            src/modules/server-sync/undo.ts \
            src/adapters/board-http/client.ts \
            src/core/board/media-asset-contract.test.ts \
            tests/integration/coordinate-plot-sync.test.ts \
            tests/unit/adapters/board-http/client.test.ts \
            tests/unit/core/vector-ink.test.ts \
            tests/unit/core/reducer.test.ts \
            tests/unit/modules/server-sync/undo.test.ts \
            scripts/board-contract-lib.mjs
      - run: npm run board-contract:generate
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/input-ux-foundation-verification.yml
          git add src tests scripts contracts
          git commit -m "chore: verify input UX contract foundation" || true
          git push origin HEAD:feat/input-ux-contract-foundation
      - run: npm run board-contract:check
      - run: npm run typecheck
      - name: Focused foundation tests
        run: |
          npm run test -- \
            tests/unit/core/vector-ink-contract.test.ts \
            tests/unit/core/vector-ink.test.ts \
            tests/unit/core/reducer.test.ts \
            tests/unit/core/board/commands/codec.test.ts \
            tests/unit/modules/server-sync/undo.test.ts \
            tests/unit/modules/server-sync/sync.test.ts \
            tests/unit/adapters/board-http/client.test.ts \
            tests/integration/coordinate-plot-sync.test.ts
