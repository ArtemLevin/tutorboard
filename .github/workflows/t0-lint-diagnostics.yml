name: T0 lint correction

on:
  push:
    branches:
      - agent/t0-frontend-security-prep

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/t0-frontend-security-prep
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply evidence effect correction
        run: node scripts/t0-remove-evidence-effect.mjs
      - name: Remove diagnostic output
        run: rm -f t0-lint-output.txt
      - name: Format repository
        run: npm run format
      - name: Verify lint
        run: npm run lint
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: avoid synchronous evidence effect update"
          git push origin HEAD:agent/t0-frontend-security-prep
