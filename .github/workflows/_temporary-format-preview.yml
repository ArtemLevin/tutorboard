name: Temporary format diagnostics
on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Print exact Prettier edits for extended performance test
        run: |
          ./node_modules/.bin/prettier --write tests/e2e/media-performance.spec.ts
          git diff -- tests/e2e/media-performance.spec.ts
