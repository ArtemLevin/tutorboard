name: Apply P0 codec type fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-command-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-command-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Adapt validated Zod values to domain readonly types
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/core/board/commands/codec/command-codec.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('path: issue.path,', 'path: [...issue.path],')
          text = text.replace('return object satisfies BoardObject;', 'return object as BoardObject;')
          text = text.replace('return group satisfies BoardGroup;', 'return group as BoardGroup;')
          text = text.replace(
              'return imported satisfies GeometryImportRecord;',
              'return imported as GeometryImportRecord;',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm run format
      - name: Remove temporary workflow
        run: rm -f .github/workflows/automation-type-fix-p0.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sync): adapt decoded commands to domain types"
          git push origin HEAD:feature/p0-command-integrity
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run architecture
      - run: npm run build
