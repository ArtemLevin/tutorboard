name: Paddle formula sidecar gate

on:
  pull_request:
    paths:
      - ".github/workflows/paddle-formula-sidecar.yml"
      - "deploy/math-ink.compose.yml"
      - "deploy/paddle-formula.compose.yml"
      - "deploy/paddle-formula.gpu.compose.yml"
      - "services/math-ink-proxy/**"
      - "services/paddle-formula-sidecar/**"
      - "tests/node/math-ink-proxy-*.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/paddle-formula-sidecar.yml"
      - "deploy/math-ink.compose.yml"
      - "deploy/paddle-formula.compose.yml"
      - "deploy/paddle-formula.gpu.compose.yml"
      - "services/math-ink-proxy/**"
      - "services/paddle-formula-sidecar/**"
      - "tests/node/math-ink-proxy-*.test.mjs"

permissions:
  contents: read

concurrency:
  group: paddle-formula-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    name: Paddle formula sidecar
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/paddle-formula-sidecar/requirements-api.txt
            services/paddle-formula-sidecar/requirements-dev.txt
            services/paddle-formula-sidecar/requirements-security.txt

      - name: Install sidecar test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement services/paddle-formula-sidecar/requirements-dev.txt

      - name: Check Python formatting
        working-directory: services/paddle-formula-sidecar
        run: python -m ruff format --check app.py tests

      - name: Lint Python
        working-directory: services/paddle-formula-sidecar
        run: python -m ruff check app.py tests

      - name: Compile Python sources
        run: python -m compileall -q services/paddle-formula-sidecar

      - name: Run sidecar contract tests
        working-directory: services/paddle-formula-sidecar
        run: python -m pytest

      - name: Validate CPU and GPU Dockerfiles
        run: |
          docker build --check \
            --file services/paddle-formula-sidecar/Dockerfile.cpu \
            .
          docker build --check \
            --file services/paddle-formula-sidecar/Dockerfile.gpu \
            .

      - name: Build CPU sidecar image
        run: |
          docker build \
            --file services/paddle-formula-sidecar/Dockerfile.cpu \
            --tag tutorboard-paddle-formula:${GITHUB_SHA} \
            .

      - name: Verify CPU image runtime
        run: |
          test "$(docker inspect --format '{{.Config.User}}' tutorboard-paddle-formula:${GITHUB_SHA})" = "10001:10001"
          docker run --rm \
            --entrypoint python \
            tutorboard-paddle-formula:${GITHUB_SHA} \
            -c "from importlib.metadata import distributions, version; from pathlib import Path; import sysconfig; import paddle; from paddleocr import FormulaRecognition; import app; expected={'PaddlePaddle':'3.3.1','Pillow':'12.3.0','msgpack':'1.2.1','protobuf':'6.33.5','setuptools':'83.0.0'}; actual={name:version(name) for name in expected}; records=list(distributions()); installed={distribution.metadata['Name'].lower() for distribution in records if distribution.metadata['Name']}; wheel_locations=[str(Path(distribution.locate_file('')).resolve()) for distribution in records if distribution.metadata['Name'] and distribution.metadata['Name'].lower() == 'wheel']; site_packages=Path(sysconfig.get_paths()['purelib']).resolve(); print({'actual':actual,'installer_distributions':sorted(installed & {'pip','wheel','setuptools'}),'wheel_locations':wheel_locations,'service_version':app.SERVICE_VERSION}); assert actual == expected, {'expected':expected,'actual':actual}; assert app.SERVICE_VERSION == '1.0.1', app.SERVICE_VERSION; assert 'pip' not in installed, installed; assert 'setuptools' in installed, installed; assert not (site_packages / 'wheel').exists(), site_packages / 'wheel'; assert not list(site_packages.glob('wheel-*.dist-info')), list(site_packages.glob('wheel-*.dist-info')); assert all('/setuptools/_vendor' in location.replace('\\','/') for location in wheel_locations), wheel_locations; print(paddle.__version__, FormulaRecognition.__name__)"

      - name: Validate Compose overlays
        env:
          PADDLE_FORMULA_API_TOKEN: ci-paddle-token
        run: |
          docker compose \
            --file deploy/math-ink.compose.yml \
            --file deploy/paddle-formula.compose.yml \
            config > /tmp/paddle-formula-cpu.yml
          docker compose \
            --file deploy/math-ink.compose.yml \
            --file deploy/paddle-formula.compose.yml \
            --file deploy/paddle-formula.gpu.compose.yml \
            config > /tmp/paddle-formula-gpu.yml
          grep --fixed-strings 'PADDLE_OCR_ALLOW_INSECURE_UPSTREAM: "true"' \
            /tmp/paddle-formula-cpu.yml
          grep --fixed-strings 'FORMULA_RECOGNITION_TRUSTED_PROXY_HOPS: "1"' \
            /tmp/paddle-formula-cpu.yml
          grep --fixed-strings 'http://paddle-formula:8080/v1/recognize' \
            /tmp/paddle-formula-cpu.yml
          grep --fixed-strings 'YANDEX_OCR_ALLOW_INSECURE_UPSTREAM: "false"' \
            /tmp/paddle-formula-cpu.yml
          grep --fixed-strings 'PADDLE_FORMULA_DEVICE: gpu:0' \
            /tmp/paddle-formula-gpu.yml
          grep --fixed-strings 'PADDLE_FORMULA_ENABLE_MKLDNN: "false"' \
            /tmp/paddle-formula-gpu.yml
          if grep --fixed-strings 'FORMULA_RECOGNITION_ALLOW_INSECURE_UPSTREAM' \
            /tmp/paddle-formula-cpu.yml; then
            exit 1
          fi

      - name: Enforce CPU sidecar vulnerability threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tutorboard-paddle-formula:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln

      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tutorboard-paddle-formula:${{ github.sha }}
          format: sarif
          output: trivy-paddle-formula.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          limit-severities-for-sarif: true
          scanners: vuln

      - name: Upload Trivy results
        if: ${{ always() && hashFiles('trivy-paddle-formula.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-paddle-formula.sarif
