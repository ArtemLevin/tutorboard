name: Apply canvas gesture eligibility fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/canvas-primary-gesture-arbitration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply eligibility correction
        run: node .automation/apply-canvas-gesture-eligibility-fix.mjs

      - name: Format and validate
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Run Chromium regression matrix
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --project=chromium tests/e2e/canvas-mode-gestures.spec.ts tests/e2e/drawing-tools.spec.ts tests/e2e/selection.spec.ts tests/e2e/text-editing.spec.ts tests/e2e/canvas-context-menu.spec.ts tests/e2e/object-settings-right-double-click.spec.ts

      - name: Run Firefox gesture and placement matrix
        run: |
          npx playwright install --with-deps firefox
          npm run e2e -- --project=firefox tests/e2e/canvas-mode-gestures.spec.ts tests/e2e/drawing-tools.spec.ts tests/e2e/text-editing.spec.ts

      - name: Publish product changes
        run: |
          rm -rf .automation
          rm -f .github/workflows/apply-canvas-gesture-eligibility-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(canvas): scope quick gestures to compatible tools'
          git fetch origin fix/canvas-primary-gesture-arbitration
          git rebase origin/fix/canvas-primary-gesture-arbitration
          git push origin HEAD:fix/canvas-primary-gesture-arbitration
