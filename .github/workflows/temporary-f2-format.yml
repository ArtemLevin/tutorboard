name: Temporary F2 exact Prettier formatter

on:
  push:
    branches:
      - feat/media-asset-renderer-a2

permissions:
  contents: write

jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only F2 changed TypeScript
        run: |
          npx prettier --write \
            src/adapters/canvas-konva/raster-decode-cache.ts \
            src/adapters/canvas-konva/embedded-image-renderer.tsx \
            src/adapters/canvas-konva/media-object-url-cache.ts \
            src/adapters/canvas-konva/media-asset-renderer.tsx \
            src/adapters/canvas-konva/default-renderers.tsx \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/app/App.tsx \
            src/app/SyncedApp.tsx \
            src/app/board/views/BoardCanvas.tsx \
            tests/unit/adapters/canvas-konva/raster-decode-cache.test.ts \
            tests/unit/adapters/canvas-konva/media-object-url-cache.test.ts \
            tests/unit/adapters/canvas-konva/renderer-registry.test.tsx
          git diff --check
          git diff --stat
      - name: Commit mechanical formatting if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/canvas-konva src/app/App.tsx src/app/SyncedApp.tsx src/app/board/views/BoardCanvas.tsx tests/unit/adapters/canvas-konva
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(media): apply Prettier formatting"
          git push origin HEAD:feat/media-asset-renderer-a2
