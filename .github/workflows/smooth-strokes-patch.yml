name: Apply smooth stroke integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature-smooth-freehand-strokes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature-smooth-freehand-strokes
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply corrected integration patch
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          stage = Path('src/adapters/canvas-konva/BoardStage.tsx')
          text = stage.read_text()
          text, count = re.subn(
              r'(options:\s*\{\s*readonly interactive: boolean;\s*readonly previewDelta\?: Vec2 \| null;)(\s*\},)',
              r'\1\n    readonly zoom: number;\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('BoardStage options marker missing')
          text = text.replace(
              '{applyTransforms(registry.render(item), item.transforms)}',
              '''{applyTransforms(
                registry.render(item, { zoom: options.zoom }),
                item.transforms,
              )}'''.replace('              ', ''),
              1,
          )
          text, count = re.subn(
              r'(interactive: true,\n)(\s*)(previewDelta:)',
              r'\1\2zoom: previewViewport.zoom,\n\2\3',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('BoardStage interactive marker missing')
          text, count = re.subn(
              r'renderItem\(item, registry, \{ interactive: false \}\)',
              '''renderItem(item, registry, {
                interactive: false,
                zoom: previewViewport.zoom,
              })'''.replace('              ', ''),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('BoardStage preview marker missing')
          stage.write_text(text)

          lines = Path('.github/workflows/smooth-strokes-patch-v2.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          finish = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:finish]]
          code = '\n'.join(body) + '\n'
          board_start = code.index('replace(\n    "src/adapters/canvas-konva/BoardStage.tsx"')
          renderer_start = code.index('renderer = Path("src/adapters/canvas-konva/default-renderers.tsx")')
          code = code[:board_start] + code[renderer_start:]
          code = code.replace(
              "r'  \\\{\\n    kind: \"drawing\\.line\",[\\s\\S]*?\\n  \\\},\\n  \\\{',",
              "r'\\{\\n    kind: \"drawing\\.line\",[\\s\\S]*?\\n  \\\},\\n  \\\{',",
          )
          exec(compile(code, 'smooth-strokes-patch-v2', 'exec'))
          PY
          npx prettier --write src/shared/stroke-smoothing.ts src/shared/stroke-smoothing.test.ts src/adapters/canvas-konva/renderer-registry.tsx src/adapters/canvas-konva/BoardStage.tsx src/adapters/canvas-konva/default-renderers.tsx src/adapters/canvas-konva/stroke-style.ts src/modules/document-transfer/snapshot.ts tests/e2e/stroke-smoothing.spec.ts docs/architecture/STROKE_SMOOTHING.md
          npm run typecheck
          npm run test -- src/shared/stroke-smoothing.test.ts src/adapters/canvas-konva/stroke-style.test.ts
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/smooth-strokes-patch.yml .github/workflows/smooth-strokes-patch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: smooth freehand strokes at high zoom"
          git push origin HEAD:feature-smooth-freehand-strokes
