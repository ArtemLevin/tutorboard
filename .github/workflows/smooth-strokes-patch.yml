name: Apply smooth stroke integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature-smooth-freehand-strokes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature-smooth-freehand-strokes
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply corrected integration patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/smooth-strokes-patch-v2.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          finish = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          body = []
          for line in lines[start:finish]:
              body.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(body) + '\n'
          exec(compile(code, 'smooth-strokes-patch-v2', 'exec'))
          PY
          npx prettier --write src/shared/stroke-smoothing.ts src/shared/stroke-smoothing.test.ts src/adapters/canvas-konva/renderer-registry.tsx src/adapters/canvas-konva/BoardStage.tsx src/adapters/canvas-konva/default-renderers.tsx src/adapters/canvas-konva/stroke-style.ts src/modules/document-transfer/snapshot.ts tests/e2e/stroke-smoothing.spec.ts docs/architecture/STROKE_SMOOTHING.md
          npm run typecheck
          npm run test -- src/shared/stroke-smoothing.test.ts src/adapters/canvas-konva/stroke-style.test.ts
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/smooth-strokes-patch.yml .github/workflows/smooth-strokes-patch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: smooth freehand strokes at high zoom"
          git push origin HEAD:feature-smooth-freehand-strokes
