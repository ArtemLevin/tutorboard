name: C3.9-S7 format diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/c39-s7-format-diagnostic.yml"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Print canonical formatted diff
        run: |
          npx prettier --write tests/unit/adapters/canvas-konva/wheel-hit-layer-pause.test.ts
          echo BEGIN_S7_FORMAT_DIFF
          git diff -- tests/unit/adapters/canvas-konva/wheel-hit-layer-pause.test.ts
          echo END_S7_FORMAT_DIFF
