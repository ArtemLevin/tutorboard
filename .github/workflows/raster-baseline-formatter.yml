name: Raster baseline formatter

on:
  push:
    branches:
      - perf/raster-memory-baseline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/adapters/canvas-konva/BoardStage.tsx src/adapters/canvas-konva/raster-image-diagnostics.ts tests/e2e/raster-memory-baseline.spec.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: format raster baseline instrumentation"
          git push origin HEAD:perf/raster-memory-baseline
