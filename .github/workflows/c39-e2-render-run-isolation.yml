name: C3.9-E2 render-run isolation

on:
  pull_request:
    paths:
      - .github/workflows/c39-e2-render-run-isolation.yml
      - tests/e2e/c39-large-board-profile.spec.ts
      - scripts/c39/summarize-e2.mjs
      - tests/node/c39-e2-summary.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c39-e2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-run-experiment:
    name: C3.9-E2 Chromium controlled scenes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and browser
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Repeat matched scene matrix four times
        env:
          C39_E2_PROFILE: "1"
        run: |
          set -euo pipefail
          mkdir -p c39-e2-results
          for iteration in 1 2 3 4; do
            echo "C39-E2 iteration=$iteration"
            npm run e2e:c39-profile -- --grep @c39-e2 2>&1 |
              tee "c39-e2-results/iteration-$iteration.log"
          done
      - name: Validate samples and summarize compositor attribution
        run: |
          node scripts/c39/summarize-e2.mjs c39-e2-results             c39-e2-results/summary.json
      - name: Upload E2 reports and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c39-e2-render-run-${{ github.sha }}
          path: |
            c39-e2-results
            test-results
          if-no-files-found: warn
          retention-days: 14
