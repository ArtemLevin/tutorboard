name: Format coordinate plot workflow test

on:
  push:
    branches:
      - feature/object-settings-right-double-click

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/object-settings-right-double-click
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes prettier@3.9.6 --write src/app/CoordinatePlotEditorWorkflow.test.tsx
      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/CoordinatePlotEditorWorkflow.test.tsx
          git rm .github/workflows/format-coordinate-plot-workflow-test.yml
          git commit -m "style: format coordinate plot workflow test"
          git push origin HEAD:feature/object-settings-right-double-click
