name: UX2 browser repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    name: Repair quick insert toolbar semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-ux-structure-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Give the toolbar an independent accessible name
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/app/CoordinatePlotEditorPanel.tsx")
          source = path.read_text(encoding="utf-8")
          old = 'aria-label={`Быстрые вставки: ${ariaLabel}`}'
          new = 'aria-label={`Быстрые вставки для поля «${label}»`}'
          if source.count(old) != 1:
              raise SystemExit(f"Expected one quick-insert label, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          npx prettier --write src/app/CoordinatePlotEditorPanel.tsx
          npm run lint
          npm run typecheck
          npx vitest run src/app/CoordinatePlotEditorPanel.test.tsx src/app/CoordinatePlotEditorPanel.accessibility.test.tsx
      - name: Push semantic repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/CoordinatePlotEditorPanel.tsx
          git commit -m "fix: disambiguate plot formula toolbar label"
          git push origin HEAD:feature/coordinate-plot-ux-structure-discovery
