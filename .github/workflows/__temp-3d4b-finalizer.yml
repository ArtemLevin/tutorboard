name: Temporary authoritative 3D-4B finalizer

on:
  push:
    branches:
      - agent/3d-4b-construction-studio

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require clean finalized 4A
        run: |
          git fetch origin agent/3d-4a-persistent-transform
          if git ls-tree -r --name-only origin/agent/3d-4a-persistent-transform | grep -E '(^|/)__temp-|^\.3d4'; then
            echo '3D-4A still contains temporary infrastructure.' >&2
            exit 1
          fi
      - name: Synchronize final 4A layer
        run: |
          for path in \
            src/adapters/solid-3d-three/rotation-gizmo.ts \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/app/solid-3d/Solid3DEditorPanel.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.css \
            src/app/solid-3d/Solid3DOrientationEditor.test.tsx \
            src/app/solid-3d/Solid3DOrientationPresets.test.tsx \
            src/core/solid-3d/model-transform.ts \
            src/modules/solid-3d/board-projection.ts \
            tests/unit/adapters/solid-3d-three/rotation-gizmo.test.ts \
            tests/unit/core/solid-3d/model-transform.test.ts \
            tests/unit/core/solid-3d/model-transform-persistence.test.ts \
            tests/unit/modules/solid-3d/board-projection-rotation.test.ts; do
              git show origin/agent/3d-4a-persistent-transform:$path > $path
          done
      - name: Assert Construction Studio contracts
        run: |
          grep -q 'moveVertex' src/app/solid-3d/Solid3DConstructionEditor.tsx
          grep -q 'dodecahedron' src/modules/text-shape-placement/parametric-3d.ts
          grep -q 'icosahedron' src/modules/text-shape-placement/parametric-3d.ts
          grep -q 'truncated-pyramid' src/core/solid-3d/construction.ts
          grep -q 'regular-polyhedron' src/core/board/validation/schema.ts
          grep -q 'semanticPolyhedronGeometry' src/modules/text-shape-placement/templates.ts
      - run: npm run format
      - run: npm run check
      - name: Remove temporary 3D-4B infrastructure
        run: |
          find .github/workflows -maxdepth 1 -type f -name '__temp-3d4b-*.yml' -print -delete || true
          find . -maxdepth 1 -type f -name '.3d4b-*' -print -delete || true
      - name: Commit finalized clean tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(3d): finalize Construction Studio release layer"
          fi
      - name: Attach exact finalized 4A history
        run: |
          if ! git merge-base --is-ancestor origin/agent/3d-4a-persistent-transform HEAD; then
            git merge -s ours origin/agent/3d-4a-persistent-transform --no-edit -m "Merge exact finalized 3D-4A base into 3D-4B"
          fi
          git push
