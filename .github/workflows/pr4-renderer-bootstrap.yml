name: PR4 renderer bootstrap

on:
  push:
    branches:
      - feature/coordinate-plot-konva-renderer
    paths:
      - .github/workflows/pr4-renderer-bootstrap.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-konva-renderer
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Wire renderer and remove bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/adapters/canvas-konva/default-renderers.tsx")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              'import { CoordinatePlotPlaceholderRenderer } from "./coordinate-plot-placeholder-renderer";',
              'import { CoordinatePlotRenderer } from "./coordinate-plot-renderer";',
          )
          old = '''  {
            kind: "math.coordinate-plot",
            render(object) {
              return (
                <CoordinatePlotPlaceholderRenderer
                  object={expectKind(object, "math.coordinate-plot")}
                />
              );
            },
          },'''
          new = '''  {
            kind: "math.coordinate-plot",
            render(object, context) {
              return (
                <CoordinatePlotRenderer
                  object={expectKind(object, "math.coordinate-plot")}
                  zoom={context.zoom}
                />
              );
            },
          },'''
          if old not in source:
              raise SystemExit("coordinate plot placeholder block was not found")
          path.write_text(source.replace(old, new), encoding="utf-8")

          public = Path("src/adapters/canvas-konva/public.ts")
          content = public.read_text(encoding="utf-8")
          marker = 'export { createDefaultKonvaRendererRegistry } from "./default-renderers";\n'
          addition = '''export {
            CoordinatePlotRenderer,
            type CoordinatePlotRendererProps,
          } from "./coordinate-plot-renderer";
          export {
            createCoordinatePlotRenderModel,
            type CoordinatePlotRenderModel,
            type CreateCoordinatePlotRenderModelInput,
          } from "./coordinate-plot-render-model";
          export {
            choosePlotGridStep,
            createPlotGridRenderModel,
            createPlotLegendLayout,
            enumeratePlotTicks,
            flattenPlotSegment,
            formatPlotTick,
            plotLineDash,
            resolveCoordinatePlotViewport,
            type PlotGridRenderModel,
            type PlotLegendLayout,
            type PlotRenderTick,
          } from "./coordinate-plot-rendering";
          '''
          if addition not in content:
              content = content.replace(marker, marker + addition)
          public.write_text(content, encoding="utf-8")

          Path("src/adapters/canvas-konva/coordinate-plot-placeholder-renderer.tsx").unlink()
          Path(".github/workflows/pr4-renderer-bootstrap.yml").unlink()
          PY
          npx prettier --write \
            src/adapters/canvas-konva/default-renderers.tsx \
            src/adapters/canvas-konva/public.ts \
            src/adapters/canvas-konva/coordinate-plot-renderer.tsx \
            src/adapters/canvas-konva/coordinate-plot-render-model.ts \
            src/adapters/canvas-konva/coordinate-plot-rendering.ts \
            tests/unit/adapters/canvas-konva/coordinate-plot-rendering.test.ts \
            docs/adr/ADR-014-coordinate-plot-konva-renderer.md \
            docs/architecture/COORDINATE_PLOT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: wire production coordinate plot renderer"
          git push origin HEAD:feature/coordinate-plot-konva-renderer
