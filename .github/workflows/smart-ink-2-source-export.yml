name: Smart Ink 2 apply

on:
  push:
    branches:
      - agent/smart-ink-2

permissions:
  contents: write

concurrency:
  group: smart-ink-2-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked GeometryOS code-generation toolchain
        run: npm ci --prefix tools/geometryos-contract

      - name: Assemble and verify Smart Ink 2 payload
        run: |
          cat .smartink2/chunk00 .smartink2/chunk01 .smartink2/chunk02 .smartink2/chunk03 | base64 -d > /tmp/smartink2.tar.gz
          echo "359957ccd6f8cb4bc6d342417b3d6ad580e44824dee8e22300c01682b93e68fc  /tmp/smartink2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/smartink2.tar.gz

      - name: Apply compatibility and strict-lint corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          recognizer = Path('src/modules/smart-ink/v2/recognizer.ts')
          text = recognizer.read_text()
          text = text.replace('topShape.kind as SmartInkV2ShapeKind', 'topShape.kind')
          recognizer.write_text(text)

          training = Path('src/modules/smart-ink/v2/training.ts')
          text = training.read_text()
          text = text.replace(
              'Array(smartInkV2FeatureNames.length).fill(0)',
              'Array.from({ length: smartInkV2FeatureNames.length }, () => 0)',
          )
          text = text.replace(
              'const global = Array.from({ length: smartInkV2FeatureNames.length }, () => 0) as number[];',
              'const global = Array.from({ length: smartInkV2FeatureNames.length }, () => 0);',
          )
          training.write_text(text)

          proposal = Path('src/modules/smart-ink/proposal.ts')
          text = proposal.read_text()
          old_import = '''import type {
            SmartInkCandidate,
            SmartInkPrimitiveKind,
            SmartInkProposal,
          } from "../smart-ink-spike/public";'''
          new_import = '''import {
            recognizeSmartInkStroke,
            type SmartInkCandidate,
            type SmartInkPrimitiveKind,
            type SmartInkProposal,
          } from "../smart-ink-spike/public";'''
          if old_import not in text:
              raise SystemExit('Smart Ink proposal import patch target missing')
          text = text.replace(old_import, new_import)

          diagnostic = '''function diagnosticReason(
            status: SmartInkV2DecisionStatus,
            candidate: SmartInkBoardCandidate | null,
            replacement: BoardObject | null,
          ): SmartInkDiagnosticReason {'''
          helper = '''function selectCompatibilityCandidate(
            recognizer: SmartInkProposal,
          ): SmartInkCandidate | null {
            const candidate = recognizer.candidates[0];
            if (recognizer.status !== "recognized" || candidate === undefined) {
              return null;
            }
            if (candidate.kind !== "ellipse") {
              return candidate;
            }
            const circle = recognizer.candidates.find(
              (alternative) => alternative.kind === "circle",
            );
            const axisRatio = candidate.diagnostics.axisRatio;
            return circle !== undefined &&
              axisRatio !== undefined &&
              axisRatio >= smartInkCanvasRecognitionPolicy.circle.minimumAxisRatio &&
              circle.confidence >=
                smartInkCanvasRecognitionPolicy.circle.minimumCandidateConfidence
              ? circle
              : candidate;
          }

          function diagnosticReason(
            status: SmartInkV2DecisionStatus,
            candidate: SmartInkBoardCandidate | null,
            replacement: BoardObject | null,
          ): SmartInkDiagnosticReason {'''
          if diagnostic not in text:
              raise SystemExit('Smart Ink compatibility helper patch target missing')
          text = text.replace(diagnostic, helper)

          old_body = '''  const decision = recognizeSmartInkV2(stroke, points);
            recordSmartInkV2ShadowDiagnostic(decision);
            const recognizer = decision.legacyProposal;
            const arrowRecognizer = decision.arrowProposal;
            const candidate = decision.candidate;
            const replacement =
              candidate === null ? null : createSmartInkReplacementObject(stroke, candidate);'''
          new_body = '''  const decision = recognizeSmartInkV2(stroke, points);
            recordSmartInkV2ShadowDiagnostic(decision);
            const recognizer = recognizeSmartInkStroke(stroke.id, points, {
              ambiguityMargin: smartInkCanvasRecognitionPolicy.ambiguityMargin,
              minimumConfidence: smartInkCanvasRecognitionPolicy.minimumConfidence,
              sampleCount: smartInkCanvasRecognitionPolicy.sampleCount,
            });
            const compatibilityCandidate = selectCompatibilityCandidate(recognizer);
            const arrowRecognizer = decision.arrowProposal;
            const candidate =
              decision.candidate?.kind === "arrow"
                ? decision.candidate
                : (compatibilityCandidate ?? decision.candidate);
            const effectiveStatus: SmartInkV2DecisionStatus =
              candidate === null ? decision.status : "accepted";
            const replacement =
              candidate === null ? null : createSmartInkReplacementObject(stroke, candidate);'''
          if old_body not in text:
              raise SystemExit('Smart Ink compatibility decision patch target missing')
          text = text.replace(old_body, new_body)
          text = text.replace(
              'reason: diagnosticReason(decision.status, candidate, replacement),',
              'reason: diagnosticReason(effectiveStatus, candidate, replacement),',
          )
          proposal.write_text(text)
          PY

      - name: Format changed product files
        run: |
          npx prettier --write \
            src/modules/smart-ink/proposal.ts \
            src/modules/smart-ink/composite-recognizer.ts \
            src/modules/smart-ink/public.ts \
            "src/modules/smart-ink/v2/**/*.{ts,md}" \
            tests/unit/modules/smart-ink-v2/recognizer.test.ts \
            docs/SMART_INK_V2.md \
            docs/SMART_INK_V2_RELEASE_CHECKLIST.md

      - name: Run complete repository quality gate
        run: npm run check

      - name: Commit clean product diff
        run: |
          rm -rf .smartink2
          rm -f .github/workflows/smart-ink-2-source-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(smart-ink): add precision-first Smart Ink 2.0"
          git push
