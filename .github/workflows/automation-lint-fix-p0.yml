name: Apply P0 lint boundary fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-command-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-command-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Add explicit unknown IndexedDB boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/adapters/persistence-dexie/sync-queue.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'const raw = await requestResult(store.get([activeDocumentId, sequence]));',
              'const raw = await requestResult<unknown>(\n      store.get([activeDocumentId, sequence]) as IDBRequest<unknown>,\n    );',
          )
          text = text.replace(
              'const raw = await requestResult(\n      transaction.objectStore("pending").get([activeDocumentId, sequence]),\n    );',
              'const raw = await requestResult<unknown>(\n      transaction.objectStore("pending").get([\n        activeDocumentId,\n        sequence,\n      ]) as IDBRequest<unknown>,\n    );',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm run format
      - name: Remove temporary workflow
        run: rm -f .github/workflows/automation-lint-fix-p0.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(sync): type IndexedDB corruption fixtures"
          git push origin HEAD:feature/p0-command-integrity
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run architecture
      - run: npm run build
