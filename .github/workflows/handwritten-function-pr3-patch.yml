name: Handwritten function PR 3 patch

on:
  push:
    branches:
      - feat/handwritten-function-workflow

permissions:
  contents: write

concurrency:
  group: handwritten-function-pr3-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-pr3-patch]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/handwritten-function-workflow
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply application workflow patch when needed
        run: |
          if grep -q "handwrittenFunctionToolId" src/app/App.tsx; then
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "scripts/apply-handwritten-function-pr3.mjs";
          const source = fs.readFileSync(path, "utf8");
          fs.writeFileSync(path, source.replaceAll("\\\\n", "\\n"));
          NODE
          set +e
          node scripts/apply-handwritten-function-pr3.mjs > pr3-patch.log 2>&1
          status=$?
          cat pr3-patch.log
          if [ "$status" -ne 0 ]; then
            mkdir -p docs/diagnostics
            cp pr3-patch.log docs/diagnostics/HANDWRITTEN_FUNCTION_PR3_PATCH.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/HANDWRITTEN_FUNCTION_PR3_PATCH.txt
            git commit -m "chore: capture PR 3 patch failure [skip-pr3-patch]"
            git push origin HEAD:feat/handwritten-function-workflow
            exit "$status"
          fi
      - name: Format changed files
        run: |
          npx prettier --write \
            src/app \
            tests/unit/app \
            scripts/apply-handwritten-function-pr3.mjs \
            package.json
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app \
            tests/unit/app \
            scripts/apply-handwritten-function-pr3.mjs \
            package.json
          git commit -m "feat: compose handwritten function canvas workflow [skip-pr3-patch]"
          git push origin HEAD:feat/handwritten-function-workflow
      - name: Run focused type and test checks
        run: |
          npm run typecheck
          npm run handwriting:pr3
