name: Format and validate P0 integrity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-command-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-command-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npm run format
      - name: Remove temporary workflow
        run: rm -f .github/workflows/automation-format-p0.yml
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(sync): format P0 integrity sources"
          git push origin HEAD:feature/p0-command-integrity
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test
      - name: Architecture boundaries
        run: npm run architecture
      - name: Production build
        run: npm run build
