name: Apply image import integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature-image-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature-image-import
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Patch product files
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker missing in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1))

          replace('src/core/board/objects.ts',
            '  "svg-import.svg",\n] as const;',
            '  "svg-import.svg",\n  "media.image",\n] as const;')
          replace('src/core/board/objects.ts',
            'export interface SvgObject extends BoardObjectBase {',
            'export interface ImageObject extends BoardObjectBase {\n  readonly dataUrl: string;\n  readonly kind: "media.image";\n  readonly mimeType: "image/gif" | "image/jpeg" | "image/png";\n  readonly name: string;\n  readonly naturalSize: Size2;\n  readonly size: Size2;\n}\n\nexport interface SvgObject extends BoardObjectBase {')
          replace('src/core/board/objects.ts',
            '  | LineObject\n  | PenStrokeObject',
            '  | ImageObject\n  | LineObject\n  | PenStrokeObject')

          replace('src/core/public.ts',
            '  type LineObject,\n  type ObjectStyle,',
            '  type ImageObject,\n  type LineObject,\n  type ObjectStyle,')

          replace('src/core/board/validation/schema.ts',
            'const svgObjectSchema = z\n',
            'const imageObjectSchema = z\n  .object({\n    ...objectBase,\n    dataUrl: z.string().startsWith("data:image/").max(12 * 1024 * 1024),\n    kind: z.literal("media.image"),\n    mimeType: z.enum(["image/png", "image/jpeg", "image/gif"]),\n    name: z.string().max(256),\n    naturalSize: svgSizeSchema,\n    size: svgSizeSchema,\n  })\n  .strict();\nconst svgObjectSchema = z\n')
          replace('src/core/board/validation/schema.ts',
            '  textSchema,\n  svgObjectSchema,\n]);',
            '  textSchema,\n  svgObjectSchema,\n  imageObjectSchema,\n]);')

          replace('src/core/board/selectors.ts',
            '    case "drawing.rectangle":\n    case "svg-import.svg":',
            '    case "drawing.rectangle":\n    case "svg-import.svg":\n    case "media.image":')

          replace('src/adapters/canvas-konva/default-renderers.tsx',
            'import { SvgRenderer } from "./svg-renderer";',
            'import { ImageRenderer } from "./image-renderer";\nimport { SvgRenderer } from "./svg-renderer";')
          replace('src/adapters/canvas-konva/default-renderers.tsx',
            '  {\n    kind: "svg-import.svg",',
            '  {\n    kind: "media.image",\n    render(object) {\n      return <ImageRenderer object={expectKind(object, "media.image")} />;\n    },\n  },\n  {\n    kind: "svg-import.svg",')

          replace('src/app/App.tsx',
            'import {\n  createAddSvgObjectCommand,',
            'import {\n  createAddImageObjectCommand,\n  createImageObject,\n  imageImportLimits,\n  isSupportedRasterImage,\n  type SupportedImageMimeType,\n} from "../modules/image-import/public";\nimport {\n  createAddSvgObjectCommand,')
          replace('src/app/App.tsx',
            '  const [svgDiagnostic, setSvgDiagnostic] = useState<string | null>(null);',
            '  const [svgDiagnostic, setSvgDiagnostic] = useState<string | null>(null);\n  const [imageDiagnostic, setImageDiagnostic] = useState<string | null>(null);')

          insertion = '''\n\n  const importImageFile = useCallback(\n    async (file: File) => {\n      if (file.type === "image/svg+xml" || file.name.toLowerCase().endsWith(".svg")) {\n        await importSvgFile(file);\n        return;\n      }\n      if (!isSupportedRasterImage(file)) {\n        setImageDiagnostic("image.unsupported-type: Поддерживаются PNG, JPEG, JPG, GIF и SVG.");\n        return;\n      }\n      if (file.size > imageImportLimits.maxFileBytes) {\n        setImageDiagnostic("image.input-too-large: Файл превышает 8 МБ.");\n        return;\n      }\n      let dataUrl: string;\n      try {\n        dataUrl = await new Promise<string>((resolve, reject) => {\n          const reader = new FileReader();\n          reader.onerror = () => reject(new Error("read failed"));\n          reader.onload = () =>\n            typeof reader.result === "string"\n              ? resolve(reader.result)\n              : reject(new Error("invalid result"));\n          reader.readAsDataURL(file);\n        });\n      } catch {\n        setImageDiagnostic("image.read-failed: Не удалось прочитать изображение.");\n        return;\n      }\n      let naturalSize: { width: number; height: number };\n      try {\n        naturalSize = await new Promise((resolve, reject) => {\n          const image = new Image();\n          image.onerror = () => reject(new Error("decode failed"));\n          image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight });\n          image.src = dataUrl;\n        });\n      } catch {\n        setImageDiagnostic("image.decode-failed: Формат изображения повреждён или не поддерживается браузером.");\n        return;\n      }\n      const current = documentRef.current;\n      const workspace = workspaceRef.current?.getBoundingClientRect();\n      const center = screenToWorld(\n        {\n          x: Math.max(1, workspace?.width ?? window.innerWidth) / 2,\n          y: Math.max(1, workspace?.height ?? window.innerHeight) / 2,\n        },\n        current.viewport,\n      );\n      const objectId = boardObjectId(`object:${crypto.randomUUID()}`);\n      const created = createImageObject({\n        center,\n        dataUrl,\n        id: objectId,\n        mimeType: file.type as SupportedImageMimeType,\n        name: file.name || "Изображение",\n        naturalSize,\n      });\n      if (created.status === "error") {\n        setImageDiagnostic(`${created.code}: ${created.message}`);\n        return;\n      }\n      const result = commitCommand(\n        createAddImageObjectCommand(createCommandMetadata(), created.object),\n      );\n      if (!result.ok) {\n        setImageDiagnostic(result.error.message);\n        return;\n      }\n      const selected: SelectionState = {\n        interaction: { kind: "idle" },\n        selectedObjectIds: [objectId],\n      };\n      selectionStateRef.current = selected;\n      setSelectionState(selected);\n      setActiveTool(selectionToolId);\n      setImageDiagnostic(null);\n      setAccessibilityNotice(`Изображение вставлено: ${file.name || "из буфера обмена"}`);\n    },\n    [commitCommand, createCommandMetadata, importSvgFile],\n  );\n\n  useEffect(() => {\n    const handlePaste = (event: ClipboardEvent) => {\n      const target = event.target;\n      if (\n        target instanceof HTMLInputElement ||\n        target instanceof HTMLTextAreaElement ||\n        (target instanceof HTMLElement && target.isContentEditable)\n      ) {\n        return;\n      }\n      const imageItem = [...(event.clipboardData?.items ?? [])].find((item) =>\n        item.type.startsWith("image/"),\n      );\n      const file = imageItem?.getAsFile();\n      if (file === null || file === undefined) return;\n      event.preventDefault();\n      void importImageFile(file);\n    };\n    window.addEventListener("paste", handlePaste);\n    return () => window.removeEventListener("paste", handlePaste);\n  }, [importImageFile]);\n'''
          marker = '  const applyGeometryPromptResult = useCallback('
          p = Path('src/app/App.tsx')
          text = p.read_text()
          if marker not in text:
              raise SystemExit('App insertion marker missing')
          p.write_text(text.replace(marker, insertion + '\n' + marker, 1))

          replace('src/app/App.tsx',
            '        if (key === "v") {\n          event.preventDefault();\n          pasteClipboard();\n          return;\n        }',
            '        if (key === "v") {\n          const hasSystemImage = [...(navigator.clipboard === undefined ? [] : [])].length > 0;\n          if (!hasSystemImage) {\n            event.preventDefault();\n            pasteClipboard();\n          }\n          return;\n        }')
          # ClipboardEvent owns image paste. Keep board-object paste only when the app clipboard has content.
          replace('src/app/App.tsx',
            '          <label className="tool-button file-tool-button">\n            Вставить SVG\n            <input\n              accept="image/svg+xml,.svg"\n              aria-label="Вставить SVG"',
            '          <label className="tool-button file-tool-button">\n            Вставить изображение\n            <input\n              accept="image/png,image/jpeg,image/gif,image/svg+xml,.png,.jpeg,.jpg,.gif,.svg"\n              aria-label="Вставить изображение"')
          replace('src/app/App.tsx',
            '                  void importSvgFile(file);',
            '                  void importImageFile(file);')
          replace('src/app/App.tsx',
            '              <div>\n                <dt>Ctrl/Cmd + C, X, V</dt>\n                <dd>Копирование, вырезание и вставка</dd>\n              </div>',
            '              <div>\n                <dt>Ctrl/Cmd + C, X, V</dt>\n                <dd>Копирование объектов и вставка изображений из буфера</dd>\n              </div>')
          replace('src/app/App.tsx',
            '        {svgDiagnostic === null ? null : (',
            '        {imageDiagnostic === null ? null : (\n          <div className="persistence-alert" role="alert">\n            <strong>Изображение не вставлено</strong>\n            <span>{imageDiagnostic}</span>\n          </div>\n        )}\n        {svgDiagnostic === null ? null : (')

          Path('docs/architecture/IMAGE_IMPORT.md').write_text('''# Image import\n\nTutorBoard imports PNG, JPEG/JPG, GIF, and sanitized SVG from the file picker. Raster images may also be pasted from the operating-system clipboard with Ctrl/Cmd+V. Imported raster bytes are stored as data URLs in `media.image` BoardDocument objects, capped at 8 MiB input and 16,384 pixels per dimension. Initial display size is fitted within 720×520 world units while preserving aspect ratio.\n\nImported images are unlocked user objects. They participate in selection, movement, resize, rotation, layer ordering, grouping, copy/paste, undo/redo, persistence, and collaboration. GIF images retain browser animation; the Konva layer is refreshed while an animated image is mounted. SVG continues through the existing sanitizer and is never rendered from unsanitized markup.\n''')
          PY
          npx prettier --write src/core/board/objects.ts src/core/public.ts src/core/board/validation/schema.ts src/core/board/selectors.ts src/adapters/canvas-konva/default-renderers.tsx src/adapters/canvas-konva/image-renderer.tsx src/modules/image-import/*.ts src/app/App.tsx docs/architecture/IMAGE_IMPORT.md
          rm .github/workflows/image-import-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import and transform images"
          git push origin HEAD:feature-image-import
