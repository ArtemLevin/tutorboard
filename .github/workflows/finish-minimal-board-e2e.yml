name: Finish minimal board E2E migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finish-minimal-board-e2e
  cancel-in-progress: false

jobs:
  migrate:
    if: github.head_ref == 'feature/minimal-board-chrome'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/minimal-board-chrome
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python scripts/finish-minimal-board-e2e.py
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - name: Commit migrated contracts
        run: |
          rm -f \
            .github/workflows/finish-minimal-board-e2e.yml \
            scripts/finish-minimal-board-e2e.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align release smoke with minimal board chrome"
          git push origin HEAD:feature/minimal-board-chrome
