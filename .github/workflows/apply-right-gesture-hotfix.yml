name: Apply right gesture hotfix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - hotfix/right-gesture-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/right-gesture-final
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Correct patcher generated-text tokens
        shell: bash
        run: |
          sed -i 's/Увеличить выделение on 10%/Увеличить выделение на 10%/g' scripts/apply-right-gesture-hotfix.mjs
          sed -i 's/`core.coordinate-plot.update`/core.coordinate-plot.update/g' scripts/apply-right-gesture-hotfix.mjs
          sed -i 's/`BoardStage`/BoardStage/g' scripts/apply-right-gesture-hotfix.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-right-gesture-hotfix.mjs")
          content = path.read_text(encoding="utf-8")
          corrections = [
              (
                  '''  content = replaceOnce(
              content,
              `      finishRightViewportDrag();`,
              `      finishRightViewportGesture(undefined, false);`,
              "plot cleanup gesture",
            );
          ''',
                  "",
                  "redundant cleanup",
              ),
              (
                  '''  content = replaceOnce(
              content,
              `              onViewportChange(\\n                panCoordinatePlotViewport(`,
              `              onViewportChange?.(\\n                panCoordinatePlotViewport(`,
              "plot drag end optional callback",
            );
            content = replaceOnce(
              content,
              `              onViewportChange(\\n                panCoordinatePlotViewport(`,
              `              onViewportChange?.(\\n                panCoordinatePlotViewport(`,
              "plot drag move optional callback",
            );
          ''',
                  '''  content = content.replaceAll(
              `              onViewportChange(\\n                panCoordinatePlotViewport(`,
              `              onViewportChange?.(\\n                panCoordinatePlotViewport(`,
            );
          ''',
                  "duplicate viewport callbacks",
              ),
              (
                  '''  content = replaceOnce(
              content,
              `                startRightViewportDrag(`,
              `                startRightViewportGesture(`,
              "plot surface right gesture start",
            );
          ''',
                  '''  content = content.replaceAll(
              `                startRightViewportDrag(`,
              `                startRightViewportGesture(`,
            );
          ''',
                  "duplicate right gesture starts",
              ),
          ]
          for needle, replacement, label in corrections:
              if needle not in content:
                  raise SystemExit(f"Missing patcher correction: {label}")
              content = content.replace(needle, replacement, 1)
          path.write_text(content, encoding="utf-8")
          PY
          node --check scripts/apply-right-gesture-hotfix.mjs
      - name: Apply source and test changes
        run: node scripts/apply-right-gesture-hotfix.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Format changed files
        run: npm run format
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test
      - name: Build production bundle
        run: npm run build
      - name: Install release browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run focused browser regression matrix
        run: >-
          npx playwright test
          tests/e2e/coordinate-plot-right-pan.spec.ts
          tests/e2e/object-settings-right-double-click.spec.ts
          tests/e2e/coordinate-plot-accessibility.spec.ts
          tests/e2e/selection.spec.ts
          tests/e2e/styling.spec.ts
          tests/e2e/text-editing.spec.ts
          tests/e2e/image-import.spec.ts
          tests/e2e/smart-ink.spec.ts
          tests/e2e/layers.spec.ts
          --reporter=list
      - name: Commit verified hotfix
        shell: bash
        run: |
          rm -f scripts/apply-right-gesture-hotfix.mjs
          rm -f .github/workflows/apply-right-gesture-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore coordinate plot right gestures"
          git push origin HEAD:hotfix/right-gesture-final
