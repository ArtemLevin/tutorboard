name: Temporary C3.7 format preview
on:
  pull_request:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Print Prettier patch
        run: |
          ./node_modules/.bin/prettier --write src/adapters/canvas-konva/board-frame-trace.ts src/adapters/canvas-konva/board-scene-content.tsx tests/e2e/media-performance.spec.ts
          git diff -- src/adapters/canvas-konva/board-frame-trace.ts src/adapters/canvas-konva/board-scene-content.tsx tests/e2e/media-performance.spec.ts
