name: Format debug

on:
  push:
    branches:
      - perf/eraser-incremental-gesture

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Print canonical Prettier diff
        run: |
          npx prettier --write             src/app/board/controllers/eraser-session.ts             src/app/board/controllers/eraser-session.test.ts             tests/performance/eraser-gesture-performance.test.ts
          git diff --             src/app/board/controllers/eraser-session.ts             src/app/board/controllers/eraser-session.test.ts             tests/performance/eraser-gesture-performance.test.ts
