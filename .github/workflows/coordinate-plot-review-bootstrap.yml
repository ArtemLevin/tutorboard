name: Coordinate plot review remediation bootstrap

on:
  push:
    branches:
      - fix/coordinate-plot-critical-review-findings

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[skip plot bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/coordinate-plot-critical-review-findings
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply remediation
        run: node scripts/apply-coordinate-plot-review-fixes.mjs

      - name: Format product changes
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run targeted tests
        run: >-
          npm run test --
          tests/unit/core/plot-expression/compiler.test.ts
          tests/unit/core/plot-sampling/coordinate-plot-sampler.test.ts
          tests/unit/modules/coordinate-plot-editor/model.test.ts
          src/app/CoordinatePlotNavigationControls.test.tsx
          src/app/CoordinatePlotEditorPanel.test.tsx
          tests/unit/adapters/canvas-konva/coordinate-plot-rendering.test.ts
          tests/unit/adapters/canvas-konva/coordinate-plot-editing.test.ts

      - name: Run coordinate plot production budgets
        run: npm run plot:production

      - name: Build
        run: npm run build

      - name: Publish product commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-coordinate-plot-review-fixes.mjs
          git add src tests docs
          git commit -m "fix: harden coordinate plot runtime and editor [skip plot bootstrap]"
          git push origin HEAD:fix/coordinate-plot-critical-review-findings
