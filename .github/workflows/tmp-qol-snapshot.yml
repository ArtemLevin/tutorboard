name: Temporary QoL screenshot rebaseline

on:
  push:
    branches:
      - feat/qol-1-tool-settings-reopen

permissions:
  contents: write

jobs:
  rebaseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm run e2e:plot-visual:update
      - name: Commit verified UI screenshots
        run: |
          if git diff --quiet -- tests/e2e/coordinate-plot-visual.spec.ts-snapshots; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/coordinate-plot-visual.spec.ts-snapshots
          git commit -m "test(visual): refresh snapshots after compact dock and diagnostics removal"
          git push origin HEAD:feat/qol-1-tool-settings-reopen
