name: Apply coordinate plot UX safety

on:
  push:
    branches:
      - feature/coordinate-plot-ux-safety-accessibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coordinate-plot-ux-safety-accessibility
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic patch
        env:
          PATCH_B64:  nJywKICAgICcnJ2ltcG9ydCB7CiAgdXNlRWZmZWN0LAogIHVzZUlkLAogIHVzZVJlZiwKICB1c2VTdGF0ZSwKICB0eXBlIFJlYWN0RWxlbWVudCwKICB0eXBlIFJlZk9iamVjdCwKfSBmcm9tICJyZWFjdCI7JycnLAop
