name: Temporary 3D-4A gizmo type fix

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix strict TypeScript contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gizmo = Path('src/adapters/solid-3d-three/rotation-gizmo.ts')
          text = gizmo.read_text()
          old = 'this.raycaster.intersectObjects(this.handles, false)[0]'
          if old not in text:
              raise SystemExit('gizmo raycast marker missing')
          gizmo.write_text(text.replace(old, 'this.raycaster.intersectObjects([...this.handles], false)[0]', 1))

          viewport = Path('src/adapters/solid-3d-three/Solid3DViewport.tsx')
          text = viewport.read_text()
          old = '  readonly onModelRotationCommit?: (rotation: Solid3DQuaternion) => void;'
          new = '  readonly onModelRotationCommit?: ((rotation: Solid3DQuaternion) => void) | undefined;'
          if old not in text:
              raise SystemExit('viewport optional callback marker missing')
          viewport.write_text(text.replace(old, new, 1))
          PY
      - run: npm run format
      - name: Commit type fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(3d): satisfy strict gizmo TypeScript contracts"
          git push
