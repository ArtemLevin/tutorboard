# trigger-3
name: Temporary 3D-4A gizmo type fix

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Finish strict gizmo and semantic-highlight contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gizmo = Path('src/adapters/solid-3d-three/rotation-gizmo.ts')
          text = gizmo.read_text()
          old = 'this.raycaster.intersectObjects(this.handles, false)[0]'
          if old in text:
              text = text.replace(old, 'this.raycaster.intersectObjects([...this.handles], false)[0]', 1)
          if 'this.raycaster.intersectObjects([...this.handles], false)[0]' not in text:
              raise SystemExit('gizmo raycast contract missing')
          gizmo.write_text(text)

          viewport = Path('src/adapters/solid-3d-three/Solid3DViewport.tsx')
          text = viewport.read_text()
          old = '  readonly onModelRotationCommit?: (rotation: Solid3DQuaternion) => void;'
          new = '  readonly onModelRotationCommit?: ((rotation: Solid3DQuaternion) => void) | undefined;'
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('viewport callback contract missing')
          viewport.write_text(text)

          panel = Path('src/app/solid-3d/Solid3DEditorPanel.tsx')
          text = panel.read_text()
          marker = '              highlightedElement={highlightedElement}\n'
          highlight = '              highlightedSurfaceId={hoveredSurfaceId}\n'
          if highlight not in text:
              if marker not in text:
                  raise SystemExit('panel highlight marker missing')
              text = text.replace(marker, marker + highlight, 1)
          panel.write_text(text)
          PY
      - run: npm run format
      - name: Commit final gizmo fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(3d): finalize gizmo and semantic surface highlighting"
          git push
