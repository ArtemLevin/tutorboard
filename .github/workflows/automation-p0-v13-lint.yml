name: Fix ordered envelope lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix server-sync test API usage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/modules/server-sync/sync.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  reduceBoardDocument,\n', '')
          old_engine = '''    const repository = new FakeRepository();\n    const engine = new BoardSyncEngine({\n      createIdempotencyKey: () => "unused",\n      documentId: expectedDocumentId,\n      lessonId: "lesson:1",\n      now: () => "2026-07-28T18:02:00.000Z",\n      queue,\n      repository,\n    });'''
          new_engine = '''    const repository = new FakeRepository();\n    const states: BoardSyncState[] = [];\n    const engine = new BoardSyncEngine({\n      createIdempotencyKey: () => "unused",\n      documentId: expectedDocumentId,\n      lessonId: "lesson:1",\n      now: () => "2026-07-28T18:02:00.000Z",\n      onStateChange: (state) => states.push(state),\n      queue,\n      repository,\n    });'''
          if old_engine not in text:
              raise SystemExit('offline engine fixture missing')
          text = text.replace(old_engine, new_engine, 1)
          old_sync = '''    const synced = await engine.sync();\n    expect(synced).toMatchObject({\n      document: { title: "Offline" },\n      kind: "ready",\n      pendingCount: 0,\n      revision: 1,\n    });'''
          new_sync = '''    await engine.synchronize();\n    expect(states.at(-1)).toMatchObject({\n      document: { title: "Offline" },\n      kind: "ready",\n      pendingCount: 0,\n      revision: 1,\n    });'''
          if old_sync not in text:
              raise SystemExit('offline synchronize assertion missing')
          path.write_text(text.replace(old_sync, new_sync, 1), encoding='utf-8')
          PY
      - run: npm run format
      - name: Remove temporary workflow
        run: rm -f .github/workflows/automation-p0-v13-lint.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(sync): use ordered synchronization API"
          git push origin HEAD:feature/p0-ordered-envelope-v13
      - run: npm run board-contract:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run architecture
      - run: npm run build
