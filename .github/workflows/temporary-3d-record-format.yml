name: Temporary 3D record merge formatting
on:
  push:
    branches: [fix/solid-3d-concurrent-update-guard-20261021]
    paths:
      - ".github/workflows/temporary-3d-record-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/modules/solid-3d/record-rebase.ts tests/unit/modules/solid-3d/record-rebase.test.ts src/app/board/controllers/useBoardSolid3DController.ts src/app/board/views/BoardOverlays.tsx src/modules/solid-3d/public.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/modules/solid-3d/record-rebase.ts tests/unit/modules/solid-3d/record-rebase.test.ts src/app/board/controllers/useBoardSolid3DController.ts src/app/board/views/BoardOverlays.tsx src/modules/solid-3d/public.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format concurrency guard"
            git push origin HEAD:refs/heads/fix/solid-3d-concurrent-update-guard-20261021
          fi
