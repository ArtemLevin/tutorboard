name: Fix final right gesture smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - hotfix/right-gesture-final

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/right-gesture-final
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --check scripts/fix-final-right-gesture-smoke.mjs
      - run: node scripts/fix-final-right-gesture-smoke.mjs
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Run focused cross-browser smoke
        run: >-
          npx playwright test
          tests/e2e/object-settings-right-double-click.spec.ts
          tests/e2e/selection.spec.ts
          tests/e2e/stroke-smoothing.spec.ts
          --reporter=list
      - name: Commit verified smoke fixes
        shell: bash
        run: |
          rm -f scripts/fix-final-right-gesture-smoke.mjs
          rm -f .github/workflows/fix-final-right-gesture-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete right gesture smoke coverage"
          git push origin HEAD:hotfix/right-gesture-final
