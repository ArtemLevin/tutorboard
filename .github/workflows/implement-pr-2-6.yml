name: Diagnose PR 2.6

on:
  push:
    branches:
      - agent/local-persistence-recovery

permissions:
  contents: write

concurrency:
  group: diagnose-pr-2-6
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose persistence recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: agent/local-persistence-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reconstruct implementation
        shell: bash
        run: |
          cat scripts/.pr-2-6-v2/part*.b64 > /tmp/implement-pr-2-6.py.gz.b64
          base64 --decode /tmp/implement-pr-2-6.py.gz.b64 | gzip --decompress > /tmp/implement-pr-2-6.py
          python /tmp/implement-pr-2-6.py
          python scripts/.pr-2-6-v2/fix-lint.py
          python scripts/.pr-2-6-v2/fix-types.py
          python scripts/.pr-2-6-v2/diagnose-recovery.py

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Run targeted repository test
        shell: bash
        run: |
          set +e
          npx vitest run tests/unit/adapters/persistence-dexie/repository.test.ts > /tmp/recovery.log 2>&1
          status=$?
          set -e
          tail -n 120 /tmp/recovery.log > scripts/.pr-2-6-v2/recovery.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.pr-2-6-v2/recovery.log
          if ! git diff --cached --quiet; then
            git commit -m "chore: record recovery diagnostic [skip ci]"
            git push origin HEAD:agent/local-persistence-recovery
          fi
          exit "$status"
