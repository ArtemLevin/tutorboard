name: Temporary 3D-4A gizmo integration

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integrate gizmo into viewport and editor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          viewport = Path('src/adapters/solid-3d-three/Solid3DViewport.tsx')
          text = viewport.read_text()
          text = text.replace(
              '  type Solid3DRecord,\n',
              '  type Solid3DQuaternion,\n  type Solid3DRecord,\n',
              1,
          )
          marker = 'import { resolveSolidHitAnchor } from "./semantic-hit";\n'
          if marker not in text:
              raise SystemExit('semantic-hit import marker missing')
          text = text.replace(
              marker,
              marker + 'import { SolidRotationGizmoController } from "./rotation-gizmo";\n',
              1,
          )
          prop_marker = '  readonly onPointPlace: (position: Vec3, anchor: SolidPointAnchor) => void;\n'
          if prop_marker not in text:
              raise SystemExit('onPointPlace prop marker missing')
          text = text.replace(
              prop_marker,
              prop_marker + '  readonly onModelRotationCommit?: (rotation: Solid3DQuaternion) => void;\n',
              1,
          )
          destructure = '    onElementHover,\n    onSurfaceHover,\n'
          if destructure not in text:
              raise SystemExit('viewport destructure marker missing')
          text = text.replace(
              destructure,
              '    onElementHover,\n    onModelRotationCommit,\n    onSurfaceHover,\n',
              1,
          )
          ref_marker = '  const onPointPlaceRef = useRef(props.onPointPlace);\n'
          if ref_marker not in text:
              raise SystemExit('point ref marker missing')
          text = text.replace(
              ref_marker,
              ref_marker + '  const onModelRotationCommitRef = useRef(onModelRotationCommit);\n',
              1,
          )
          sync_marker = '''  useEffect(() => {\n    onPointPlaceRef.current = props.onPointPlace;\n  }, [props.onPointPlace]);\n\n'''
          if sync_marker not in text:
              raise SystemExit('point sync effect marker missing')
          text = text.replace(
              sync_marker,
              sync_marker + '''  useEffect(() => {\n    onModelRotationCommitRef.current = onModelRotationCommit;\n  }, [onModelRotationCommit]);\n\n''',
              1,
          )
          render_marker = '    const render = () => renderer.render(scene, camera);\n'
          if render_marker not in text:
              raise SystemExit('render marker missing')
          gizmo = '''    const rotationGizmo =\n      onModelRotationCommitRef.current === undefined\n        ? null\n        : new SolidRotationGizmoController(\n            built.root,\n            camera,\n            renderer.domElement,\n            controls,\n            render,\n            (rotation) => onModelRotationCommitRef.current?.(rotation),\n          );\n    if (rotationGizmo !== null) scene.add(rotationGizmo.group);\n'''
          text = text.replace(render_marker, render_marker + gizmo, 1)
          cleanup_marker = '      disposeSolidScene(scene);\n'
          if cleanup_marker not in text:
              raise SystemExit('scene cleanup marker missing')
          text = text.replace(
              cleanup_marker,
              '''      if (rotationGizmo !== null) {\n        scene.remove(rotationGizmo.group);\n        rotationGizmo.dispose();\n      }\n''' + cleanup_marker,
              1,
          )
          viewport.write_text(text)

          panel = Path('src/app/solid-3d/Solid3DEditorPanel.tsx')
          text = panel.read_text()
          import_marker = '  solidSectionId,\n'
          if import_marker not in text:
              raise SystemExit('panel import marker missing')
          text = text.replace(
              import_marker,
              import_marker + '  withSolid3DModelQuaternion,\n',
              1,
          )
          viewport_marker = '              onElementHover={setHighlightedElement}\n'
          if viewport_marker not in text:
              raise SystemExit('panel viewport marker missing')
          text = text.replace(
              viewport_marker,
              viewport_marker + '''              onModelRotationCommit={\n                readOnly\n                  ? undefined\n                  : (rotation) =>\n                      onRecordChange(\n                        withSolid3DModelQuaternion(record, rotation),\n                      )\n              }\n''',
              1,
          )
          panel.write_text(text)
          PY
      - name: Add pure gizmo regression test
        run: |
          cat > tests/unit/adapters/solid-3d-three/rotation-gizmo.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import {
            applySolid3DQuaternion,
            identitySolid3DQuaternion,
          } from "../../../../src/core/public";
          import { quaternionAfterGizmoDrag } from "../../../../src/adapters/solid-3d-three/rotation-gizmo";

          describe("solid rotation gizmo", () => {
            it("applies a quarter-turn around Z to the model quaternion", () => {
              const rotation = quaternionAfterGizmoDrag(
                identitySolid3DQuaternion,
                "z",
                Math.PI / 2,
              );
              const point = applySolid3DQuaternion({ x: 1, y: 0, z: 0 }, rotation);
              expect(point.x).toBeCloseTo(0, 8);
              expect(point.y).toBeCloseTo(1, 8);
              expect(point.z).toBeCloseTo(0, 8);
            });

            it("keeps drag output normalized", () => {
              const rotation = quaternionAfterGizmoDrag(
                { w: 0.9, x: 0.2, y: 0.1, z: -0.05 },
                "x",
                0.37,
              );
              expect(
                Math.hypot(rotation.x, rotation.y, rotation.z, rotation.w),
              ).toBeCloseTo(1, 10);
            });
          });
          EOF
      - run: npm run format
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(3d): integrate transactional XYZ rotation gizmo"
          git push
