name: Temporary QoL formatter

on:
  push:
    branches:
      - feat/qol-1-tool-settings-reopen

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/board-chrome/BoardToolDock.tsx tests/e2e/compact-tool-dock.spec.ts
      - name: Commit normalized formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/board-chrome/BoardToolDock.tsx tests/e2e/compact-tool-dock.spec.ts
          git commit -m "style(qol): apply repository Prettier formatting"
          git push origin HEAD:feat/qol-1-tool-settings-reopen
