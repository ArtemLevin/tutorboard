name: Temporary QoL presets formatter
on:
  push:
    branches:
      - feat/qol-2-1-favorite-tools-pen-presets
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/App.tsx src/app/board-chrome/BoardToolDock.tsx src/app/board-chrome/quick-tool-preferences.ts src/app/board-chrome/quick-tool-preferences.test.ts src/app/board/controllers/useBoardKeyboardShortcuts.ts src/app/board/shortcuts/board-shortcuts.ts src/app/board/views/BoardShortcutsDialog.tsx src/app/board/views/BoardToolDockContainer.tsx tests/e2e/qol-quick-tools.spec.ts src/app/styles.css
      - name: Commit repository formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/board-chrome/BoardToolDock.tsx src/app/board-chrome/quick-tool-preferences.ts src/app/board-chrome/quick-tool-preferences.test.ts src/app/board/controllers/useBoardKeyboardShortcuts.ts src/app/board/shortcuts/board-shortcuts.ts src/app/board/views/BoardShortcutsDialog.tsx src/app/board/views/BoardToolDockContainer.tsx tests/e2e/qol-quick-tools.spec.ts src/app/styles.css
          git commit -m "style(qol): apply project Prettier formatting"
          git push origin HEAD:feat/qol-2-1-favorite-tools-pen-presets
