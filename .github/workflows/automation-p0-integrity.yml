name: Apply P0 command integrity

on:
  push:
    branches:
      - feature/p0-command-integrity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-command-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - name: Apply source patch
        run: python .automation/apply-p0-integrity.py
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test
      - name: Architecture boundaries
        run: npm run architecture
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(sync): add command codec and quarantine"
          git push origin HEAD:feature/p0-command-integrity
