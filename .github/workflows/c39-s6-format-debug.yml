name: C3.9-S6 formatting diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/c39-s6-format-debug.yml"
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/adapters/board-document-worker/client.ts src/app/SyncedApp.tsx src/core/board/selectors.ts tests/e2e/c39-large-board-profile.spec.ts tests/unit/core/c39-s6-viewport-selector.test.ts
          echo BEGIN_C39_S6_FORMAT_DIFF
          git diff -- src/adapters/board-document-worker/client.ts src/app/SyncedApp.tsx src/core/board/selectors.ts tests/e2e/c39-large-board-profile.spec.ts tests/unit/core/c39-s6-viewport-selector.test.ts
          echo END_C39_S6_FORMAT_DIFF
