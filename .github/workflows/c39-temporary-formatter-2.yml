name: Temporary C3.9-E1 formatting verification

on:
  pull_request:
    paths:
      - .github/workflows/c39-temporary-formatter-2.yml

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and print exact files
        run: |
          set -euo pipefail
          npx prettier --write scripts/c39/compare-profiles.mjs tests/node/c39-compare-profiles.test.mjs
          printf 'C39E1_SCRIPT='
          base64 -w0 scripts/c39/compare-profiles.mjs
          printf '\nC39E1_TEST='
          base64 -w0 tests/node/c39-compare-profiles.test.mjs
          printf '\n'
