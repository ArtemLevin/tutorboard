name: QoL 2.6 format once
on:
  push:
    branches: [feat/qol-2-6-teacher-follow]
    paths: [.github/workflows/qol-2-6-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format scoped feature sources and remove this workflow
        run: |
          npx prettier --write             src/app/board/teacher-follow.ts             src/app/board/teacher-follow.test.ts             src/app/board/views/BoardTeacherFollowControls.tsx             src/app/board/views/BoardTeacherFollowControls.css             src/app/App.tsx             src/app/SyncedApp.tsx             src/app/board/views/BoardCanvas.tsx             src/adapters/canvas-konva/BoardStage.tsx             tests/fullstack/standalone-pilot.spec.ts
          git rm .github/workflows/qol-2-6-format-once.yml
          git add src/app/board src/app/App.tsx src/app/SyncedApp.tsx src/adapters/canvas-konva/BoardStage.tsx tests/fullstack/standalone-pilot.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(qol): format teacher follow implementation'
          git push origin HEAD:feat/qol-2-6-teacher-follow
