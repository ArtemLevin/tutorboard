name: Handwritten function PR 3 browser gate

on:
  push:
    branches:
      - feat/handwritten-function-workflow

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/handwritten-function-workflow
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Build production bundle
        run: npm run build
        env:
          VITE_FEATURE_SERVER_SYNC: "true"
          VITE_GEOMETRYOS_BASE_URL: http://127.0.0.1:4173/geometryos
      - name: Run handwritten function browser flow
        run: npx playwright test tests/e2e/handwritten-function-production.spec.ts
