name: Finalize ordered sync tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Complete BoardSyncEngine fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/unit/modules/server-sync/sync.test.ts")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r"new BoardSyncEngine\(\{(?P<body>.*?)\n    \}\);", re.S)
          patched = 0

          def add_callback(match: re.Match[str]) -> str:
              global patched
              body = match.group("body")
              if "onStateChange:" in body:
                  return match.group(0)
              marker = re.search(r"\n      now: \(\) => [^\n]+,", body)
              if marker is None:
                  raise SystemExit("BoardSyncEngine fixture without now callback")
              insert_at = marker.end()
              body = body[:insert_at] + "\n      onStateChange: () => undefined," + body[insert_at:]
              patched += 1
              return "new BoardSyncEngine({" + body + "\n    });"

          text = pattern.sub(add_callback, text)
          if patched != 3:
              raise SystemExit(f"expected to patch 3 fixtures, patched {patched}")

          old_push = '''      result ?? {
                  currentDocumentSha256: "c".repeat(64),
                  revision: this.pushed.length,
                  snapshotDue: false,
                  status: "accepted",
                },'''
          new_push = '''      result ?? {
                  currentDocumentSha256: envelope.expectedDocumentSha256,
                  revision: envelope.baseRevision + 1,
                  snapshotDue: false,
                  status: "accepted",
                },'''
          if old_push not in text:
              raise SystemExit("fake repository acceptance marker missing")
          text = text.replace(old_push, new_push, 1)

          old_offline = '''    const offline = await engine.bootstrap();
              expect(offline).toMatchObject({'''
          new_offline = '''    await engine.bootstrap();
              expect(states.at(-1)).toMatchObject({'''
          if old_offline not in text:
              raise SystemExit("offline state marker missing")
          text = text.replace(old_offline, new_offline, 1)

          def replace_after(anchor: str, old: str, new: str) -> None:
              nonlocal_text = text_holder[0]
              start = nonlocal_text.find(anchor)
              if start < 0:
                  raise SystemExit(f"anchor missing: {anchor}")
              position = nonlocal_text.find(old, start)
              if position < 0:
                  raise SystemExit(f"marker missing after {anchor}: {old[:80]}")
              text_holder[0] = (
                  nonlocal_text[:position]
                  + new
                  + nonlocal_text[position + len(old):]
              )

          text_holder = [text]
          uncertain = 'it("acknowledges an uncertain retry already present in the server journal"'
          replace_after(
              uncertain,
              "    const engine = new BoardSyncEngine({",
              "    const states: BoardSyncState[] = [];\n    const engine = new BoardSyncEngine({",
          )
          replace_after(
              uncertain,
              "      onStateChange: () => undefined,",
              "      onStateChange: (state) => states.push(state),",
          )
          replace_after(
              uncertain,
              '''    const state = await engine.bootstrap();
          
              expect(state).toMatchObject({''',
              '''    await engine.bootstrap();
          
              expect(states.at(-1)).toMatchObject({''',
          )

          parent = 'it("loads an assigned parent board without attempting to create it"'
          replace_after(
              parent,
              "    const engine = new BoardSyncEngine({",
              "    const states: BoardSyncState[] = [];\n    const engine = new BoardSyncEngine({",
          )
          replace_after(
              parent,
              "      onStateChange: () => undefined,",
              "      onStateChange: (state) => states.push(state),",
          )
          replace_after(
              parent,
              '''    const state = await engine.bootstrap();
          
              expect(ensureBoard).not.toHaveBeenCalled();
              expect(state).toMatchObject({''',
              '''    await engine.bootstrap();
          
              expect(ensureBoard).not.toHaveBeenCalled();
              expect(states.at(-1)).toMatchObject({''',
          )

          path.write_text(text_holder[0], encoding="utf-8")
          PY
      - run: npx prettier --write tests/unit/modules/server-sync/sync.test.ts .github/workflows/automation-p0-v13-frontend-finalize.yml
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- tests/unit/modules/server-sync/sync.test.ts
      - run: npm run build
      - name: Commit implementation
        run: |
          rm -f .github/workflows/automation-p0-v13-frontend-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(sync): complete ordered engine fixtures"
          git push origin HEAD:feature/p0-ordered-envelope-v13
