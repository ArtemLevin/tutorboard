name: Finalize ordered sync tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/finalize_sync_v13.py
      - run: npx prettier --write tests/unit/modules/server-sync/sync.test.ts .github/workflows/automation-p0-v13-frontend-finalize.yml
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- tests/unit/modules/server-sync/sync.test.ts
      - run: npm run build
      - name: Commit implementation
        run: |
          rm -f .github/workflows/automation-p0-v13-frontend-finalize.yml scripts/finalize_sync_v13.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(sync): complete ordered engine fixtures"
          git push origin HEAD:feature/p0-ordered-envelope-v13
