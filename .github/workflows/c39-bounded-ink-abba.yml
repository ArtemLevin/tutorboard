name: C3.9 bounded ink scene/hit ABBA

on:
  pull_request:
    paths:
      - .github/workflows/c39-bounded-ink-abba.yml
      - scripts/c39/compare-bounded-ink-abba.mjs
      - src/adapters/canvas-konva/board-scene-content.tsx
      - src/adapters/canvas-konva/wheel-ink-cache.ts
      - tests/e2e/c39-large-board-profile.spec.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c39-bounded-ink-abba-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASE_SHA: 82baf7d86df0b2bbac4d89498484e385f2e5303b
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out comparison harness
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build exact isolated source revisions
        run: |
          set -euo pipefail
          for sha in "$BASE_SHA" "$CANDIDATE_SHA"; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git fetch --no-tags origin "$sha"
          done
          git worktree add --detach "$RUNNER_TEMP/c39-control" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/c39-candidate" "$CANDIDATE_SHA"
          for role in control candidate; do
            (cd "$RUNNER_TEMP/c39-$role" && npm ci && npm run build)
          done
          (cd "$RUNNER_TEMP/c39-candidate" && npx playwright install --with-deps chromium)
      - name: Run three chronological ABBA cycles per runner
        env:
          C39_STATIC_HEAVY_PROFILE: "1"
        run: |
          set -euo pipefail
          mkdir -p c39-bounded-ink-abba
          : > c39-bounded-ink-abba/manifest.jsonl
          for cycle in 1 2 3; do
            for position in 1 2 3 4; do
              role=candidate
              if ((position == 1 || position == 4)); then role=control; fi
              sha="$CANDIDATE_SHA"
              if [[ "$role" == control ]]; then sha="$BASE_SHA"; fi
              log="$GITHUB_WORKSPACE/c39-bounded-ink-abba/c${cycle}-p${position}-${role}.log"
              (
                cd "$RUNNER_TEMP/c39-$role"
                test -z "$(git status --porcelain)"
                GITHUB_SHA="$sha" npm run e2e:c39-profile -- \
                  --grep 'static-(5000|10000)-10-images' \
                  --project=chromium --workers=1 --retries=0
              ) 2>&1 | tee "$log"
              printf '{"role":"%s","sha":"%s","log":"%s"}\n' \
                "$role" "$sha" "$log" >> c39-bounded-ink-abba/manifest.jsonl
            done
          done
      - name: Validate fixture and compute paired performance decision
        run: |
          node scripts/c39/compare-bounded-ink-abba.mjs \
            c39-bounded-ink-abba/manifest.jsonl \
            c39-bounded-ink-abba/result.json
      - name: Preserve all logs and numerical observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c39-bounded-ink-abba-runner-${{ matrix.runner }}
          path: c39-bounded-ink-abba/
          retention-days: 14
          if-no-files-found: warn
