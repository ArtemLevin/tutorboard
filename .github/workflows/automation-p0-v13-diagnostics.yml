name: Diagnose ordered envelope tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture focused Vitest report
        run: |
          mkdir -p .automation
          npx vitest run \
            tests/unit/modules/server-sync/sync.test.ts \
            tests/integration/coordinate-plot-sync.test.ts \
            tests/unit/adapters/board-http/client.test.ts \
            tests/unit/adapters/sync-dexie/queue.test.ts \
            tests/unit/core/board/commands/timestamp-ordering.test.ts \
            --reporter=json --outputFile=.automation/p0-v13-test-results.json || true
      - name: Remove temporary workflow
        run: rm -f .github/workflows/automation-p0-v13-diagnostics.yml
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(sync): capture ordered envelope failures"
          git push origin HEAD:feature/p0-ordered-envelope-v13
