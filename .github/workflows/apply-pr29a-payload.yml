name: Apply PR 2.9A payload

on:
  push:
    branches:
      - feat/2.9a-gir-semantic-adapter
    paths:
      - .github/pr29a-payload.part*
      - .github/workflows/apply-pr29a-payload.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr29a-payload.part* | tr -d '\n\r' | base64 --decode > /tmp/pr29a.zip
          echo '35738909f9411fc87bc02cbe1ef33b144c2824ad3ad5639cea114e976d599562  /tmp/pr29a.zip' | sha256sum --check --strict
          unzip -t /tmp/pr29a.zip

      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o /tmp/pr29a.zip -d .
          rm -f PR_2_9A_IMPLEMENTATION.md
          rm -f .github/pr29a-payload.part*
          rm -f .github/workflows/apply-pr29a-payload.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat(geometry-import): add pure GIR semantic adapter'
          git push
