name: Temporary authoritative 3D-4C finalizer

on:
  push:
    branches:
      - agent/3d-4c-generalized-sections

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require clean finalized 4B
        run: |
          git fetch origin agent/3d-4b-construction-studio
          if git ls-tree -r --name-only origin/agent/3d-4b-construction-studio | grep -E '(^|/)__temp-|^\.3d4'; then
            echo '3D-4B still contains temporary infrastructure.' >&2
            exit 1
          fi
      - name: Synchronize final 4B foundation
        run: |
          for path in \
            src/adapters/solid-3d-three/rotation-gizmo.ts \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.css \
            src/app/solid-3d/Solid3DOrientationEditor.test.tsx \
            src/app/solid-3d/Solid3DOrientationPresets.test.tsx \
            src/app/solid-3d/Solid3DConstructionEditor.tsx \
            src/app/solid-3d/Solid3DConstructionEditor.css \
            src/app/solid-3d/Solid3DConstructionEditor.test.tsx \
            src/app/solid-3d/Solid3DParameterEditor.tsx \
            src/core/solid-3d/model-transform.ts \
            src/core/solid-3d/construction.ts \
            src/modules/solid-3d/board-projection.ts \
            src/modules/text-shape-placement/catalog.ts \
            src/modules/text-shape-placement/parametric-3d.ts \
            src/modules/text-shape-placement/templates.ts \
            src/modules/text-shape-placement/public.ts \
            tests/unit/adapters/solid-3d-three/rotation-gizmo.test.ts \
            tests/unit/core/solid-3d/model-transform.test.ts \
            tests/unit/core/solid-3d/model-transform-persistence.test.ts \
            tests/unit/core/solid-3d/construction.test.ts \
            tests/unit/core/solid-3d/semantic-solid-persistence.test.ts \
            tests/unit/modules/solid-3d/board-projection-rotation.test.ts \
            tests/unit/modules/text-shape-placement/parametric-3d.test.ts; do
              git show origin/agent/3d-4b-construction-studio:$path > $path
          done
      - name: Reassert 4C editor integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/solid-3d/Solid3DEditorPanel.tsx')
          text = path.read_text()
          if '  withSolid3DModelQuaternion,\n' not in text:
            text = text.replace(
              '  solidSectionId,\n',
              '  solidSectionId,\n  withSolid3DModelQuaternion,\n',
              1,
            )
          if '              highlightedSurfaceId={hoveredSurfaceId}\n' not in text:
            text = text.replace(
              '              highlightedElement={highlightedElement}\n',
              '              highlightedElement={highlightedElement}\n              highlightedSurfaceId={hoveredSurfaceId}\n',
              1,
            )
          if '              onModelRotationCommit={' not in text:
            text = text.replace(
              '              onElementHover={setHighlightedElement}\n',
              '''              onElementHover={setHighlightedElement}\n              onModelRotationCommit={\n                readOnly\n                  ? undefined\n                  : (rotation) =>\n                      onRecordChange(\n                        withSolid3DModelQuaternion(record, rotation),\n                      )\n              }\n''',
              1,
            )
          text = text.replace(
            '      if (readOnly) return;\n      const point: Solid3DPoint = {',
            '      if (readOnly || record.points.length >= 32) return;\n      const point: Solid3DPoint = {',
            1,
          )
          text = text.replace(
            '            disabled={readOnly}\n            onClick={() => setMode("points")}',
            '            disabled={readOnly || record.points.length >= 32}\n            onClick={() => setMode("points")}',
            1,
          )
          path.write_text(text)
          PY
      - name: Assert generalized section contracts
        run: |
          grep -q 'through-edge-and-point' src/core/solid-3d/section-constraints.ts
          grep -q 'through-point-parallel-face' src/core/solid-3d/section-constraints.ts
          grep -q 'through-point-perpendicular-edge' src/core/solid-3d/section-constraints.ts
          grep -q 'through-point-parallel-surface' src/core/solid-3d/section-constraints.ts
          grep -q 'solid.section.limit' src/modules/solid-3d/section-editor.ts
          grep -q 'isSyntheticSolidSectionHelperPoint' src/core/solid-3d/point-resolution.ts
          grep -q 'readonly label?: string' src/core/solid-3d/definitions.ts
          grep -q 'label: z.string().min(1).max(32).optional()' src/core/board/validation/schema.ts
          grep -q 'Создать сечение' src/app/solid-3d/Solid3DEditorPanel.tsx
          grep -q 'Плоскость по условию' src/app/solid-3d/Solid3DSectionConstraintBuilder.tsx
      - run: npm run format
      - run: npm run board-contract:generate
      - run: npm run format
      - run: npm run check
      - name: Remove temporary 3D-4C infrastructure
        run: |
          find .github/workflows -maxdepth 1 -type f -name '__temp-3d4c-*.yml' -print -delete || true
          find . -maxdepth 1 -type f -name '.3d4c-*' -print -delete || true
      - name: Commit finalized clean tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(3d): finalize generalized section release layer"
          fi
      - name: Attach exact finalized 4B history
        run: |
          if ! git merge-base --is-ancestor origin/agent/3d-4b-construction-studio HEAD; then
            git merge -s ours origin/agent/3d-4b-construction-studio --no-edit -m "Merge exact finalized 3D-4B base into 3D-4C"
          fi
          git push
