name: Temporary piecewise Prettier diagnostics
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/plot-prettier-diagnostics.yml'
jobs:
  report-format-diff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx prettier --write src/app/board/controllers/useCoordinatePlotController.ts src/app/CoordinatePlotEditorPanel.tsx src/core/board/piecewise.ts src/core/plot-sampling/preparation.ts src/core/plot-sampling/series-sampler.ts src/modules/coordinate-plot-editor/model.ts tests/unit/modules/coordinate-plot-editor/piecewise.test.ts scripts/board-contract-lib.mjs
      - name: Print formatter changes
        run: git diff --no-ext-diff -- src/app/board/controllers/useCoordinatePlotController.ts src/app/CoordinatePlotEditorPanel.tsx src/core/board/piecewise.ts src/core/plot-sampling/preparation.ts src/core/plot-sampling/series-sampler.ts src/modules/coordinate-plot-editor/model.ts tests/unit/modules/coordinate-plot-editor/piecewise.test.ts scripts/board-contract-lib.mjs
