name: Temporary piecewise Prettier diagnostics
on:
  pull_request:
    paths:
      - 'tests/e2e/piecewise-coordinate-plot.spec.ts'
      - '.github/workflows/plot-prettier-diagnostics.yml'
jobs:
  report-format-diff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx prettier --write tests/e2e/piecewise-coordinate-plot.spec.ts
      - name: Print formatter changes
        run: git diff --no-ext-diff -- tests/e2e/piecewise-coordinate-plot.spec.ts
