name: C39 temporary B formatting and checks
on:
  push:
    branches:
      - perf/c3-9-b-frame-attribution
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format modified sources and emit replayable blobs
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/adapters/canvas-konva/board-frame-trace.ts src/adapters/canvas-konva/BoardStage.tsx tests/e2e/c39-frame-attribution.ts tests/e2e/c39-large-board-profile.spec.ts tests/unit/core/c39-frame-attribution.test.ts
          for file in src/adapters/canvas-konva/board-frame-trace.ts src/adapters/canvas-konva/BoardStage.tsx tests/e2e/c39-frame-attribution.ts tests/e2e/c39-large-board-profile.spec.ts tests/unit/core/c39-frame-attribution.test.ts; do
            printf 'C39BFMT:%s:' "$file"
            base64 --wrap=0 "$file"
            printf '\n'
          done
      - name: Typecheck
        run: npm run typecheck
      - name: Focused regression tests
        run: npm run test -- tests/unit/core/c39-frame-attribution.test.ts
