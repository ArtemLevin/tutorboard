name: Temporary 3D-4B vertex reordering

on:
  push:
    branches:
      - agent/3d-4b-construction-studio

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Add synchronized vertex reordering controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/solid-3d/Solid3DConstructionEditor.tsx')
          text = path.read_text()
          marker = '''  const removeVertex = (index: number): void => {\n    if (draftBase.length <= 3) return;\n    setDraftBase((current) =>\n      current.filter((_, candidate) => candidate !== index),\n    );\n    setDraftTopBase((current) =>\n      current.filter((_, candidate) => candidate !== index),\n    );\n  };\n\n'''
          insertion = marker + '''  const moveVertex = (index: number, direction: -1 | 1): void => {\n    const target = index + direction;\n    if (target < 0 || target >= draftBase.length) return;\n    const reorder = (current: Vec2[]): Vec2[] => {\n      const next = [...current];\n      const selected = next[index];\n      const other = next[target];\n      if (selected === undefined || other === undefined) return current;\n      next[index] = other;\n      next[target] = selected;\n      return next;\n    };\n    setDraftBase(reorder);\n    if (record.definition.kind === "truncated-pyramid")\n      setDraftTopBase(reorder);\n  };\n\n'''
          if marker not in text:
              raise SystemExit('removeVertex marker missing')
          text = text.replace(marker, insertion, 1)
          button_marker = '''              <button\n                aria-label={`Удалить вершину ${String(index + 1)}`}\n                disabled={readOnly || draftBase.length <= 3}\n                onClick={() => removeVertex(index)}\n                type="button"\n              >\n                ×\n              </button>\n'''
          buttons = '''              <div className="solid-3d-base-order">\n                <button\n                  aria-label={`Поднять вершину ${String(index + 1)}`}\n                  disabled={readOnly || index === 0}\n                  onClick={() => moveVertex(index, -1)}\n                  type="button"\n                >\n                  ↑\n                </button>\n                <button\n                  aria-label={`Опустить вершину ${String(index + 1)}`}\n                  disabled={readOnly || index === draftBase.length - 1}\n                  onClick={() => moveVertex(index, 1)}\n                  type="button"\n                >\n                  ↓\n                </button>\n                <button\n                  aria-label={`Удалить вершину ${String(index + 1)}`}\n                  disabled={readOnly || draftBase.length <= 3}\n                  onClick={() => removeVertex(index)}\n                  type="button"\n                >\n                  ×\n                </button>\n              </div>\n'''
          if button_marker not in text:
              raise SystemExit('vertex delete marker missing')
          text = text.replace(button_marker, buttons, 1)
          path.write_text(text)

          css = Path('src/app/solid-3d/Solid3DConstructionEditor.css')
          css_text = css.read_text()
          css_text = css_text.replace(
              '  grid-template-columns: 1.5rem minmax(0, 1fr) minmax(0, 1fr) 2rem;\n',
              '  grid-template-columns: 1.5rem minmax(0, 1fr) minmax(0, 1fr) auto;\n',
              1,
          )
          css_text += '''\n.solid-3d-base-order {\n  display: flex;\n  gap: 0.2rem;\n}\n\n.solid-3d-base-order button {\n  min-width: 1.8rem;\n  padding: 0.2rem;\n}\n'''
          css.write_text(css_text)

          test = Path('src/app/solid-3d/Solid3DConstructionEditor.test.tsx')
          test_text = test.read_text()
          marker = '''    expect(screen.getByRole("button", { name: "+ вершина" })).toBeEnabled();\n'''
          if marker not in test_text:
              raise SystemExit('construction test marker missing')
          test_text = test_text.replace(
              marker,
              marker + '''    expect(screen.getByRole("button", { name: "Опустить вершину 1" })).toBeEnabled();\n    fireEvent.click(screen.getByRole("button", { name: "Опустить вершину 1" }));\n''',
              1,
          )
          test.write_text(test_text)
          PY
      - run: npm run format
      - name: Commit reordering
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(3d): reorder arbitrary base vertices"
          git push
