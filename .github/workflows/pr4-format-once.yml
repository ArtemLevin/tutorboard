name: PR4 format once

on:
  push:
    branches:
      - feature/coordinate-plot-konva-renderer
    paths:
      - .github/workflows/pr4-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-konva-renderer
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: |
          npx prettier --write \
            src/adapters/canvas-konva/coordinate-plot-render-model.ts \
            src/adapters/canvas-konva/coordinate-plot-renderer.tsx \
            src/adapters/canvas-konva/coordinate-plot-rendering.ts \
            tests/unit/adapters/canvas-konva/coordinate-plot-rendering.test.ts
          rm .github/workflows/pr4-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format coordinate plot renderer"
          git push origin HEAD:feature/coordinate-plot-konva-renderer
