name: C3.9 bounded screenshot format probe

on:
  pull_request:
    paths:
      - .github/workflows/c39-bounded-format-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier exact diff
        run: |
          npx prettier --write tests/e2e/c39-large-board-profile.spec.ts
          git diff -- tests/e2e/c39-large-board-profile.spec.ts
