name: Smart Ink release gate retry

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/phase9-smart-ink-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase9-smart-ink-release-gate
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Extract and apply prepared patch
        shell: bash
        run: |
          if grep -q 'readonly smartInk: boolean' src/app/configuration/environment.ts; then
            echo "Smart Ink release gate patch already applied."
            exit 0
          fi
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(
              ".github/workflows/smart-ink-release-gate-helper.yml"
          ).read_text(encoding="utf-8")
          step = workflow.index("      - name: Apply release gate patch")
          start_marker = "        run: |\n"
          start = workflow.index(start_marker, step) + len(start_marker)
          end = workflow.index("      - name: Install dependencies", start)
          script = dedent(workflow[start:end]).replace(
              "if count != 1:",
              "if count < 1:",
          )
          Path("/tmp/apply-smart-ink-release-gate.sh").write_text(
              script,
              encoding="utf-8",
          )
          PY
          bash /tmp/apply-smart-ink-release-gate.sh
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run focused tests
        run: >-
          npx vitest run
          src/app/configuration/environment.test.ts
          src/app/SmartInkReleaseGate.test.tsx
          src/app/ProductShell.smart-ink-gate.test.tsx
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add . \
            ':!.github/workflows/smart-ink-release-gate-helper.yml' \
            ':!.github/workflows/smart-ink-release-gate-pr-helper.yml' \
            ':!.github/workflows/smart-ink-release-gate-retry.yml'
          git commit -m "feat: add Smart Ink production release gate"
          git push origin HEAD:agent/phase9-smart-ink-release-gate
