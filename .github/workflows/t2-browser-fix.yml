name: T2 temporary browser assertion repair

on:
  push:
    branches:
      - agent/t2-teacher-board-workspace
    paths:
      - .github/workflows/t2-browser-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/t2-teacher-board-workspace
      - name: Make async controlled-switch assertions wait for server authority
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("tests/e2e/teacher-boards-workspace.spec.ts")
          text = path.read_text()

          invite_pattern = re.compile(
              r'''  await xeniaRow\n\s*\.getByRole\("checkbox", \{ name: "Разрешить редактирование" \}\)\n\s*\.uncheck\(\);\n\s*await expect\n\s*\.poll\(\n\s*\(\) =>\n\s*api\.state\.invitations\.get\(initialBoardId\)\?\.\[1\]\?\.writeEnabled \?\?\n\s*api\.state\.invitations\.get\(initialBoardId\)\?\.\[0\]\?\.writeEnabled,\n\s*\)\n\s*\.toBe\(false\);'''
          )
          invite_replacement = '''  const xeniaWriteCheckbox = xeniaRow.getByRole("checkbox", {
            name: "Разрешить редактирование",
          });
          await xeniaWriteCheckbox.click();
          await expect.poll(() => xeniaWriteCheckbox.isChecked()).toBe(false);
          await expect
            .poll(() =>
              api.state.invitations
                .get(initialBoardId)
                ?.find((invitation) => invitation.invitationId === initialInvitationId)
                ?.writeEnabled,
            )
            .toBe(false);'''
          text, invite_count = invite_pattern.subn(invite_replacement, text, count=1)
          if invite_count != 1:
              raise SystemExit(f"invite assertion match count={invite_count}")

          board_pattern = re.compile(
              r'''  await algebraCard\n\s*\.getByRole\("checkbox", \{\n\s*name: "Разрешать запись гостям, у которых она включена в ссылке",\n\s*\}\)\n\s*\.uncheck\(\);\n\s*await expect\(algebraCard\.getByText\("Только чтение"\)\)\.toBeVisible\(\);'''
          )
          board_replacement = '''  const boardWriteCheckbox = algebraCard.getByRole("checkbox", {
            name: "Разрешать запись гостям, у которых она включена в ссылке",
          });
          await boardWriteCheckbox.click();
          await expect.poll(() => boardWriteCheckbox.isChecked()).toBe(false);
          await expect(algebraCard.getByText("Только чтение")).toBeVisible();'''
          text, board_count = board_pattern.subn(board_replacement, text, count=1)
          if board_count != 1:
              raise SystemExit(f"board assertion match count={board_count}")
          path.write_text(text)
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/teacher-boards-workspace.spec.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_FEATURE_SERVER_SYNC: "true"
          VITE_GEOMETRYOS_BASE_URL: http://127.0.0.1:4173/geometryos
      - run: npx playwright test tests/e2e/teacher-boards-workspace.spec.ts --project=chromium
      - name: Commit browser assertion repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/teacher-boards-workspace.spec.ts
          git commit -m "test: wait for authoritative T2 switch updates"
          git push origin HEAD:agent/t2-teacher-board-workspace
