name: Temporary clean 3D-4B base synchronization

on:
  push:
    branches:
      - agent/3d-4b-construction-studio

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require a clean finalized 4A base
        run: |
          git fetch origin agent/3d-4a-persistent-transform
          if git ls-tree -r --name-only origin/agent/3d-4a-persistent-transform | grep -E '(^|/)__temp-|^\.3d4'; then
            echo '3D-4A still contains temporary infrastructure.' >&2
            exit 1
          fi
      - name: Synchronize finalized 4A files
        run: |
          for path in \
            src/adapters/solid-3d-three/rotation-gizmo.ts \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/app/solid-3d/Solid3DEditorPanel.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.css \
            src/app/solid-3d/Solid3DOrientationEditor.test.tsx \
            src/core/solid-3d/model-transform.ts \
            src/modules/solid-3d/board-projection.ts \
            tests/unit/adapters/solid-3d-three/rotation-gizmo.test.ts \
            tests/unit/core/solid-3d/model-transform.test.ts \
            tests/unit/modules/solid-3d/board-projection-rotation.test.ts; do
              git show origin/agent/3d-4a-persistent-transform:$path > $path
          done
          npm run format
      - name: Commit files and self-cleanup
        run: |
          git rm -f .github/workflows/__temp-3d4b-clean-base-sync.yml
          git rm -f .3d4b-clean-sync-trigger || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(3d): synchronize clean finalized 3D-4A base"
          fi
      - name: Attach finalized 4A history
        run: |
          if ! git merge-base --is-ancestor origin/agent/3d-4a-persistent-transform HEAD; then
            git merge -s ours origin/agent/3d-4a-persistent-transform --no-edit -m "Merge clean finalized 3D-4A base into 3D-4B"
          fi
          git push
