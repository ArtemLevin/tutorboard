name: Temporary 3D-4B lifecycle fix

on:
  push:
    branches:
      - agent/3d-4b-construction-studio

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Synchronize stable 4A primitives
        run: |
          git fetch origin agent/3d-4a-persistent-transform
          git show origin/agent/3d-4a-persistent-transform:src/adapters/solid-3d-three/Solid3DViewport.tsx > src/adapters/solid-3d-three/Solid3DViewport.tsx
          git show origin/agent/3d-4a-persistent-transform:src/app/solid-3d/Solid3DOrientationEditor.tsx > src/app/solid-3d/Solid3DOrientationEditor.tsx
          git show origin/agent/3d-4a-persistent-transform:src/core/solid-3d/model-transform.ts > src/core/solid-3d/model-transform.ts
      - name: Remove effect-driven construction drafts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/solid-3d/Solid3DConstructionEditor.tsx')
          text = path.read_text()
          text = text.replace('  useEffect,\n', '')
          block = '''  useEffect(() => {\n    setDraftBase(cloneBase(currentBase ?? []));\n    setDraftTopBase(cloneBase(currentTopBase ?? []));\n    setMessage(null);\n  }, [record.definition]);\n\n'''
          if block not in text:
              raise SystemExit('construction effect block not found')
          path.write_text(text.replace(block, ''))

          parent = Path('src/app/solid-3d/Solid3DParameterEditor.tsx')
          parent_text = parent.read_text()
          needle = '''      <Solid3DConstructionEditor\n        onRecordChange={onRecordChange}\n'''
          replacement = '''      <Solid3DConstructionEditor\n        key={JSON.stringify(record.definition)}\n        onRecordChange={onRecordChange}\n'''
          if needle not in parent_text:
              raise SystemExit('construction editor insertion point not found')
          parent.write_text(parent_text.replace(needle, replacement, 1))
          PY
      - run: npm run format
      - name: Commit lifecycle fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(3d): stabilize Construction Studio lifecycle"
          git push
