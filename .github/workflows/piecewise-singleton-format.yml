name: Temporary singleton test formatting
on:
  pull_request:
    paths:
      - 'tests/unit/modules/coordinate-plot-editor/piecewise-corrections.test.ts'
      - '.github/workflows/piecewise-singleton-format.yml'
jobs:
  report:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/modules/coordinate-plot-editor/piecewise-corrections.test.ts
      - run: git diff --no-ext-diff -- tests/unit/modules/coordinate-plot-editor/piecewise-corrections.test.ts
