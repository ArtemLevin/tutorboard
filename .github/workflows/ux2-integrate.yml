name: UX2 integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    name: Integrate plot structure and discovery UX
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-ux-structure-discovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Connect named parameter creation to App
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("src/app/App.tsx")
          app_source = app_path.read_text(encoding="utf-8")
          start_marker = "  const addCoordinatePlotEditorParameter = useCallback("
          end_marker = "\n\n  const coordinatePlotInteraction"
          start = app_source.index(start_marker)
          end = app_source.index(end_marker, start)
          replacement = '''  const addCoordinatePlotEditorParameter = useCallback(
            (name?: string) => {
              const id = plotParameterId(`plot-parameter:${crypto.randomUUID()}`);
              setCoordinatePlotEditor((current) =>
                current === null
                  ? null
                  : {
                      ...current,
                      draft: addCoordinatePlotParameter(current.draft, id, name),
                    },
              );
            },
            [],
          );'''
          app_path.write_text(
              app_source[:start] + replacement + app_source[end:],
              encoding="utf-8",
          )

          test_path = Path("src/app/CoordinatePlotEditorPanel.test.tsx")
          test_source = test_path.read_text(encoding="utf-8")
          section = test_source.index(
              '  it("inserts functions around the selected expression and explains radians"'
          )
          formula_line = '    const formula = screen.getByLabelText("Формула явной функции");'
          formula_start = test_source.index(formula_line, section)
          formula_end = formula_start + len(formula_line)
          typed_formula = '''    const formula = screen.getByLabelText(
              "Формула явной функции",
            ) as HTMLInputElement;'''
          test_source = (
              test_source[:formula_start]
              + typed_formula
              + test_source[formula_end:]
          )
          test_source = test_source.replace(
              '''  it("supports WAI-ARIA tabs and localized enum values", () => {''',
              '''  it("supports WAI-ARIA tabs and localized enum values", async () => {''',
              1,
          )
          test_source = test_source.replace(
              '''    expect(parameters).toHaveFocus();''',
              '''    await waitFor(() => expect(parameters).toHaveFocus());''',
              1,
          )
          test_source = test_source.replace(
              '''    expect(view).toHaveFocus();''',
              '''    await waitFor(() => expect(view).toHaveFocus());''',
              1,
          )
          cta_marker = '''    fireEvent.click(
              screen.getByRole("button", { name: "Создать параметр «q»" }),
            );'''
          cta_replacement = '''    await waitFor(() =>
              expect(screen.getByLabelText("Формула явной функции")).toHaveFocus(),
            );
            fireEvent.click(
              screen.getByRole("button", { name: "Создать параметр «q»" }),
            );'''
          if test_source.count(cta_marker) != 1:
              raise SystemExit(f"Expected one CTA marker, found {test_source.count(cta_marker)}")
          test_path.write_text(
              test_source.replace(cta_marker, cta_replacement, 1),
              encoding="utf-8",
          )
          PY

      - name: Format and verify targeted implementation
        run: |
          npx prettier --write \
            src/app/App.tsx \
            src/app/CoordinatePlotEditorPanel.tsx \
            src/app/CoordinatePlotEditorPanel.css \
            src/app/CoordinatePlotEditorPanel.test.tsx \
            src/app/CoordinatePlotEditorPanel.accessibility.test.tsx \
            src/modules/coordinate-plot-editor/model.ts \
            tests/e2e/coordinate-plot-editor.spec.ts \
            tests/e2e/coordinate-plot-production.spec.ts \
            tests/e2e/coordinate-plot-discovery.spec.ts \
            tests/unit/modules/coordinate-plot-editor/model.test.ts
          npm run typecheck
          npx vitest run \
            src/app/CoordinatePlotEditorPanel.test.tsx \
            src/app/CoordinatePlotEditorPanel.accessibility.test.tsx \
            tests/unit/modules/coordinate-plot-editor/model.test.ts

      - name: Push formatted product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/App.tsx \
            src/app/CoordinatePlotEditorPanel.tsx \
            src/app/CoordinatePlotEditorPanel.css \
            src/app/CoordinatePlotEditorPanel.test.tsx \
            src/app/CoordinatePlotEditorPanel.accessibility.test.tsx \
            src/modules/coordinate-plot-editor/model.ts \
            tests/e2e/coordinate-plot-editor.spec.ts \
            tests/e2e/coordinate-plot-production.spec.ts \
            tests/e2e/coordinate-plot-discovery.spec.ts \
            tests/unit/modules/coordinate-plot-editor/model.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: integrate coordinate plot discovery workflow"
          git push origin HEAD:feature/coordinate-plot-ux-structure-discovery
