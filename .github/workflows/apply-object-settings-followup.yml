name: Apply object settings follow-up patch

on:
  push:
    branches:
      - feature/object-settings-right-double-click

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/object-settings-right-double-click
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-object-settings-followup.mjs
      - run: npx --yes prettier@3.9.6 --write src/app/App.tsx tests/e2e/object-settings-right-double-click.spec.ts
      - name: Commit product-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx tests/e2e/object-settings-right-double-click.spec.ts
          git rm .github/workflows/apply-object-settings-followup.yml scripts/apply-object-settings-followup.mjs
          git commit -m "fix: refine object settings routing"
          git push origin HEAD:feature/object-settings-right-double-click
