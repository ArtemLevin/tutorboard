name: Temporary Graph Contract Artifacts

on:
  pull_request:
    paths:
      - scripts/board-contract-lib.mjs
      - .github/workflows/graph-contract-artifacts.yml
      - src/core/board/commands/commands.ts

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run board-contract:generate
      - name: Export generated artifacts for review and commit
        run: |
          python3 - <<'PY'
          import base64
          import subprocess
          from pathlib import Path
          changed = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          for line in changed.splitlines():
              path = line[3:]
              if not path.startswith("contracts/board/"):
                  continue
              data = Path(path).read_bytes()
              encoded = base64.b64encode(data).decode("ascii")
              for index in range(0, len(encoded), 4000):
                  print(f"BOARD_GEN:{path}:{index // 4000}:{encoded[index:index + 4000]}")
          PY
