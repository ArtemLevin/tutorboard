name: Temporary 3D hover Prettier
on:
  push:
    branches:
      - fix/solid-3d-review-2026-10-21
    paths:
      - .github/workflows/temporary-3d-hover-prettier.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/adapters/solid-3d-three/Solid3DViewport.test.tsx
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/adapters/solid-3d-three/Solid3DViewport.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format hover overlay regression changes"
            git push origin HEAD:refs/heads/fix/solid-3d-review-2026-10-21
          fi
