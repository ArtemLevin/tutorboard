name: Temporary 3D gizmo format
on:
  push:
    paths:
      - ".github/workflows/temporary-3d-gizmo-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier changed 3D viewport and panel
        run: |
          npx prettier --write \
            src/adapters/solid-3d-three/Solid3DViewport.test.tsx \
            src/app/solid-3d/Solid3DEditorPanel.test.tsx \
            src/app/solid-3d/Solid3DEditorPanel.tsx
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/adapters/solid-3d-three/Solid3DViewport.test.tsx src/app/solid-3d/Solid3DEditorPanel.test.tsx src/app/solid-3d/Solid3DEditorPanel.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format hidden-ring regression"
            git push origin HEAD:refs/heads/fix/3d-hide-rotation-rings-default-20261020
          fi
