name: Temporary E2 Prettier export

on:
  pull_request:
    paths:
      - .github/workflows/c39-e2-temporary-formatter.yml

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format exact changed sources
        run: |
          set -euo pipefail
          for path in \
            tests/e2e/c39-large-board-profile.spec.ts \
            scripts/c39/summarize-e2.mjs \
            tests/node/c39-e2-summary.test.mjs \
            .github/workflows/c39-e2-render-run-isolation.yml; do
            npx prettier --write "$path"
            printf 'C39E2FMT:%s:' "$path"
            base64 -w0 "$path"
            printf '\n'
          done
