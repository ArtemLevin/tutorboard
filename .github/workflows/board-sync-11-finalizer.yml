name: Board sync 1.1 finalizer

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: board-sync-11-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/coordinate-plot-domain-model'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply and verify Board sync 1.1 boundary
        run: |
          node scripts/finalize-board-sync-11.mjs
          npm ci
          npm run format
          npm run board-contract:check
          npm run lint
          npm run typecheck
          npm run test

      - name: Commit clean transport changes
        run: |
          rm -f \
            .github/workflows/board-sync-11-finalizer.yml \
            scripts/finalize-board-sync-11.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Board sync transport with 1.1"
          git push
