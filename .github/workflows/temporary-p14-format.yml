name: Temporary P1.4 formatter
on:
  push:
    paths:
      - ".github/workflows/temporary-p14-format.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/solid-3d-rotation-two-points-p14-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format P1.4 changed files
        run: |
          npx prettier --write \
            src/adapters/solid-3d-three/Solid3DViewport.test.tsx \
            src/app/solid-3d/Solid3DEditorPanel.sweep.test.tsx \
            src/app/solid-3d/Solid3DEditorPanel.tsx \
            src/app/solid-3d/Solid3DSectionRotationControls.tsx \
            src/modules/solid-3d/section-rotation.ts \
            tests/e2e/solid-3d.spec.ts \
            tests/unit/modules/solid-3d/section-rotation.test.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/adapters/solid-3d-three src/app/solid-3d src/modules/solid-3d tests/e2e/solid-3d.spec.ts tests/unit/modules/solid-3d
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format P1.4 arbitrary axis implementation"
            git push origin HEAD:refs/heads/feat/solid-3d-rotation-two-points-p14-20261021
          fi
