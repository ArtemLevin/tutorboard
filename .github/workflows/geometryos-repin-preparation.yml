name: GeometryOS Repin Preparation

on:
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'integration/2.8.1-geometryos-contract-repin'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: integration/2.8.1-geometryos-contract-repin
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install locked GeometryOS code-generation toolchain
        run: npm ci --prefix tools/geometryos-contract

      - name: Prepare pinned GeometryOS contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-geometryos-repin.mjs

      - name: Apply product changes
        run: node scripts/run-finalize-geometryos-repin.mjs

      - name: Apply canonical formatting
        run: npm run format

      - name: Verify product tree
        run: npm run check

      - name: Commit product changes
        run: |
          git add \
            .github/workflows/ci.yml \
            PLAN.md \
            README.md \
            contracts/geometryos \
            docs/adr/ADR-006-geometryos-generated-client.md \
            docs/architecture/GEOMETRYOS_CLIENT.md \
            docs/spike/GEOMETRYOS_CONTRACT_BASELINE.md \
            package.json \
            scripts/geometryos-live-contract-smoke.mjs \
            scripts/vendor-geometryos-contract.mjs \
            src/adapters/geometryos-http/generated \
            tests/contracts/geometryos-contract.test.mjs
          if git diff --cached --quiet; then
            echo "PR 2.8.1 product files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: repin GeometryOS browser contract"
          git push origin HEAD:integration/2.8.1-geometryos-contract-repin
