name: GeometryOS Repin Preparation

on:
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'integration/2.8.1-geometryos-contract-repin'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: integration/2.8.1-geometryos-contract-repin
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install locked GeometryOS code-generation toolchain
        run: npm ci --prefix tools/geometryos-contract

      - name: Prepare pinned GeometryOS contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-geometryos-repin.mjs

      - name: Verify generated contract
        run: npm run geometryos:check

      - name: Commit generated artifacts
        run: |
          git add contracts/geometryos src/adapters/geometryos-http/generated
          if git diff --cached --quiet; then
            echo "Pinned contract artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate pinned GeometryOS contract"
          git push origin HEAD:integration/2.8.1-geometryos-contract-repin
