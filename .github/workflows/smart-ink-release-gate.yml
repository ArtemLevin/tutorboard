name: Agent access convergence patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/implement-board-production-plan' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/implement-board-production-plan
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply access convergence patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/app/SyncedApp.tsx",
              'import { useEffect, useRef, useState } from "react";',
              'import { useCallback, useEffect, useRef, useState } from "react";',
          )
          replace(
              "src/app/SyncedApp.tsx",
              '''interface SyncedAppProps {
            readonly accessContext?: BoardRuntimeAccessContext | undefined;
            readonly documentId: DocumentId;''',
              '''interface SyncedAppProps {
            readonly accessContext?: BoardRuntimeAccessContext | undefined;
            readonly documentId: DocumentId;
            readonly onAccessContextUpdated?:
              | ((context: BoardRuntimeAccessContext) => void)
              | undefined;
            readonly refreshAccessContext?:
              | (() => Promise<BoardRuntimeAccessContext>)
              | undefined;''',
          )
          replace(
              "src/app/SyncedApp.tsx",
              '''export function SyncedApp({
            accessContext,
            documentId,
            geometryOsClient,
            lessonId,
            mathInkRecognizer,
            queue,
            repository,
          }: SyncedAppProps) {''',
              '''export function SyncedApp({
            accessContext,
            documentId,
            geometryOsClient,
            lessonId,
            mathInkRecognizer,
            onAccessContextUpdated,
            queue,
            refreshAccessContext,
            repository,
          }: SyncedAppProps) {''',
          )
          replace(
              "src/app/SyncedApp.tsx",
              '''  const previousCollaborationStatusRef =
            useRef<BoardCollaborationStatus>("connecting");
          const [originId] = useState(collaborationOriginId);
          const [engine] = useState(
            () =>
              new BoardSyncEngine({
                ...(accessContext === undefined ? {} : { accessContext }),
                createIdempotencyKey: () => `client:${crypto.randomUUID()}`,
                documentId,
                now: () => new Date().toISOString(),
                originId,
                onStateChange: setState,
                queue,
                repository,
              }),
          );
          const handleAccessEvent = (event: BoardAccessControlEvent) => {
            if (event.type === "access.revoked") {
              engine.dispose();
              setEvidenceStatus("Доступ к совместной доске отозван.");
              return;
            }
            setEvidenceStatus(
              "Права доступа к доске изменились. Контекст будет обновлён перед следующей синхронизацией.",
            );
          };''',
              '''  const previousCollaborationStatusRef =
            useRef<BoardCollaborationStatus>("connecting");
          const accessRefreshInFlightRef = useRef<Promise<void> | null>(null);
          const accessRefreshBlockedRef = useRef(false);
          const [originId] = useState(collaborationOriginId);
          const [engine] = useState(
            () =>
              new BoardSyncEngine({
                ...(accessContext === undefined ? {} : { accessContext }),
                createIdempotencyKey: () => `client:${crypto.randomUUID()}`,
                documentId,
                now: () => new Date().toISOString(),
                originId,
                onStateChange: setState,
                queue,
                repository,
              }),
          );
          const refreshStandaloneAccess = useCallback((): Promise<void> => {
            if (refreshAccessContext === undefined) {
              return engine.setNetworkAvailable(true);
            }
            const existing = accessRefreshInFlightRef.current;
            if (existing !== null) return existing;

            accessRefreshBlockedRef.current = true;
            void engine.setNetworkAvailable(false);
            const refresh = refreshAccessContext()
              .then(async (context) => {
                await engine.updateAccessContext(context);
                onAccessContextUpdated?.(context);
                accessRefreshBlockedRef.current = false;
                setEvidenceStatus("Права доступа к доске обновлены.");
                if (navigator.onLine) {
                  await engine.setNetworkAvailable(true);
                }
              })
              .catch((error: unknown) => {
                accessRefreshBlockedRef.current = true;
                setEvidenceStatus(
                  error instanceof Error
                    ? `Не удалось обновить права доступа: ${error.message}`
                    : "Не удалось обновить права доступа к доске.",
                );
              })
              .finally(() => {
                if (accessRefreshInFlightRef.current === refresh) {
                  accessRefreshInFlightRef.current = null;
                }
              });
            accessRefreshInFlightRef.current = refresh;
            return refresh;
          }, [engine, onAccessContextUpdated, refreshAccessContext]);
          const handleAccessEvent = (event: BoardAccessControlEvent) => {
            if (event.type === "access.revoked") {
              engine.dispose();
              setEvidenceStatus("Доступ к совместной доске отозван.");
              return;
            }
            setEvidenceStatus("Права доступа к доске изменились. Обновляем контекст…");
            void refreshStandaloneAccess();
          };''',
          )
          replace(
              "src/app/SyncedApp.tsx",
              '''        onPresence: setParticipants,
                onRevision: () => void engine.synchronize(),
                onStatus: setCollaborationStatus,''',
              '''        onPresence: setParticipants,
                onRevision: () => {
                  if (accessRefreshBlockedRef.current) {
                    void refreshStandaloneAccess();
                    return;
                  }
                  void engine.synchronize();
                },
                onStatus: setCollaborationStatus,''',
          )
          replace(
              "src/app/SyncedApp.tsx",
              '''    void bootstrap().catch(() => void engine.bootstrap());
            const reconnect = () => void engine.setNetworkAvailable(true);
            const disconnect = () => void engine.setNetworkAvailable(false);
            window.addEventListener("online", reconnect);
            window.addEventListener("offline", disconnect);
            return () => {
              window.removeEventListener("online", reconnect);
              window.removeEventListener("offline", disconnect);
              engine.dispose();
            };
          }, [documentId, engine, lessonId, repository]);''',
              '''    void bootstrap().catch(() => void engine.bootstrap());
            const reconnect = () => {
              if (refreshAccessContext === undefined) {
                void engine.setNetworkAvailable(true);
                return;
              }
              void refreshStandaloneAccess();
            };
            const disconnect = () => void engine.setNetworkAvailable(false);
            window.addEventListener("online", reconnect);
            window.addEventListener("offline", disconnect);
            return () => {
              window.removeEventListener("online", reconnect);
              window.removeEventListener("offline", disconnect);
              engine.dispose();
            };
          }, [
            documentId,
            engine,
            lessonId,
            refreshAccessContext,
            refreshStandaloneAccess,
            repository,
          ]);''',
          )

          replace(
              "src/app/StandaloneBoardBootstrap.tsx",
              'import { useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useState } from "react";',
          )
          replace(
              "src/app/StandaloneBoardBootstrap.tsx",
              '''  const queue = useMemo(() => createDexiePendingBoardCommandQueue(), []);
            const selectedProvider = readFormulaRecognitionSettings().provider;''',
              '''  const queue = useMemo(() => createDexiePendingBoardCommandQueue(), []);
            const refreshAccessContext = useCallback(
              () =>
                fetchStandaloneBoardAccessContext(boardId, {
                  baseUrl: environment.boardApiBaseUrl,
                }),
              [boardId, environment.boardApiBaseUrl],
            );
            const selectedProvider = readFormulaRecognitionSettings().provider;''',
          )
          replace(
              "src/app/StandaloneBoardBootstrap.tsx",
              '''      mathInkRecognizer={mathInkRecognizer}
                queue={queue}
                repository={repository}''',
              '''      mathInkRecognizer={mathInkRecognizer}
                onAccessContextUpdated={repository.updateAccessContext}
                queue={queue}
                refreshAccessContext={refreshAccessContext}
                repository={repository}''',
          )

          replace(
              "src/modules/server-sync/sync.ts",
              '''  readonly #providedAccessContext: BoardRuntimeAccessContext | null;''',
              '''  #providedAccessContext: BoardRuntimeAccessContext | null;''',
          )
          replace(
              "src/modules/server-sync/sync.ts",
              '''      if (current !== null && current.cacheScopeId !== context.cacheScopeId) {
                throw new SyncRecoveryError(
                  "board.sync.access-scope-changed",
                  "Изменился security scope доски; требуется новый sync engine.",
                );
              }
              this.#context = context;''',
              '''      if (current !== null && current.cacheScopeId !== context.cacheScopeId) {
                throw new SyncRecoveryError(
                  "board.sync.access-scope-changed",
                  "Изменился security scope доски; требуется новый sync engine.",
                );
              }
              if (this.#providedAccessContext !== null) {
                this.#providedAccessContext = context;
              }
              this.#context = context;''',
          )
          PY
      - name: Restore workflows and format changed sources
        run: |
          git checkout origin/main -- .github/workflows/smart-ink-release-gate.yml
          git rm -f .github/workflows/agent-apply-access-refresh.yml
          npx prettier --write \
            src/app/SyncedApp.tsx \
            src/app/StandaloneBoardBootstrap.tsx \
            src/modules/server-sync/sync.ts \
            src/adapters/board-http/standalone.ts \
            src/adapters/board-http/public.ts
      - name: Commit patch back to feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: refresh standalone access before reconnect push'
          git push origin HEAD:agent/implement-board-production-plan
