name: Temporary Angle Validation Read Only
on:
  push:
    branches: [feat/3d-angle-between-lines-20261021]
    paths:
      - ".github/workflows/temporary-angle-validation.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Show generated contract and formatting diff
        run: |
          npm run board-contract:generate
          npx prettier --write src/core/solid-3d/definitions.ts src/core/solid-3d/line-angles.ts src/core/solid-3d/validation.ts src/core/solid-3d/public.ts src/core/board/validation/schema.ts src/modules/solid-3d/record-rebase.ts src/app/solid-3d/Solid3DEditorPanel.tsx src/app/solid-3d/Solid3DEditorPanel.test.tsx src/adapters/solid-3d-three/Solid3DViewport.tsx tests/unit/core/solid-3d/line-angles.test.ts tests/e2e/solid-3d.spec.ts scripts/board-contract-lib.mjs
          echo 'BEGIN_FORMAT_PATCH'
          git diff --no-ext-diff --unified=3
          echo 'END_FORMAT_PATCH'
