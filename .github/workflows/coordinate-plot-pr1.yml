name: Coordinate plot PR1 integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: coordinate-plot-pr1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/coordinate-plot-domain-model'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply and validate coordinate plot domain model
        run: bash scripts/run-coordinate-plot-pr1-integration.sh
