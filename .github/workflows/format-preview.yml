name: Format preview

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed sources
        run: |
          npx prettier --write \
            src/adapters/canvas-konva/BoardStage.tsx \
            tests/unit/adapters/canvas-konva/pointer-samples.test.ts \
            tests/unit/shared/stroke-input-fidelity.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/adapters/canvas-konva/BoardStage.tsx \
            tests/unit/adapters/canvas-konva/pointer-samples.test.ts \
            tests/unit/shared/stroke-input-fidelity.test.ts
          git commit -m "style: format ink input fidelity changes"
          git push origin HEAD:${GITHUB_HEAD_REF}
