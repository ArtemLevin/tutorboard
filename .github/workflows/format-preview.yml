name: Format preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed sources
        run: |
          npx prettier --write \
            src/adapters/canvas-konva/BoardStage.tsx \
            tests/unit/adapters/canvas-konva/pointer-samples.test.ts \
            tests/unit/shared/stroke-input-fidelity.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ink-input-formatted
          path: |
            src/adapters/canvas-konva/BoardStage.tsx
            tests/unit/adapters/canvas-konva/pointer-samples.test.ts
            tests/unit/shared/stroke-input-fidelity.test.ts
          if-no-files-found: error
          retention-days: 1
