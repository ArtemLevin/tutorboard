name: Apply PR5 Yandex mock patch

on:
  push:
    branches:
      - feat/configurable-formula-recognition

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/configurable-formula-recognition
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/apply-pr5-yandex-mock.mjs
      - run: npx prettier --write services/math-ink-proxy/service.mjs services/math-ink-proxy/server.mjs
      - run: rm scripts/apply-pr5-yandex-mock.mjs .github/workflows/pr5-yandex-mock-patch.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "test: enable local Yandex OCR mock"
          git push origin HEAD:feat/configurable-formula-recognition
