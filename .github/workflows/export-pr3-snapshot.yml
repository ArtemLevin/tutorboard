name: Export PR3 source snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build source manifest
        run: |
          {
            printf '%s\n' '# TutorBoard PR3 source manifest'
            printf '%s\n' "main_sha=$(git rev-parse HEAD)"
            printf '%s\n' '## All repository files'
            find . -type f \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -not -path './dist/*' \
              | sed 's#^./##' | sort
            printf '%s\n' '## Contract and ink matches'
            grep -RIlE \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              '(BoardDocument|drawing[.]pen-stroke|pen-stroke|exportSvg|exportPng|exportPdf|clipboard|persistence|server-sync|websocket|serialize|deserialize|migration|schemaVersion|documentVersion)' \
              src tests scripts contracts docs package.json 2>/dev/null | sort || true
          } > /tmp/pr3-manifest.txt
      - name: Publish manifest branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan automation-pr3-snapshot
          git rm -rf .
          cp /tmp/pr3-manifest.txt PR3_SOURCE_MANIFEST.md
          git add PR3_SOURCE_MANIFEST.md
          git commit -m 'chore: publish PR3 source manifest'
          git push --force origin HEAD:automation/pr3-snapshot
