name: Integrate Vector Ink PR3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/vector-ink-1.0
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply Vector Ink transforms
        id: transform
        continue-on-error: true
        run: |
          node .automation/apply-vector-ink-core.mjs > /tmp/vector-ink-transform.log 2>&1
          node .automation/apply-vector-ink-rendering.mjs >> /tmp/vector-ink-transform.log 2>&1
          npm run board-contract:generate >> /tmp/vector-ink-transform.log 2>&1
          npm run format >> /tmp/vector-ink-transform.log 2>&1
      - name: Publish transform failure
        if: steps.transform.outcome == 'failure'
        run: |
          mkdir -p .automation
          cp /tmp/vector-ink-transform.log .automation/vector-ink-transform-error.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: publish Vector Ink transform error'
          git push origin HEAD:feature/vector-ink-1.0
          exit 1
      - name: Remove integration-only files
        if: steps.transform.outcome == 'success'
        run: |
          rm -rf .automation
          rm -f .github/workflows/export-pr3-snapshot.yml
      - name: Publish integrated implementation
        if: steps.transform.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(ink): integrate Vector Ink 1.0'
          git push origin HEAD:feature/vector-ink-1.0
