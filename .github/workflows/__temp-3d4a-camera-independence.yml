name: Temporary 3D-4A camera independence

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Keep camera lifecycle independent from model quaternion commits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/adapters/solid-3d-three/Solid3DViewport.tsx')
          text = path.read_text()
          ref_marker = '  const onSurfaceHoverRef = useRef(onSurfaceHover);\n'
          if '  const projectionRef = useRef(record.projection);\n' not in text:
              if ref_marker not in text:
                  raise SystemExit('projection ref insertion marker missing')
              text = text.replace(
                  ref_marker,
                  ref_marker + '  const projectionRef = useRef(record.projection);\n',
                  1,
              )
          effect_marker = '''  useEffect(() => {\n    onSurfaceHoverRef.current = onSurfaceHover;\n  }, [onSurfaceHover]);\n\n'''
          if '    projectionRef.current = record.projection;\n' not in text:
              if effect_marker not in text:
                  raise SystemExit('projection ref effect marker missing')
              text = text.replace(
                  effect_marker,
                  effect_marker + '''  useEffect(() => {\n    projectionRef.current = record.projection;\n  }, [record.projection]);\n\n''',
                  1,
              )
          needle = 'solid3DModelQuaternion(record.projection)'
          first = text.find(needle)
          if first < 0:
              raise SystemExit('initial model quaternion marker missing')
          text = text[:first] + 'solid3DModelQuaternion(projectionRef.current)' + text[first + len(needle):]
          old_deps = '}, [cameraMode, record.definition, record.projection, resetToken, retryToken]);'
          new_deps = '}, [cameraMode, record.definition, resetToken, retryToken]);'
          if old_deps not in text:
              raise SystemExit('main viewport dependency marker missing')
          path.write_text(text.replace(old_deps, new_deps, 1))
          PY
      - run: npm run format
      - name: Commit lifecycle fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/solid-3d-three/Solid3DViewport.tsx
          git commit -m "fix(3d): keep camera orbit across body rotation commits"
          git push
