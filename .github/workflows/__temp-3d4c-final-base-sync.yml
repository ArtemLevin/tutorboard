# trigger
name: Temporary 3D-4C finalized base synchronization

on:
  push:
    branches:
      - agent/3d-4c-generalized-sections
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Synchronize finalized 4B foundation
        run: |
          git fetch origin agent/3d-4b-construction-studio
          for path in \
            src/adapters/solid-3d-three/rotation-gizmo.ts \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.css \
            src/app/solid-3d/Solid3DOrientationEditor.test.tsx \
            src/app/solid-3d/Solid3DConstructionEditor.tsx \
            src/app/solid-3d/Solid3DConstructionEditor.css \
            src/app/solid-3d/Solid3DConstructionEditor.test.tsx \
            src/app/solid-3d/Solid3DParameterEditor.tsx \
            src/core/solid-3d/model-transform.ts \
            src/core/solid-3d/construction.ts \
            src/modules/solid-3d/board-projection.ts \
            src/modules/text-shape-placement/catalog.ts \
            src/modules/text-shape-placement/parametric-3d.ts \
            src/modules/text-shape-placement/templates.ts \
            src/modules/text-shape-placement/public.ts \
            tests/unit/adapters/solid-3d-three/rotation-gizmo.test.ts \
            tests/unit/core/solid-3d/model-transform.test.ts \
            tests/unit/core/solid-3d/construction.test.ts \
            tests/unit/core/solid-3d/semantic-solid-persistence.test.ts \
            tests/unit/modules/solid-3d/board-projection-rotation.test.ts \
            tests/unit/modules/text-shape-placement/parametric-3d.test.ts; do
              git show origin/agent/3d-4b-construction-studio:$path > $path
          done
      - name: Reconnect 4C panel to final transform lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/solid-3d/Solid3DEditorPanel.tsx')
          text = path.read_text()
          import_marker = '  solidSectionId,\n'
          if '  withSolid3DModelQuaternion,\n' not in text:
              if import_marker not in text:
                  raise SystemExit('model-transform import marker missing')
              text = text.replace(
                  import_marker,
                  import_marker + '  withSolid3DModelQuaternion,\n',
                  1,
              )
          viewport_marker = '              onElementHover={setHighlightedElement}\n'
          if '              highlightedSurfaceId={hoveredSurfaceId}\n' not in text:
              highlight_marker = '              highlightedElement={highlightedElement}\n'
              if highlight_marker not in text:
                  raise SystemExit('surface highlight marker missing')
              text = text.replace(
                  highlight_marker,
                  highlight_marker + '              highlightedSurfaceId={hoveredSurfaceId}\n',
                  1,
              )
          if '              onModelRotationCommit={' not in text:
              if viewport_marker not in text:
                  raise SystemExit('model rotation viewport marker missing')
              text = text.replace(
                  viewport_marker,
                  viewport_marker + '''              onModelRotationCommit={\n                readOnly\n                  ? undefined\n                  : (rotation) =>\n                      onRecordChange(\n                        withSolid3DModelQuaternion(record, rotation),\n                      )\n              }\n''',
                  1,
              )
          old_guard = '      if (readOnly) return;\n      const point: Solid3DPoint = {'
          if old_guard in text:
              text = text.replace(
                  old_guard,
                  '      if (readOnly || record.points.length >= 32) return;\n      const point: Solid3DPoint = {',
                  1,
              )
          old_button = '            disabled={readOnly}\n            onClick={() => setMode("points")}'
          if old_button in text:
              text = text.replace(
                  old_button,
                  '            disabled={readOnly || record.points.length >= 32}\n            onClick={() => setMode("points")}',
                  1,
              )
          path.write_text(text)
          PY
      - run: npm run format
      - name: Commit synchronized foundation
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "fix(3d): synchronize finalized 3D-4B foundation into 3D-4C"
          fi
      - name: Attach finalized 4B history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git merge-base --is-ancestor origin/agent/3d-4b-construction-studio HEAD; then
            git merge -s ours origin/agent/3d-4b-construction-studio --no-edit -m "Merge finalized 3D-4B base into 3D-4C"
          fi
          git push
