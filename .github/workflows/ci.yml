name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply direct interaction patch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/direct-select-right-pan' && hashFiles('scripts/apply-direct-interactions.py') != ''
        run: |
          python scripts/apply-direct-interactions.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml .github/workflows/smart-ink-release-gate.yml
          rm -f .github/workflows/direct-select-right-pan-helper.yml scripts/apply-direct-interactions.py
          npm run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/canvas-konva/BoardStage.tsx \
            src/adapters/canvas-konva/default-renderers.tsx \
            src/app/App.tsx \
            tests/e2e/selection.spec.ts \
            docs/architecture/OBJECT_TRANSFORMS.md \
            .github/workflows/ci.yml \
            .github/workflows/smart-ink-release-gate.yml \
            .github/workflows/direct-select-right-pan-helper.yml \
            scripts/apply-direct-interactions.py
          git commit -m "feat: add direct selection and right-button canvas pan"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install locked GeometryOS code-generation toolchain
        run: npm ci --prefix tools/geometryos-contract

      - name: Verify pinned GeometryOS contract
        run: npm run geometryos:check

      - name: Verify board contract
        run: npm run board-contract:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Audit production dependency threshold
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee unit-tests.log

      - name: Enforce performance budgets
        run: npm run performance

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.sha }}
          path: unit-tests.log
          if-no-files-found: warn
          retention-days: 2

      - name: Enforce source boundaries
        run: npm run architecture

      - name: Build production bundle
        run: npm run build

  geometryos-live-contract:
    name: GeometryOS live browser contract
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out TutorBoard
        uses: actions/checkout@v7

      - name: Check out pinned GeometryOS source
        uses: actions/checkout@v7
        with:
          repository: ArtemLevin/geometryos
          ref: 84ae403ef06f5183091f8862307f3c458f464b87
          path: geometryos-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build pinned GeometryOS image
        run: |
          docker build \
            --tag geometryos-contract-smoke:${GITHUB_SHA} \
            --build-arg BUILD_REVISION=84ae403ef06f5183091f8862307f3c458f464b87 \
            --build-arg BUILD_VERSION=0.3.0 \
            geometryos-source

      - name: Start hardened GeometryOS container
        run: |
          docker run --detach \
            --name tutorboard-geometryos-contract \
            --publish 127.0.0.1:18000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env GEOMETRYOS_CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            geometryos-contract-smoke:${GITHUB_SHA}

      - name: Verify live protocol contract
        env:
          GEOMETRYOS_ALLOWED_ORIGIN: http://localhost:5173
          GEOMETRYOS_BASE_URL: http://127.0.0.1:18000
        run: |
          set -o pipefail
          npm run geometryos:live-smoke 2>&1 | tee geometryos-live-protocol.log

      - name: Verify live browser contract
        env:
          GEOMETRYOS_BASE_URL: http://127.0.0.1:18000
        run: |
          set -o pipefail
          npm run geometryos:live-browser 2>&1 | tee geometryos-live-browser.log

      - name: Upload live-contract failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geometryos-live-contract-failure-${{ github.sha }}
          path: |
            geometryos-live-protocol.log
            geometryos-live-browser.log
          if-no-files-found: warn
          retention-days: 7

      - name: Capture container diagnostics
        if: always()
        run: |
          docker logs tutorboard-geometryos-contract || true
          docker rm --force tutorboard-geometryos-contract || true

  e2e-smoke:
    name: Browser smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build production bundle
        env:
          VITE_FEATURE_SERVER_SYNC: "true"
          VITE_GEOMETRYOS_BASE_URL: http://127.0.0.1:4173/geometryos
        run: npm run build

      - name: Run browser smoke
        run: npm run e2e

  production-image:
    name: Production image
    needs: [quality, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build immutable TutorBoard image
        run: |
          docker build \
            --build-arg BUILD_REVISION=${GITHUB_SHA} \
            --build-arg BUILD_VERSION=0.1.0 \
            --tag tutorboard:${GITHUB_SHA} \
            .

      - name: Assert non-root read-only runtime
        run: |
          test "$(docker inspect --format '{{.Config.User}}' tutorboard:${GITHUB_SHA})" = "101"
          docker run --detach \
            --name tutorboard-release \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:18080:8080 \
            tutorboard:${GITHUB_SHA}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs tutorboard-release
          exit 1

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tutorboard:${{ github.sha }}
          format: sarif
          output: trivy-tutorboard.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-tutorboard.sarif

      - name: Capture container diagnostics
        if: always()
        run: |
          docker logs tutorboard-release || true
          docker rm --force tutorboard-release || true
