name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    name: Normalize coordinate plot release files
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-production-gate
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply repository Prettier
        run: |
          npx prettier --write \
            tests/e2e/coordinate-plot-production.spec.ts \
            tests/fixtures/coordinate-plot-production.ts \
            tests/integration/coordinate-plot-persistence.test.ts

      - name: Push formatted product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/coordinate-plot-production.spec.ts \
            tests/fixtures/coordinate-plot-production.ts \
            tests/integration/coordinate-plot-persistence.test.ts
          git commit -m "style: normalize coordinate plot production files"
          git push origin HEAD:feature/coordinate-plot-production-gate
