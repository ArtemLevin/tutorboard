name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-selection-callback-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-selection-callback-fix:
    name: Apply selection callback fix
    if: github.head_ref == 'feature/minimal-board-chrome'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/minimal-board-chrome
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply pointer lifecycle fix
        run: python scripts/apply-selection-callback-layout-fix.py

      - name: Format product changes
        run: npx prettier --write src/adapters/canvas-konva/BoardStage.tsx tests/e2e/selection.spec.ts

      - name: Restore release workflow and remove temporary files
        run: |
          git show fe910f36c3f018c37dd0a13d4dbe80c677f32296:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-selection-callback-layout-fix.yml
          rm -f .agent/apply-selection-callback-layout-fix.trigger
          rm -f scripts/apply-selection-callback-layout-fix.py

      - name: Verify product diff
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Commit clean product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            .github/workflows/apply-selection-callback-layout-fix.yml \
            .agent/apply-selection-callback-layout-fix.trigger \
            scripts/apply-selection-callback-layout-fix.py \
            src/adapters/canvas-konva/BoardStage.tsx \
            tests/e2e/selection.spec.ts
          git commit -m "fix: synchronize canvas pointer lifecycle before input"
          git push origin HEAD:feature/minimal-board-chrome
