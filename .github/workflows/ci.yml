name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: pr5-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Integrate PR5 editor
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out editor branch
        uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-editor
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply prepared integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/pr5-bootstrap.yml")
          source = workflow.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in source or end_marker not in source:
              raise SystemExit("Unable to locate embedded PR5 integration script")
          block = textwrap.dedent(
              source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          )
          helper_start = block.index("def replace_once")
          helper_end = block.index("# Renderer registry wiring.")
          helper = '''def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source_lines = file.read_text(encoding="utf-8").splitlines()
              old_lines = old.splitlines()
              old_signature = [line.strip() for line in old_lines]

              def exact(candidate: list[str]) -> bool:
                  return [line.strip() for line in candidate] == old_signature

              def prefix(candidate: list[str]) -> bool:
                  for actual, expected in zip(candidate, old_signature):
                      actual = actual.strip()
                      if expected == "":
                          if actual != "":
                              return False
                      elif not actual.startswith(expected):
                          return False
                  return True

              exact_matches = []
              prefix_matches = []
              for index in range(0, len(source_lines) - len(old_lines) + 1):
                  candidate = source_lines[index:index + len(old_lines)]
                  if exact(candidate):
                      exact_matches.append(index)
                  elif prefix(candidate):
                      prefix_matches.append(index)
              matches = exact_matches if exact_matches else prefix_matches
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected one structural match in {path}, found {len(matches)}: {old_signature[:3]!r}"
                  )
              start = matches[0]
              replacement = [line.strip() for line in new.splitlines()]
              actual_last = source_lines[start + len(old_lines) - 1].strip()
              expected_last = old_signature[-1]
              if actual_last.startswith(expected_last):
                  suffix = actual_last[len(expected_last):]
                  if suffix and replacement:
                      replacement[-1] += suffix
              source_lines[start:start + len(old_lines)] = replacement
              file.write_text("\\n".join(source_lines) + "\\n", encoding="utf-8")

          '''
          block = block[:helper_start] + textwrap.dedent(helper) + block[helper_end:]
          exec(compile(block, "pr5-bootstrap", "exec"))
          PY

      - name: Apply repository formatting
        run: |
          npx prettier --write \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/adapters/canvas-konva/coordinate-plot-editing.ts \
            src/adapters/canvas-konva/coordinate-plot-renderer.tsx \
            src/adapters/canvas-konva/default-renderers.tsx \
            src/adapters/canvas-konva/public.ts \
            src/adapters/canvas-konva/renderer-registry.tsx \
            src/app/App.tsx \
            src/app/CoordinatePlotEditorPanel.tsx \
            src/app/CoordinatePlotEditorPanel.css \
            src/modules/coordinate-plot-editor/model.ts \
            src/modules/coordinate-plot-editor/public.ts \
            tests/unit/adapters/canvas-konva/coordinate-plot-editing.test.ts \
            tests/unit/modules/coordinate-plot-editor/model.test.ts

      - name: Restore production workflow and push integrated head
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/pr5-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate coordinate plot editor workflow"
          git push origin HEAD:feature/coordinate-plot-editor
