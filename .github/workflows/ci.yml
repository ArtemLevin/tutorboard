name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    name: Format PR5 release tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-editor
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: |
          npx prettier --write \
            src/app/CoordinatePlotEditorPanel.test.tsx \
            src/app/CoordinatePlotEditorWorkflow.test.tsx \
            tests/e2e/coordinate-plot-editor.spec.ts \
            tests/unit/adapters/canvas-konva/coordinate-plot-editing.test.ts
      - name: Restore production workflow and push
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format coordinate plot editor tests"
          git push origin HEAD:feature/coordinate-plot-editor
