name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked GeometryOS code-generation toolchain
        run: npm ci --prefix tools/geometryos-contract

      - name: Verify pinned GeometryOS contract
        run: npm run geometryos:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee unit-tests.log

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.sha }}
          path: unit-tests.log
          if-no-files-found: error
          retention-days: 2

      - name: Enforce source boundaries
        run: npm run architecture

      - name: Build production bundle
        run: npm run build

  geometryos-live-contract:
    name: GeometryOS live browser contract
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out TutorBoard
        uses: actions/checkout@v7

      - name: Check out pinned GeometryOS source
        uses: actions/checkout@v7
        with:
          repository: ArtemLevin/geometryos
          ref: 49e98394d0c9cdeaf7fdaf45b712dbee3a04a74c
          path: geometryos-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build pinned GeometryOS image
        run: |
          docker build \
            --tag geometryos-contract-smoke:${GITHUB_SHA} \
            --build-arg BUILD_REVISION=49e98394d0c9cdeaf7fdaf45b712dbee3a04a74c \
            --build-arg BUILD_VERSION=0.2.0 \
            geometryos-source

      - name: Start hardened GeometryOS container
        run: |
          docker run --detach \
            --name tutorboard-geometryos-contract \
            --publish 127.0.0.1:18000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env GEOMETRYOS_CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            geometryos-contract-smoke:${GITHUB_SHA}

      - name: Verify live protocol contract
        env:
          GEOMETRYOS_ALLOWED_ORIGIN: http://localhost:5173
          GEOMETRYOS_BASE_URL: http://127.0.0.1:18000
        run: |
          set -o pipefail
          npm run geometryos:live-smoke 2>&1 | tee geometryos-live-protocol.log

      - name: Verify live browser contract
        env:
          GEOMETRYOS_BASE_URL: http://127.0.0.1:18000
        run: |
          set -o pipefail
          npm run geometryos:live-browser 2>&1 | tee geometryos-live-browser.log

      - name: Upload live-contract failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geometryos-live-contract-failure-${{ github.sha }}
          path: |
            geometryos-live-protocol.log
            geometryos-live-browser.log
          if-no-files-found: warn
          retention-days: 7

      - name: Capture container diagnostics
        if: always()
        run: |
          docker logs tutorboard-geometryos-contract || true
          docker rm --force tutorboard-geometryos-contract || true

  e2e-smoke:
    name: Browser smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run browser smoke
        run: npm run e2e
