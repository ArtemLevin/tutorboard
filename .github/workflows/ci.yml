name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    name: Repair PR5 lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-editor
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply ESLint fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/app/CoordinatePlotEditorPanel.tsx")
          source = path.read_text(encoding="utf-8")
          source = source.replace("  type PlotParameterId,\n", "", 1)
          path.write_text(source, encoding="utf-8")
          PY
          npx eslint src/app/CoordinatePlotEditorPanel.tsx --fix
          npx prettier --write src/app/CoordinatePlotEditorPanel.tsx
      - name: Restore production workflow and push
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy coordinate plot editor lint"
          git push origin HEAD:feature/coordinate-plot-editor
