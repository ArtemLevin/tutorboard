name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-image-import:
    name: Apply embedded image import
    if: github.event.pull_request.head.ref == 'feature-embedded-image-import'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out product branch
        uses: actions/checkout@v7
        with:
          ref: feature-embedded-image-import
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply prepared product patch
        shell: bash
        run: |
          python .github/image-patch-runner.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          npm run board-contract:generate
          npm run format
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: import embedded images from files and clipboard"
          git push origin HEAD:feature-embedded-image-import
