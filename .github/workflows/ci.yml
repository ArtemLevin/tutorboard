name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    name: Repair collaborative undo expectation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-production-gate
          fetch-depth: 0
      - name: Apply exact expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/integration/coordinate-plot-sync.test.ts")
          source = path.read_text(encoding="utf-8")
          old = "    expect(converged.document).toEqual(afterAdd);"
          new = '''    expect(converged.document).toEqual({
                ...afterAdd,
                updatedAt: "2026-08-01T08:12:00.000Z",
              });'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected one match, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          npx prettier --write tests/integration/coordinate-plot-sync.test.ts
      - name: Push product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/coordinate-plot-sync.test.ts
          git commit -m "test: account for collaborative undo timestamp"
          git push origin HEAD:feature/coordinate-plot-production-gate
