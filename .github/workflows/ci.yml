name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-image-import:
    name: Apply embedded image import
    if: github.event.pull_request.head.ref == 'feature-embedded-image-import'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out product branch
        uses: actions/checkout@v7
        with:
          ref: feature-embedded-image-import
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply prepared product patch
        shell: bash
        run: |
          python <<'BOOT'
          from pathlib import Path

          source = Path('.github/workflows/apply-image-import.yml').read_text(encoding='utf-8')
          body = source.split("          python <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          strict_helper = '''from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")
'''
          flexible_helper = '''from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  target.write_text(text.replace(old, new), encoding="utf-8")
                  return
              pattern = "".join(
                  r"\\s+" if token.isspace() else re.escape(token)
                  for token in re.split(r"(\\s+)", old)
              )
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise SystemExit(
                      f"missing or ambiguous patch anchor in {path}: {old[:100]!r}; matches={len(matches)}"
                  )
              match = matches[0]
              target.write_text(
                  text[:match.start()] + new + text[match.end():],
                  encoding="utf-8",
              )
'''
          if strict_helper not in script:
              raise SystemExit('patch helper definition was not found')
          script = script.replace(strict_helper, flexible_helper)
          exec(compile(script, 'embedded-image-patch.py', 'exec'))
          Path('.github/workflows/trigger-image-import-patch.yml').unlink(missing_ok=True)
          BOOT
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          npm run board-contract:generate
          npm run format
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: import embedded images from files and clipboard"
          git push origin HEAD:feature-embedded-image-import
