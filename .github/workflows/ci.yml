name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-selection-tool-id-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-selection-tool-id-fix:
    name: Apply selection tool identifier fix
    if: github.head_ref == 'feature/minimal-board-chrome'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/minimal-board-chrome
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Align dock selection identifiers
        run: python scripts/apply-native-background-selection-listener.py

      - name: Format product changes
        run: npx prettier --write src/app/board-chrome/BoardToolDock.tsx tests/e2e/selection.spec.ts

      - name: Verify product changes
        run: |
          npx prettier --check src/app/board-chrome/BoardToolDock.tsx tests/e2e/selection.spec.ts
          npm run lint
          npm run typecheck

      - name: Install target browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build production bundle
        env:
          VITE_FEATURE_SERVER_SYNC: "true"
          VITE_GEOMETRYOS_BASE_URL: http://127.0.0.1:4173/geometryos
        run: npm run build

      - name: Run selection contract in Chromium
        run: npm run e2e -- tests/e2e/selection.spec.ts --project=chromium

      - name: Run selection contract in Firefox
        run: npm run e2e -- tests/e2e/selection.spec.ts --project=firefox

      - name: Commit product fix
        run: |
          if git diff --quiet -- src/app/board-chrome/BoardToolDock.tsx tests/e2e/selection.spec.ts; then
            echo "Product fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/board-chrome/BoardToolDock.tsx tests/e2e/selection.spec.ts
          git commit -m "fix: align board selection tool identifiers"
          git push origin HEAD:feature/minimal-board-chrome
