name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-selection-routing-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-selection-routing-fix:
    name: Apply selection routing fix
    if: github.head_ref == 'feature/minimal-board-chrome'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/minimal-board-chrome
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply selection routing priority fix
        run: python scripts/apply-selection-routing-priority-fix.py

      - name: Format product change
        run: npx prettier --write src/adapters/canvas-konva/BoardStage.tsx

      - name: Verify product change
        run: |
          npx prettier --check src/adapters/canvas-konva/BoardStage.tsx
          npm run lint
          npm run typecheck

      - name: Commit product fix
        run: |
          if git diff --quiet -- src/adapters/canvas-konva/BoardStage.tsx; then
            echo "Product fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/canvas-konva/BoardStage.tsx
          git commit -m "fix: prioritize explicit selection over hand pan"
          git push origin HEAD:feature/minimal-board-chrome
