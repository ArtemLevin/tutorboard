name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Integrate coordinate plot production gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-production-gate
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integrate durability and release workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(
                      f"Expected one match in {path}, found {source.count(old)}: {old[:100]!r}"
                  )
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/app/PersistedApp.tsx",
              '''import {
            importLocalDocumentJson,
            LocalDocumentAutosave,
            type LocalAutosaveState,
          } from "../modules/local-persistence/public";''',
              '''import {
            bindLocalAutosaveLifecycleFlush,
            importLocalDocumentJson,
            LocalDocumentAutosave,
            type LocalAutosaveState,
          } from "../modules/local-persistence/public";''',
          )
          replace_once(
              "src/app/PersistedApp.tsx",
              '''  useEffect(() => {
            const autosave = autosaveRef.current;
            return () => autosave?.dispose();
          }, []);''',
              '''  useEffect(() => {
            const autosave = autosaveRef.current;
            if (autosave === null) return undefined;
            const unbindLifecycleFlush = bindLocalAutosaveLifecycleFlush(
              autosave,
              {
                documentTarget: document,
                windowTarget: window,
              },
            );
            return () => {
              unbindLifecycleFlush();
              void autosave.flush().finally(() => autosave.dispose());
            };
          }, []);''',
          )

          plan = Path("PLOT_PLAN.txt")
          plan_source = plan.read_text(encoding="utf-8")
          status = '''

16. Статус реализации

PR 1 — доменная модель: завершён.
PR 2 — язык выражений: завершён.
PR 3 — численный построитель: завершён.
PR 4 — Konva renderer: завершён.
PR 5 — пользовательский интерфейс: завершён.
PR 6 — production gate: реализуется в PR #60.

Production gate фиксирует Chromium и Firefox, performance budgets, IndexedDB round-trip и recovery, offline/online synchronization, collaborative inverse, production image и эксплуатационную документацию.
'''
          if "16. Статус реализации" not in plan_source:
              plan.write_text(plan_source.rstrip() + status + "\n", encoding="utf-8")

          ci = subprocess.check_output(
              ["git", "show", "origin/main:.github/workflows/ci.yml"],
              text=True,
          )
          marker = '''  production-image:
            name: Production image
            needs: [quality, e2e-smoke]'''
          replacement = '''  coordinate-plot-production:
            name: Coordinate plot production gate
            needs: quality
            runs-on: ubuntu-latest
            timeout-minutes: 20

            steps:
              - name: Check out repository
                uses: actions/checkout@v7

              - name: Set up Node.js
                uses: actions/setup-node@v6
                with:
                  node-version-file: .nvmrc
                  cache: npm

              - name: Install locked dependencies
                run: npm ci

              - name: Run coordinate plot integration and performance gate
                run: |
                  set -o pipefail
                  npm run plot:production 2>&1 | tee coordinate-plot-production.log

              - name: Install release browsers
                run: npx playwright install --with-deps chromium firefox

              - name: Build production bundle
                run: npm run build

              - name: Run Chromium and Firefox coordinate plot lifecycle
                run: |
                  set -o pipefail
                  npm run e2e:plot-production 2>&1 | tee coordinate-plot-browser.log

              - name: Upload coordinate plot failure evidence
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                  name: coordinate-plot-production-failure-${{ github.sha }}
                  path: |
                    coordinate-plot-production.log
                    coordinate-plot-browser.log
                    test-results
                  if-no-files-found: warn
                  retention-days: 7

          production-image:
            name: Production image
            needs: [quality, e2e-smoke, coordinate-plot-production]'''
          if marker not in ci:
              raise SystemExit("Unable to locate production image marker in CI")
          Path(".github/workflows/ci.yml").write_text(
              ci.replace(marker, replacement, 1),
              encoding="utf-8",
          )
          PY
      - name: Apply repository formatting
        run: |
          npx prettier --write \
            .github/workflows/ci.yml \
            PLOT_PLAN.txt \
            package.json \
            src/app/PersistedApp.tsx \
            src/modules/local-persistence/lifecycle.ts \
            src/modules/local-persistence/public.ts \
            tests/fixtures/coordinate-plot-production.ts \
            tests/integration/coordinate-plot-persistence.test.ts \
            tests/integration/coordinate-plot-sync.test.ts \
            tests/performance/coordinate-plot-production.test.ts \
            tests/unit/modules/local-persistence/lifecycle.test.ts \
            tests/e2e/coordinate-plot-production.spec.ts
      - name: Verify strict TypeScript and targeted gate
        run: |
          npm run typecheck
          npm run plot:production
      - name: Commit integrated production gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: integrate coordinate plot production gate"
          git push origin HEAD:feature/coordinate-plot-production-gate
