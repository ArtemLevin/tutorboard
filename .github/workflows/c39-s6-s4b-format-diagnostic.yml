name: C3.9-S6.4B formatting diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/c39-s6-s4b-format-diagnostic.yml"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier changes
        run: |
          npx prettier --write src/adapters/board-document-worker/client.ts tests/unit/adapters/board-document-worker/serialization-cache.test.ts
          echo BEGIN_S64B_FORMAT_DIFF
          git diff -- src/adapters/board-document-worker/client.ts tests/unit/adapters/board-document-worker/serialization-cache.test.ts
          echo END_S64B_FORMAT_DIFF
