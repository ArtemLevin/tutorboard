name: C3.9-S3 one-time branch formatter

on:
  pull_request:
    paths:
      - .github/workflows/c39-s3-format-once.yml

permissions:
  contents: write

jobs:
  format-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/c39-s3-stable-scene-ab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Format changed files on the dedicated branch
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write \
            src/core/board/selectors.ts \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/adapters/canvas-konva/board-frame-trace.ts \
            tests/unit/core/scene-selector.test.ts \
            tests/unit/adapters/canvas-konva/c39-frame-phases.test.ts \
            tests/e2e/c39-frame-attribution.ts \
            tests/e2e/c39-large-board-profile.spec.ts \
            .github/workflows/c39-static-heavy.yml \
            .github/workflows/c39-representative-baseline.yml
          git diff --check
          git add src/core/board/selectors.ts src/adapters/canvas-konva/BoardStage.tsx src/adapters/canvas-konva/board-frame-trace.ts tests/unit/core/scene-selector.test.ts tests/unit/adapters/canvas-konva/c39-frame-phases.test.ts tests/e2e/c39-frame-attribution.ts tests/e2e/c39-large-board-profile.spec.ts .github/workflows/c39-static-heavy.yml .github/workflows/c39-representative-baseline.yml
          if ! git diff --cached --quiet; then
            git -c user.name='TutorBoard CI Formatter' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: apply project Prettier to C3.9-S3 candidate'
            git push origin 'HEAD:refs/heads/perf/c39-s3-stable-scene-ab'
          fi
