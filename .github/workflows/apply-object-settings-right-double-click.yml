name: Apply object settings interaction patch

on:
  push:
    branches:
      - feature/object-settings-right-double-click

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/object-settings-right-double-click
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply interaction changes
        run: node scripts/apply-object-settings-right-double-click.mjs

      - name: Format changed sources
        run: npx prettier --write src/app/App.tsx src/app/App.test.tsx src/adapters/canvas-konva/BoardStage.tsx docs/adr/ADR-022-object-settings-right-double-click.md

      - name: Verify TypeScript and focused tests
        run: |
          npm run typecheck
          npx vitest run src/app/App.test.tsx
          npm run lint

      - name: Commit product-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/App.test.tsx src/adapters/canvas-konva/BoardStage.tsx docs/adr/ADR-022-object-settings-right-double-click.md
          git rm .github/workflows/apply-object-settings-right-double-click.yml scripts/apply-object-settings-right-double-click.mjs
          git commit -m "feat: open object settings on right double-click"
          git push origin HEAD:feature/object-settings-right-double-click
