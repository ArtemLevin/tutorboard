name: Format PR5 release composition

on:
  push:
    branches:
      - feat/configurable-formula-recognition

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/configurable-formula-recognition
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/apply-pr5-release-format.mjs
      - run: npm run format
      - run: rm scripts/apply-pr5-release-format.mjs .github/workflows/pr5-release-format.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "chore: format configurable formula recognition"
          git push origin HEAD:feat/configurable-formula-recognition
