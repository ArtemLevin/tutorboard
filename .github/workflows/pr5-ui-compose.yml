name: Apply PR5 UI composition

on:
  push:
    branches:
      - feat/configurable-formula-recognition

permissions:
  contents: write

jobs:
  compose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/configurable-formula-recognition
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/apply-pr5-ui-composition.mjs
      - run: npx prettier --write src/app/ProductShell.tsx src/app/ProductShell.test.tsx src/app/bootstrap/main.tsx src/app/configuration/environment.ts src/app/FormulaRecognitionSettingsPanel.tsx src/app/FormulaRecognitionSettingsPanel.css src/app/configuration/formula-recognition-settings.ts src/app/configuration/formula-recognition-settings.test.ts src/adapters/math-ink-http/client.ts src/adapters/math-ink-http/rasterization.ts src/adapters/math-ink-http/rasterization.test.ts src/modules/handwritten-function/types.ts src/modules/handwritten-function/public.ts
      - run: rm scripts/apply-pr5-ui-composition.mjs .github/workflows/pr5-ui-compose.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat: compose configurable formula recognition UI"
          git push origin HEAD:feat/configurable-formula-recognition
