name: QoL 2.5 format once

on:
  push:
    branches:
      - feat/qol-2-5-stylus-profiles
    paths:
      - .github/workflows/qol-2-5-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed QoL 2.5 sources and remove workflow
        run: |
          npx prettier --write \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/app/App.tsx \
            src/app/board-chrome/BoardToolDock.tsx \
            src/app/board-chrome/quick-tool-preferences.test.ts \
            src/app/board-chrome/quick-tool-preferences.ts \
            src/app/board/controllers/useBoardInteractionRouter.ts \
            src/app/board/views/BoardCanvas.tsx \
            src/app/board/views/BoardToolDockContainer.tsx \
            src/shared/stylus-eraser.test.ts \
            src/shared/stylus-eraser.ts \
            tests/e2e/qol-stylus-eraser.spec.ts
          git rm .github/workflows/qol-2-5-format-once.yml
          git add -- src/adapters/canvas-konva/BoardStage.tsx src/app/App.tsx src/app/board-chrome/BoardToolDock.tsx src/app/board-chrome/quick-tool-preferences.test.ts src/app/board-chrome/quick-tool-preferences.ts src/app/board/controllers/useBoardInteractionRouter.ts src/app/board/views/BoardCanvas.tsx src/app/board/views/BoardToolDockContainer.tsx src/shared/stylus-eraser.test.ts src/shared/stylus-eraser.ts tests/e2e/qol-stylus-eraser.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(qol): format stylus and pen profile changes'
          git push origin HEAD:feat/qol-2-5-stylus-profiles
