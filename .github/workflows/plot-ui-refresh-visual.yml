name: Temporary plot editor visual refresh
on:
  pull_request:
    paths:
      - '.github/workflows/plot-ui-refresh-visual.yml'
      - 'src/app/CoordinatePlotEditorPanel.css'
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/plot-editor-ux-redesign-20261115
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - name: Rebuild editor visual baselines
        run: npm run e2e:plot-visual:update
      - name: Commit baseline images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/coordinate-plot-visual.spec.ts-snapshots
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "test(plot-ui): refresh responsive graph editor visual baselines"
            git push origin HEAD:feat/plot-editor-ux-redesign-20261115
          fi
