name: C3 formatting probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/media-performance.spec.ts tests/fixtures/media-performance.ts tests/node/ci-gate-routing.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: c3-formatted-files
          path: |
            tests/e2e/media-performance.spec.ts
            tests/fixtures/media-performance.ts
            tests/node/ci-gate-routing.test.mjs
          retention-days: 1
