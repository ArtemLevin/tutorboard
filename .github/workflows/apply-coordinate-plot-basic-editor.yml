name: Apply coordinate plot basic editor

on:
  push:
    branches:
      - feature/coordinate-plot-basic-editor

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: contains(github.event.head_commit.message, 'run coordinate plot basic editor patch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/coordinate-plot-basic-editor
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install visual browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build production bundle
        run: npm run build

      - name: Update and verify visual matrix snapshots
        run: npx playwright test --config playwright.visual.config.ts --update-snapshots --reporter=list

      - name: Commit verified visual snapshots
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/coordinate-plot-visual.spec.ts-snapshots
          git diff --cached --check
          git commit -m "test: update compact coordinate plot editor snapshots"
          git push origin HEAD:feature/coordinate-plot-basic-editor
