name: C39 temporary D formatting
on:
  push:
    branches:
      - perf/c3-9-d-viewport-validation-fastpath
permissions:
  contents: read
jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format source and tests and export exact files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/core/board/commands/reducer.ts tests/performance/c39-viewport-command-cost.test.ts tests/unit/core/c39-viewport-fast-path.test.ts
          for f in src/core/board/commands/reducer.ts tests/performance/c39-viewport-command-cost.test.ts tests/unit/core/c39-viewport-fast-path.test.ts; do
            printf 'C39DFMT:%s:' "$f"
            base64 --wrap=0 "$f"
            printf '\n'
          done
      - name: Typecheck
        run: npm run typecheck
      - name: Fast-path correctness tests
        run: npx vitest run tests/unit/core/c39-viewport-fast-path.test.ts
      - name: Performance paired benchmark
        run: npx vitest run tests/performance/c39-viewport-command-cost.test.ts
