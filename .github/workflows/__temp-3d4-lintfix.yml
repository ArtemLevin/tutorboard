name: Temporary 3D-4A hook lifecycle fix

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix viewport hook dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/adapters/solid-3d-three/Solid3DViewport.tsx')
          text = path.read_text()
          text = text.replace('solid3DModelQuaternion(record);', 'solid3DModelQuaternion(record.projection);')
          text = text.replace(
              '}, [cameraMode, record.definition, resetToken, retryToken]);',
              '}, [cameraMode, record.definition, record.projection, resetToken, retryToken]);',
          )
          text = text.replace('}, [record.projection.matrix]);', '}, [record.projection]);')
          path.write_text(text)
          PY
      - run: npx prettier --write src/adapters/solid-3d-three/Solid3DViewport.tsx
      - name: Commit lifecycle fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/solid-3d-three/Solid3DViewport.tsx
          git commit -m "fix(3d): stabilize viewport hook dependencies"
          git push
