name: Handwritten function PR 2 fixer

on:
  push:
    branches:
      - feat/handwritten-function-interpretation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-pr2-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/handwritten-function-interpretation
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply lint and regression fixes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const conversionPath = "src/modules/handwritten-function/expression-conversion.ts";
          const conversion = fs.readFileSync(conversionPath, "utf8");
          const conversionNext = conversion.replace(
            '.replace(/[\\[\\]]/gu, (character) => (character === "[" ? "(" : ")"))',
            '.replaceAll("[", "(").replaceAll("]", ")")',
          );
          if (conversionNext === conversion) {
            throw new Error("Expected bracket normalization was not found.");
          }
          fs.writeFileSync(conversionPath, conversionNext);

          const testPath = "tests/unit/modules/handwritten-function/interpretation.test.ts";
          const test = fs.readFileSync(testPath, "utf8");
          let testNext = test.replace(
            '        { expression: "sin*x", format: "plot-expression" },\n',
            '        { expression: "sin*x", format: "plot-expression" },\n        { expression: "foo(x)", format: "plot-expression" },\n',
          );
          testNext = testNext.replace(
            '        "expression.invalid-function-arity",\n        "handwriting.interpretation.no-valid-candidate",',
            '        "expression.invalid-function-arity",\n        "handwriting.interpretation.unsupported-function",\n        "handwriting.interpretation.no-valid-candidate",',
          );
          if (testNext === test) {
            throw new Error("Expected interpretation test insertion was not applied.");
          }
          fs.writeFileSync(testPath, testNext);
          NODE
      - name: Format changed files
        run: npx prettier --write src/modules/handwritten-function tests/unit/modules/handwritten-function
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/handwritten-function tests/unit/modules/handwritten-function
          git commit -m "fix: harden handwritten interpretation [skip-pr2-fix]"
          git push origin HEAD:feat/handwritten-function-interpretation
