name: QoL 2.3 one-time formatter

on:
  push:
    branches:
      - feat/qol-2-3-lesson-mode
    paths:
      - .github/workflows/qol-2-3-one-time-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write src/app/App.tsx src/app/App.test.tsx src/app/board/views/BoardLessonModeControls.tsx
      - run: |
          rm .github/workflows/qol-2-3-one-time-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(qol): format focus and selection regressions"
            git push
          fi
