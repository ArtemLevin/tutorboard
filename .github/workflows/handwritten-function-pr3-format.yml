name: Handwritten function PR 3 formatter

on:
  push:
    branches:
      - feat/handwritten-function-workflow

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-pr3-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/handwritten-function-workflow
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format PR 3 tests
        run: |
          npx prettier --write \
            src/app/HandwrittenFunctionWorkflow.test.tsx \
            tests/e2e/handwritten-function-production.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/HandwrittenFunctionWorkflow.test.tsx \
            tests/e2e/handwritten-function-production.spec.ts
          git commit -m "style: format handwritten function PR 3 tests [skip-pr3-format]"
          git push origin HEAD:feat/handwritten-function-workflow
