name: Temporary E2 split Prettier export

on:
  pull_request:
    paths:
      - .github/workflows/c39-e2-split-formatter.yml

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exact source formatting
        run: |
          set -euo pipefail
          for path in \
            tests/fixtures/dense-board.ts \
            tests/e2e/c39-large-board-profile.spec.ts \
            tests/unit/c39-e2-visible-split.test.ts; do
            npx prettier --write "$path"
            printf 'E2FIXFMT:%s:' "$path"
            base64 -w0 "$path"
            printf '\n'
          done
