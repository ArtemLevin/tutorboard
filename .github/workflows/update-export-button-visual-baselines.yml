name: Update export button visual baselines

on:
  push:
    branches:
      - agent/add-export-button

permissions:
  contents: write

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-export-button
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install desktop visual-test browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build production bundle
        run: npm run build

      - name: Refresh desktop coordinate-plot visual snapshots
        run: >-
          npx playwright test
          --config playwright.visual.config.ts
          --project=visual-chromium-desktop
          --project=visual-firefox-desktop
          --update-snapshots

      - name: Verify snapshot-only delta
        shell: bash
        run: |
          rm .github/workflows/update-export-button-visual-baselines.yml
          python - <<'PY'
          import subprocess

          helper = ".github/workflows/update-export-button-visual-baselines.yml"
          prefix = "tests/e2e/coordinate-plot-visual.spec.ts-snapshots/"
          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          changed = {line[3:] for line in lines if len(line) >= 4}
          snapshots = {path for path in changed if path.startswith(prefix) and path.endswith("-desktop-linux.png")}
          unexpected = changed - snapshots - {helper}
          if unexpected:
              raise SystemExit(f"Unexpected visual changes: {sorted(unexpected)}")
          if not snapshots:
              raise SystemExit("No desktop visual baselines were updated")
          print("Verified desktop visual delta:", sorted(snapshots))
          PY

      - name: Commit visual baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/coordinate-plot-visual.spec.ts-snapshots/*-desktop-linux.png
          git add .github/workflows/update-export-button-visual-baselines.yml
          git commit -m "test: update export toolbar visual baselines"
          git push origin HEAD:agent/add-export-button
