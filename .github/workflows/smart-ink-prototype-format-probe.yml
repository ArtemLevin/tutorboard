name: Temporary glyph prototype CLI test formatting

on:
  pull_request:
    paths:
      - 'tests/node/smart-ink-glyph-prototype-cli.test.mjs'
      - '.github/workflows/smart-ink-prototype-format-probe.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write tests/node/smart-ink-glyph-prototype-cli.test.mjs
          git diff -- tests/node/smart-ink-glyph-prototype-cli.test.mjs
