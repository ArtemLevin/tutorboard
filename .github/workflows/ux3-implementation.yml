name: UX3 implementation

on:
  pull_request:
    paths:
      - .github/workflows/ux3-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/coordinate-plot-ux-canvas-mobile
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Implement canvas navigation, mobile UX and visual matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:90]!r}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          Path("src/app/CoordinatePlotNavigationControls.tsx").write_text(r'''import type { ReactElement } from "react";

import type { CoordinatePlotZoomAxis } from "../adapters/canvas-konva/public";
import "./CoordinatePlotNavigationControls.css";

const axisOptions: readonly {
  readonly axis: CoordinatePlotZoomAxis;
  readonly label: string;
  readonly shortLabel: string;
}[] = [
  { axis: "both", label: "Обе оси", shortLabel: "XY" },
  { axis: "x", label: "Только ось X", shortLabel: "X" },
  { axis: "y", label: "Только ось Y", shortLabel: "Y" },
];

export interface CoordinatePlotNavigationControlsProps {
  readonly axis: CoordinatePlotZoomAxis;
  readonly onAxisChange: (axis: CoordinatePlotZoomAxis) => void;
  readonly onFit: () => void;
  readonly onReset: () => void;
  readonly onZoomIn: () => void;
  readonly onZoomOut: () => void;
}

export function CoordinatePlotNavigationControls({
  axis,
  onAxisChange,
  onFit,
  onReset,
  onZoomIn,
  onZoomOut,
}: CoordinatePlotNavigationControlsProps): ReactElement {
  const stopPointerPropagation = (event: React.PointerEvent<HTMLElement>) =>
    event.stopPropagation();

  return (
    <div
      aria-label="Навигация координатной плоскости"
      className="coordinate-plot-navigation"
      data-testid="coordinate-plot-navigation"
      onPointerDown={stopPointerPropagation}
      role="toolbar"
    >
      <div aria-label="Масштаб графика" className="plot-navigation-actions" role="group">
        <button aria-label="Приблизить график" onClick={onZoomIn} title="Приблизить" type="button">
          <span aria-hidden="true">+</span>
        </button>
        <button aria-label="Отдалить график" onClick={onZoomOut} title="Отдалить" type="button">
          <span aria-hidden="true">−</span>
        </button>
        <button aria-label="Сбросить диапазон графика" onClick={onReset} type="button">
          Сброс
        </button>
        <button aria-label="Вместить все графики" onClick={onFit} type="button">
          Вместить
        </button>
      </div>
      <div
        aria-label="Ось масштабирования"
        className="plot-navigation-axis"
        role="radiogroup"
      >
        {axisOptions.map((option) => (
          <button
            aria-checked={axis === option.axis}
            aria-label={option.label}
            className={axis === option.axis ? "is-active" : undefined}
            key={option.axis}
            onClick={() => onAxisChange(option.axis)}
            role="radio"
            tabIndex={axis === option.axis ? 0 : -1}
            type="button"
          >
            {option.shortLabel}
          </button>
        ))}
      </div>
    </div>
  );
}
''', encoding="utf-8")

