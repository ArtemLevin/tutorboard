name: Temporary 3D-4A cleanup

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Remove temporary patch infrastructure
        run: |
          git rm -f .github/workflows/__temp-3d4a-camera-independence.yml || true
          git rm -f .github/workflows/__temp-3d4a-cleanup.yml || true
          git rm -f .3d4a-camera-trigger || true
      - name: Commit cleanup
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(ci): remove temporary camera lifecycle patch infrastructure"
          git push
