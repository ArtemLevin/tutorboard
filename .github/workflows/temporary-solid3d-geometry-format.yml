name: Temporary 3D concave geometry formatting
on:
  push:
    branches: [fix/solid3d-concave-triangulation-dihedral-20261021]
    paths:
      - ".github/workflows/temporary-solid3d-geometry-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format concave mesh geometry and regression tests
        run: |
          npx prettier --write src/adapters/solid-3d-three/scene-builder.ts src/core/solid-3d/dihedral-angles.ts tests/unit/adapters/solid-3d-three/scene-builder.test.ts tests/unit/core/solid-3d/dihedral-angles.test.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/adapters/solid-3d-three/scene-builder.ts src/core/solid-3d/dihedral-angles.ts tests/unit/adapters/solid-3d-three/scene-builder.test.ts tests/unit/core/solid-3d/dihedral-angles.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format concave polygon fixes"
            git push origin HEAD:refs/heads/fix/solid3d-concave-triangulation-dihedral-20261021
          fi
