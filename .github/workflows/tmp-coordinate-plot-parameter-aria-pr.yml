name: Apply coordinate plot parameter ARIA from PR

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coordinate-plot-ux-safety-accessibility
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply parameter accessibility patch
        run: python .github/tmp/coordinate-plot-parameter-aria.py

      - name: Install dependencies
        run: npm ci

      - name: Format and verify
        run: |
          npm run format
          npm run typecheck
          npm run lint
          npm run test -- src/app/CoordinatePlotEditorPanel.test.tsx src/app/CoordinatePlotEditorPanel.accessibility.test.tsx

      - name: Commit implementation and remove temporary transport
        run: |
          git rm .github/workflows/tmp-coordinate-plot-parameter-aria-pr.yml
          git rm .github/tmp/coordinate-plot-parameter-aria.py
          git add src/app/CoordinatePlotEditorPanel.tsx src/app/CoordinatePlotEditorPanel.accessibility.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: connect parameter diagnostics to editor fields"
          git push origin HEAD:feature/coordinate-plot-ux-safety-accessibility
