name: Temporary P1 browser test formatter
on:
  push:
    paths:
      - ".github/workflows/temporary-p1-format.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/solid-3d-point-drag-p1-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format browser scenario and commit
        run: |
          npx prettier --write tests/e2e/solid-3d.spec.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/e2e/solid-3d.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format point drag Playwright regression"
            git push origin HEAD:refs/heads/feat/solid-3d-point-drag-p1-20261020
          fi
