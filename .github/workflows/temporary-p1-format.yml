name: Temporary P1 formatter
on:
  push:
    paths:
      - ".github/workflows/temporary-p1-format.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/solid-3d-point-drag-p1-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed source files
        run: |
          npx prettier --write \
            src/adapters/solid-3d-three/solid-point-drag.ts \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/app/solid-3d/Solid3DEditorPanel.drag.test.tsx \
            src/app/solid-3d/Solid3DEditorPanel.tsx \
            src/modules/solid-3d/point-drag.ts \
            tests/unit/modules/solid-3d/point-drag.test.ts \
            tests/unit/adapters/solid-3d-three/solid-point-drag.test.ts
      - name: Push formatter-only commit
        run: |
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/adapters/solid-3d-three src/app/solid-3d src/modules/solid-3d tests/unit/modules/solid-3d tests/unit/adapters/solid-3d-three
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): apply project prettier to point drag changes"
            git push origin HEAD:refs/heads/feat/solid-3d-point-drag-p1-20261020
          fi
