name: Temporary 3D review formatter
on:
  push:
    paths:
      - ".github/workflows/temporary-3d-review-prettier.yml"
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format review changes
        run: |
          npx prettier --write \
            src/app/solid-3d/Solid3DEditorPanel.tsx \
            src/app/solid-3d/Solid3DSectionRotationControls.tsx \
            src/core/solid-3d/polyhedron-section.ts \
            tests/unit/core/solid-3d/convex-topology.test.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/solid-3d/Solid3DEditorPanel.tsx src/app/solid-3d/Solid3DSectionRotationControls.tsx src/core/solid-3d/polyhedron-section.ts tests/unit/core/solid-3d/convex-topology.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format convex topology regression"
            git push origin HEAD:refs/heads/fix/solid-3d-section-review-20261021
          fi
