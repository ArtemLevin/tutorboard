name: T2 temporary preflight

on:
  push:
    branches:
      - agent/t2-teacher-board-workspace
    paths:
      - .github/workflows/t2-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/t2-teacher-board-workspace
      - name: Align E2E same-origin fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/e2e/teacher-boards-workspace.spec.ts")
          text = path.read_text()
          old = "https://127.0.0.1:4173/j/"
          if text.count(old) != 2:
              raise SystemExit(f"expected exactly two HTTPS fixture URLs, got {text.count(old)}")
          path.write_text(text.replace(old, "http://127.0.0.1:4173/j/"))
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format T2 files
        run: >-
          npx prettier --write
          src/core/ports/standalone-board-management-repository.ts
          src/adapters/board-http/management.ts
          src/adapters/board-http/public.ts
          src/app/TeacherBoardsBootstrap.tsx
          src/app/TeacherBoardsWorkspace.tsx
          src/app/teacher-boards.css
          src/app/bootstrap/main.tsx
          tests/unit/adapters/board-http/management.test.ts
          tests/e2e/teacher-boards-workspace.spec.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/unit/adapters/board-http/management.test.ts
      - name: Commit preflight fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No preflight changes to commit."
          else
            git commit -m "chore: normalize T2 implementation"
            git push origin HEAD:agent/t2-teacher-board-workspace
          fi
