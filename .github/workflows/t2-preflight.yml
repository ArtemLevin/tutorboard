name: T2 temporary preflight

on:
  push:
    branches:
      - agent/t2-teacher-board-workspace
    paths:
      - .github/workflows/t2-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/t2-teacher-board-workspace
      - name: Apply deterministic preflight fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          e2e = Path("tests/e2e/teacher-boards-workspace.spec.ts")
          text = e2e.read_text()
          old_url = "https://127.0.0.1:4173/j/"
          if text.count(old_url) != 2:
              raise SystemExit(f"expected exactly two HTTPS fixture URLs, got {text.count(old_url)}")
          e2e.write_text(text.replace(old_url, "http://127.0.0.1:4173/j/"))

          workspace = Path("src/app/TeacherBoardsWorkspace.tsx")
          text = workspace.read_text()
          pattern = re.compile(
              r'useEffect\(\(\) => \{\n\s*const dialog = dialogRef\.current;\n\s*dialog\?\.showModal\(\);\n\s*return \(\) => \{\n\s*if \(dialog\?\.open\) dialog\.close\(\);\n\s*window\.setTimeout\(\(\) => returnFocusRef\.current\?\.focus\(\), 0\);\n\s*\};\n\s*\}, \[\]\);'
          )
          replacement = '''useEffect(() => {
            const dialog = dialogRef.current;
            const returnFocus = returnFocusRef.current;
            dialog?.showModal();
            return () => {
              if (dialog?.open) dialog.close();
              window.setTimeout(() => returnFocus?.focus(), 0);
            };
          }, []);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one focus cleanup match, got {count}")
          workspace.write_text(text)
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format T2 files
        run: >-
          npx prettier --write
          src/core/ports/standalone-board-management-repository.ts
          src/adapters/board-http/management.ts
          src/adapters/board-http/public.ts
          src/app/TeacherBoardsBootstrap.tsx
          src/app/TeacherBoardsWorkspace.tsx
          src/app/teacher-boards.css
          src/app/bootstrap/main.tsx
          tests/unit/adapters/board-http/management.test.ts
          tests/e2e/teacher-boards-workspace.spec.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/unit/adapters/board-http/management.test.ts
      - name: Commit preflight fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No preflight changes to commit."
          else
            git commit -m "chore: normalize T2 implementation"
            git push origin HEAD:agent/t2-teacher-board-workspace
          fi
