name: Apply smooth lasso rendering fix

on:
  push:
    branches:
      - fix/smooth-lasso-curves

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/smooth-lasso-curves
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Implement periodic lasso smoothing
        run: |
          python <<'PY'
          from pathlib import Path

          smoothing = Path("src/shared/stroke-smoothing.ts")
          source = smoothing.read_text(encoding="utf-8")

          closed_spline = '''
          export function buildClosedCatmullRomSpline(
            points: readonly StrokePoint[],
            options: CatmullRomOptions,
          ): readonly StrokePoint[] {
            const finite = points.filter(finitePoint);
            if (finite.length <= 2) return [...finite];
            const first = finite[0]!;
            const last = finite.at(-1)!;
            const source =
              finite.length > 3 && distance(first, last) <= 0.001
                ? finite.slice(0, -1)
                : finite;
            if (source.length <= 2) return [...source];

            const requestedSubdivisions = Math.max(
              1,
              Math.floor(options.subdivisions),
            );
            const maximum = Math.max(
              source.length + 1,
              Math.floor(options.maxOutputPoints ?? defaultMaximumOutputPoints),
            );
            const maximumSubdivisions = Math.max(
              1,
              Math.floor((maximum - 1) / source.length),
            );
            const subdivisions = Math.min(
              requestedSubdivisions,
              maximumSubdivisions,
            );
            const output: StrokePoint[] = [];

            for (let index = 0; index < source.length; index += 1) {
              const p0 = source[(index - 1 + source.length) % source.length]!;
              const p1 = source[index]!;
              const p2 = source[(index + 1) % source.length]!;
              const p3 = source[(index + 2) % source.length]!;
              for (let step = 0; step < subdivisions; step += 1) {
                output.push(
                  catmullRomPoint(p0, p1, p2, p3, step / subdivisions),
                );
              }
            }

            if (output.length > 0) output.push(output[0]!);
            return output;
          }

          '''
          marker = "export function resolveStrokeSmoothingQuality("
          if "export function buildClosedCatmullRomSpline(" not in source:
              assert marker in source
              source = source.replace(marker, closed_spline + marker, 1)

          smooth_closed = '''
          export function buildSmoothClosedStrokePoints(
            rawPoints: readonly StrokePoint[],
            options: SmoothStrokeOptions,
          ): readonly StrokePoint[] {
            const finite = rawPoints.filter(finitePoint);
            if (finite.length <= 2) return finite;
            const first = finite[0]!;
            const last = finite.at(-1)!;
            const source =
              finite.length > 3 && distance(first, last) <= 0.001
                ? finite.slice(0, -1)
                : finite;
            if (source.length <= 2) return source;

            const quality = resolveStrokeSmoothingQuality(
              [...source, source[0]!],
              options,
            );
            const normalizedLoop = normalizeStrokePoints(
              [...source, source[0]!],
              {
                maxInsertedPointsPerSegment: 24,
                maxNormalizedPoints: Math.min(
                  defaultMaximumNormalizedPoints,
                  quality.maxOutputPoints,
                ),
                minPointDistance: quality.minPointDistance,
                targetSegmentLength: quality.targetSegmentLength,
              },
            );
            const normalized =
              normalizedLoop.length > 1 &&
              distance(normalizedLoop[0]!, normalizedLoop.at(-1)!) <= 0.001
                ? normalizedLoop.slice(0, -1)
                : normalizedLoop;
            return buildClosedCatmullRomSpline(normalized, {
              maxOutputPoints: quality.maxOutputPoints,
              subdivisions: quality.subdivisions,
            });
          }

          '''
          marker = "export function buildCachedSmoothStrokePoints("
          if "export function buildSmoothClosedStrokePoints(" not in source:
              assert marker in source
              source = source.replace(marker, smooth_closed + marker, 1)
          smoothing.write_text(source, encoding="utf-8")

          board = Path("src/adapters/canvas-konva/BoardStage.tsx")
          source = board.read_text(encoding="utf-8")
          import_marker = '''} from "../../core/public";
          import { BoardGrid } from "./grid";'''
          import_replacement = '''} from "../../core/public";
          import {
            buildSmoothClosedStrokePoints,
            flattenStrokePoints,
          } from "../../shared/stroke-smoothing";
          import { BoardGrid } from "./grid";'''
          if "buildSmoothClosedStrokePoints" not in source:
              assert import_marker in source
              source = source.replace(import_marker, import_replacement, 1)

          batches = '''  const visibleItemBatches = useMemo(
            () =>
              batchBoardRenderItems(
                selectVisibleBoardItems(scene.items, previewViewport, size),
              ),
            [previewViewport, scene.items, size],
          );'''
          batches_replacement = batches + '''
            const smoothedSelectionLasso = useMemo(
              () =>
                selectionLasso === null || selectionLasso.length < 3
                  ? selectionLasso
                  : buildSmoothClosedStrokePoints(selectionLasso, {
                      baseSegmentLength: 6,
                      maxOutputPoints: 8_000,
                      maxSubdivisions: 8,
                      minSubdivisions: 4,
                      zoom: previewViewport.zoom,
                    }),
              [previewViewport.zoom, selectionLasso],
            );'''
          if "const smoothedSelectionLasso" not in source:
              assert batches in source
              source = source.replace(batches, batches_replacement, 1)

          old_lasso = '''            {selectionLasso === null || selectionLasso.length < 2 ? null : (
                        <Line
                          closed={selectionLasso.length > 2}
                          dash={[7 / previewViewport.zoom, 4 / previewViewport.zoom]}
                          fill="rgba(44, 113, 130, 0.09)"
                          lineCap="round"
                          lineJoin="round"
                          points={selectionLasso.flatMap(({ x, y }) => [x, y])}
                          stroke="#2c7182"
                          strokeWidth={1.5 / previewViewport.zoom}
                        />
                      )}'''
          new_lasso = '''            {smoothedSelectionLasso === null ||
                      smoothedSelectionLasso.length < 2 ? null : (
                        <>
                          <Line
                            closed={smoothedSelectionLasso.length > 2}
                            lineCap="round"
                            lineJoin="round"
                            perfectDrawEnabled
                            points={[
                              ...flattenStrokePoints(smoothedSelectionLasso),
                            ]}
                            stroke="rgba(44, 113, 130, 0.2)"
                            strokeWidth={6 / previewViewport.zoom}
                          />
                          <Line
                            closed={smoothedSelectionLasso.length > 2}
                            fill="rgba(44, 113, 130, 0.07)"
                            lineCap="round"
                            lineJoin="round"
                            perfectDrawEnabled
                            points={[
                              ...flattenStrokePoints(smoothedSelectionLasso),
                            ]}
                            stroke="#2c7182"
                            strokeWidth={2 / previewViewport.zoom}
                          />
                        </>
                      )}'''
          assert old_lasso in source
          source = source.replace(old_lasso, new_lasso, 1)
          board.write_text(source, encoding="utf-8")

          tests = Path("src/shared/stroke-smoothing.test.ts")
          source = tests.read_text(encoding="utf-8")
          source = source.replace(
              "  buildCachedSmoothStrokePoints,\n  buildCatmullRomSpline,",
              "  buildCachedSmoothStrokePoints,\n  buildCatmullRomSpline,\n  buildClosedCatmullRomSpline,",
              1,
          )
          source = source.replace(
              "  buildSmoothStrokePoints,",
              "  buildSmoothClosedStrokePoints,\n  buildSmoothStrokePoints,",
              1,
          )
          test_block = '''

            it("builds a smooth periodic loop with a continuous seam", () => {
              const loop = [
                { x: 0, y: 0 },
                { x: 60, y: 0 },
                { x: 80, y: 30 },
                { x: 60, y: 60 },
                { x: 0, y: 60 },
                { x: -20, y: 30 },
                { x: 0, y: 0 },
              ] as const;
              const direct = buildClosedCatmullRomSpline(loop, {
                subdivisions: 6,
              });
              const result = buildSmoothClosedStrokePoints(loop, {
                maxOutputPoints: 2_000,
                zoom: 1,
              });
              expect(direct[0]).toEqual(direct.at(-1));
              expect(result[0]).toEqual(result.at(-1));
              expect(result.length).toBeGreaterThan(loop.length);
              expect(
                result.every(({ x, y }) => Number.isFinite(x) && Number.isFinite(y)),
              ).toBe(true);

              const before = result.at(-2)!;
              const seam = result[0]!;
              const after = result[1]!;
              const incoming = { x: seam.x - before.x, y: seam.y - before.y };
              const outgoing = { x: after.x - seam.x, y: after.y - seam.y };
              const cosine =
                (incoming.x * outgoing.x + incoming.y * outgoing.y) /
                (Math.hypot(incoming.x, incoming.y) *
                  Math.hypot(outgoing.x, outgoing.y));
              expect(cosine).toBeGreaterThan(0.9);
            });'''
          closing = "\n});\n"
          if "builds a smooth periodic loop with a continuous seam" not in source:
              assert source.endswith(closing)
              source = source[: -len(closing)] + test_block + closing
          tests.write_text(source, encoding="utf-8")

          docs = Path("docs/architecture/LASSO_SELECTION.md")
          source = docs.read_text(encoding="utf-8")
          old = "Selection runs once when the pointer is released; the live gesture renders only the polygon preview."
          new = "Selection runs once when the pointer is released. The live gesture renders a periodic Catmull–Rom preview with a continuous double stroke, while hit testing keeps the bounded raw polygon."
          assert old in source
          docs.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format and verify
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm run test -- src/shared/stroke-smoothing.test.ts

      - name: Commit product fix and remove staging workflow
        run: |
          rm .github/workflows/apply-smooth-lasso-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render lasso as a smooth continuous curve"
          git push origin HEAD:fix/smooth-lasso-curves
