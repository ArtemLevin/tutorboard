name: Temporary P1.4 final panel format
on:
  push:
    paths:
      - ".github/workflows/temporary-p14-panel-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/app/solid-3d/Solid3DEditorPanel.tsx
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/solid-3d/Solid3DEditorPanel.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format memoized point-axis overlay"
            git push origin HEAD:refs/heads/feat/solid-3d-rotation-two-points-p14-20261021
          fi
