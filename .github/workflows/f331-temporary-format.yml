name: Temporary F3.3.1 formatter
on:
  push:
    branches: [test/f3-3-1-real-media-baseline]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Emit canonical Prettier formatted source
        shell: bash
        run: |
          set -euo pipefail
          paths=(tests/fullstack/media-asset-baseline.spec.ts playwright.media-asset-baseline.config.ts tsconfig.node.json)
          npx prettier --write "${paths[@]}"
          for path in "${paths[@]}"; do
            echo "F331_FILE:${path}:$(base64 -w0 "$path")"
          done
