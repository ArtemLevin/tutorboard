name: Smart Ink release gate helper

on:
  push:
    branches:
      - agent/phase9-smart-ink-release-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: prepare Smart Ink release gate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase9-smart-ink-release-gate
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply release gate patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/app/configuration/environment.ts",
              '  readonly serverSync: boolean;\n  readonly smartInkDiagnostics: boolean;',
              '  readonly serverSync: boolean;\n  readonly smartInk: boolean;\n  readonly smartInkDiagnostics: boolean;',
          )
          replace_once(
              "src/app/configuration/environment.ts",
              '  readonly serverSync?: string | undefined;\n  readonly smartInkDiagnostics?: string | undefined;',
              '  readonly serverSync?: string | undefined;\n  readonly smartInk?: string | undefined;\n  readonly smartInkDiagnostics?: string | undefined;',
          )
          replace_once(
              "src/app/configuration/environment.ts",
              '    serverSync: import.meta.env.VITE_FEATURE_SERVER_SYNC,\n    smartInkDiagnostics: import.meta.env.VITE_FEATURE_SMART_INK_DIAGNOSTICS,',
              '    serverSync: import.meta.env.VITE_FEATURE_SERVER_SYNC,\n    smartInk: import.meta.env.VITE_FEATURE_SMART_INK,\n    smartInkDiagnostics: import.meta.env.VITE_FEATURE_SMART_INK_DIAGNOSTICS,',
          )
          replace_once(
              "src/app/configuration/environment.ts",
              '  return {\n    boardApiBaseUrl: boardApiUrl.pathname.replace(/\\/+$/u, ""),',
              '  const smartInk = booleanFlag(\n    "VITE_FEATURE_SMART_INK",\n    featureInput.smartInk,\n    stage !== "production",\n  );\n  const smartInkDiagnostics = booleanFlag(\n    "VITE_FEATURE_SMART_INK_DIAGNOSTICS",\n    featureInput.smartInkDiagnostics,\n    stage !== "production",\n  );\n\n  return {\n    boardApiBaseUrl: boardApiUrl.pathname.replace(/\\/+$/u, ""),',
          )
          replace_once(
              "src/app/configuration/environment.ts",
              '      smartInkDiagnostics: booleanFlag(\n        "VITE_FEATURE_SMART_INK_DIAGNOSTICS",\n        featureInput.smartInkDiagnostics,\n        stage !== "production",\n      ),',
              '      smartInk,\n      smartInkDiagnostics: smartInk && smartInkDiagnostics,',
          )

          env_test = Path("src/app/configuration/environment.test.ts")
          text = env_test.read_text(encoding="utf-8")
          text = text.replace(
              '          serverSync: stage === "production",\n          smartInkDiagnostics: stage !== "production",',
              '          serverSync: stage === "production",\n          smartInk: stage !== "production",\n          smartInkDiagnostics: stage !== "production",',
          )
          text = text.replace(
              '        serverSync: false,\n        smartInkDiagnostics: true,',
              '        serverSync: false,\n        smartInk: true,\n        smartInkDiagnostics: true,',
          )
          text = text.replace(
              '        serverSync: "true",\n        smartInkDiagnostics: "true",',
              '        serverSync: "true",\n        smartInk: "true",\n        smartInkDiagnostics: "true",',
          )
          text = text.replace(
              '      serverSync: true,\n      smartInkDiagnostics: true,',
              '      serverSync: true,\n      smartInk: true,\n      smartInkDiagnostics: true,',
          )
          marker = '''    expect(() =>\n      readEnvironment("test", undefined, {\n        smartInkDiagnostics: "perhaps",\n      }),\n    ).toThrow("VITE_FEATURE_SMART_INK_DIAGNOSTICS");\n'''
          addition = marker + '''    expect(() =>\n      readEnvironment("test", undefined, { smartInk: "perhaps" }),\n    ).toThrow("VITE_FEATURE_SMART_INK");\n    expect(\n      readEnvironment("test", undefined, {\n        smartInk: "false",\n        smartInkDiagnostics: "true",\n      }).features,\n    ).toMatchObject({ smartInk: false, smartInkDiagnostics: false });\n'''
          if text.count(marker) != 1:
              raise SystemExit("environment.test.ts marker mismatch")
          env_test.write_text(text.replace(marker, addition, 1), encoding="utf-8")

          replace_once(
              "src/vite-env.d.ts",
              '  readonly VITE_FEATURE_SERVER_SYNC?: "0" | "1" | "false" | "true";\n  readonly VITE_FEATURE_SMART_INK_DIAGNOSTICS?: "0" | "1" | "false" | "true";',
              '  readonly VITE_FEATURE_SERVER_SYNC?: "0" | "1" | "false" | "true";\n  readonly VITE_FEATURE_SMART_INK?: "0" | "1" | "false" | "true";\n  readonly VITE_FEATURE_SMART_INK_DIAGNOSTICS?: "0" | "1" | "false" | "true";',
          )
          replace_once(
              ".env.example",
              'VITE_FEATURE_SERVER_SYNC=false\nVITE_FEATURE_SMART_INK_DIAGNOSTICS=true',
              'VITE_FEATURE_SERVER_SYNC=false\nVITE_FEATURE_SMART_INK=true\nVITE_FEATURE_SMART_INK_DIAGNOSTICS=true',
          )
          replace_once(
              "Dockerfile",
              'ARG BUILD_VERSION=0.1.0\nENV VITE_APP_STAGE=production',
              'ARG BUILD_VERSION=0.1.0\nARG VITE_FEATURE_SMART_INK=false\nENV VITE_APP_STAGE=production',
          )
          replace_once(
              "Dockerfile",
              '    VITE_FEATURE_GEOMETRY_PROMPT=true \\\n    VITE_FEATURE_SERVER_SYNC=true',
