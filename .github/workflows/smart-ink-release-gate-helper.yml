          replace_once(
              "src/app/App.tsx",
              '        activeTool === "drawing.smart-ink",',
              '        smartInkEnabled && activeTool === "drawing.smart-ink",',
          )
          replace_once(
              "src/app/App.tsx",
              '    [activeTool, applyDrawingAction],',
              '    [activeTool, applyDrawingAction, smartInkEnabled],',
          )
          replace_once(
              "src/app/App.tsx",
              '                <dt>V / H / P / I / R / E / T</dt>',
              '                <dt>\n                  {smartInkEnabled\n                    ? "V / H / P / I / R / E / T"\n                    : "V / H / P / R / E / T"}\n                </dt>',
          )
          replace_once(
              "src/app/App.tsx",
              '          {drawingTools.map((tool) => (',
              '          {availableDrawingTools.map((tool) => (',
          )

          product_test = Path("src/app/ProductShell.test.tsx")
          product_text = product_test.read_text(encoding="utf-8")
          product_text = product_text.replace(
              '    serverSync: false,\n  },',
              '    serverSync: false,\n    smartInk: true,\n    smartInkDiagnostics: true,\n  },',
          )
          product_test.write_text(product_text, encoding="utf-8")

          replace_once(
              "package.json",
              '    "e2e": "playwright test",',
              '    "e2e": "playwright test",\n    "e2e:smart-ink-release-gate": "playwright test tests/e2e/smart-ink-release-gate.spec.ts",',
          )

          replace_once(
              ".github/workflows/ci.yml",
              '        env:\n          VITE_FEATURE_SERVER_SYNC: "true"\n          VITE_GEOMETRYOS_BASE_URL: http://127.0.0.1:4173/geometryos\n        run: npm run build\n\n      - name: Run browser smoke\n        run: npm run e2e',
              '        env:\n          VITE_APP_STAGE: test\n          VITE_FEATURE_SERVER_SYNC: "true"\n          VITE_FEATURE_SMART_INK: "true"\n          VITE_GEOMETRYOS_BASE_URL: http://127.0.0.1:4173/geometryos\n        run: npm run build\n\n      - name: Run browser smoke\n        run: npm run e2e\n\n      - name: Build production Smart Ink gated bundle\n        env:\n          VITE_APP_STAGE: production\n          VITE_FEATURE_SERVER_SYNC: "true"\n          VITE_FEATURE_SMART_INK: "false"\n          VITE_FEATURE_SMART_INK_DIAGNOSTICS: "false"\n          VITE_GEOMETRYOS_BASE_URL: http://127.0.0.1:4173/geometryos\n        run: npm run build\n\n      - name: Verify production Smart Ink release gate\n        env:\n          SMART_INK_EXPECTED: disabled\n        run: npm run e2e:smart-ink-release-gate',
          )

          Path("src/app/SmartInkReleaseGate.test.tsx").write_text(
              '''import { cleanup, fireEvent, render, screen } from "@testing-library/react";\nimport { afterEach, describe, expect, it, vi } from "vitest";\n\nimport type {\n  BoardStageProps,\n  WorldPointerSample,\n} from "../adapters/canvas-konva/public";\nimport { App } from "./App";\n\nvi.mock("../adapters/canvas-konva/public", () => ({\n  BoardStage: (props: BoardStageProps) => {\n    const start: WorldPointerSample = {\n      point: { x: 10, y: 20 },\n      pointerId: 1,\n      pressure: 0.5,\n    };\n    const finish: WorldPointerSample = {\n      point: { x: 80, y: 20 },\n      pointerId: 1,\n      pressure: 0.5,\n    };\n    return (\n      <div aria-label="Бесконечное полотно TutorBoard" role="application">\n        <button\n          onClick={() => {\n            props.onWorldPointerStart(start);\n            props.onWorldPointerMove(finish);\n            props.onWorldPointerFinish(finish);\n          }}\n          type="button"\n        >\n          Завершить тестовый жест\n        </button>\n      </div>\n    );\n  },\n  createDefaultKonvaRendererRegistry: () => ({}),\n}));\n\nafterEach(cleanup);\n\ndescribe("Smart Ink release gate", () => {\n  it("hides the tool and ignores its shortcut when disabled", () => {\n    render(<App smartInkEnabled={false} />);\n\n    expect(\n      screen.queryByRole("button", { name: "Smart Ink (I)" }),\n    ).not.toBeInTheDocument();\n\n    fireEvent.keyDown(window, { key: "i" });\n    fireEvent.click(\n      screen.getByRole("button", { name: "Завершить тестовый жест" }),\n    );\n\n    expect(screen.getByTestId("object-count")).toHaveTextContent("0 объекта");\n    fireEvent.click(screen.getByRole("button", { name: "Горячие клавиши" }));\n    expect(screen.getByText("V / H / P / R / E / T")).toBeInTheDocument();\n  });\n\n  it("keeps the development tool and shortcut available when enabled", () => {\n    render(<App smartInkEnabled />);\n\n    const tool = screen.getByRole("button", { name: "Smart Ink (I)" });\n    expect(tool).toBeInTheDocument();\n    fireEvent.keyDown(window, { key: "i" });\n    expect(tool).toHaveAttribute("aria-pressed", "true");\n  });\n});\n''',
              encoding="utf-8",
          )

          Path("src/app/ProductShell.smart-ink-gate.test.tsx").write_text(
              '''import { cleanup, render, screen } from "@testing-library/react";\nimport { afterEach, describe, expect, it, vi } from "vitest";\n\nimport {\n  documentId,\n  type BoardDocumentRepository,\n  type BoardPlatformRepository,\n  type GeometryOsClient,\n  type PendingBoardCommandQueue,\n} from "../core/public";\nimport { ProductShell } from "./ProductShell";\nimport type { AppEnvironment } from "./configuration/environment";\n\nvi.mock("./PersistedApp", () => ({\n  PersistedApp: ({\n    smartInkEnabled,\n  }: {\n    readonly smartInkEnabled?: boolean;\n  }) => (\n    <div data-testid="local-smart-ink-gate">\n      {smartInkEnabled ? "enabled" : "disabled"}\n    </div>\n  ),\n}));\n\nvi.mock("./SyncedApp", () => ({\n  SyncedApp: ({\n    smartInkEnabled,\n  }: {\n    readonly smartInkEnabled?: boolean;\n  }) => (\n    <div data-testid="server-smart-ink-gate">\n      {smartInkEnabled ? "enabled" : "disabled"}\n    </div>\n  ),\n}));\n\nconst geometryOsClient = {} as GeometryOsClient;\nconst repository = {} as BoardDocumentRepository;\n\nfunction environment(smartInk: boolean, serverSync: boolean): AppEnvironment {\n  return {\n    boardApiBaseUrl: "/api/v1",\n    features: {\n      developmentDiagnostics: false,\n      documentSnapshots: true,\n      geometryPrompt: true,\n      serverSync,\n      smartInk,\n      smartInkDiagnostics: false,\n    },\n    geometryOsBaseUrl: "https://geometry.example.test",\n    stage: "production",\n  };\n}\n\nafterEach(() => {\n  cleanup();\n  window.location.hash = "";\n});\n\ndescribe("ProductShell Smart Ink release gate", () => {\n  it("propagates the disabled production gate to local mode", () => {\n    render(\n      <ProductShell\n        environment={environment(false, false)}\n        geometryOsClient={geometryOsClient}\n        repository={repository}\n      />,\n    );\n\n    expect(screen.getByTestId("local-smart-ink-gate")).toHaveTextContent(\n      "disabled",\n    );\n  });\n\n  it("propagates the enabled gate to server mode", () => {\n    render(\n      <ProductShell\n        environment={environment(true, true)}\n        geometryOsClient={geometryOsClient}\n        repository={repository}\n        serverSync={{\n          documentId: documentId("document:release-gate"),\n          lessonId: "lesson:release-gate",\n          queue: {} as PendingBoardCommandQueue,\n          repository: {} as BoardPlatformRepository,\n        }}\n      />,\n    );\n\n    expect(screen.getByTestId("server-smart-ink-gate")).toHaveTextContent(\n      "enabled",\n    );\n  });\n});\n''',
              encoding="utf-8",
          )

          Path("tests/e2e/smart-ink-release-gate.spec.ts").write_text(
              '''import { expect, test } from "@playwright/test";\n\ntest.skip(\n  process.env.SMART_INK_EXPECTED !== "disabled",\n  "Runs only against the production Smart Ink gated bundle.",\n);\n\ntest("keeps Smart Ink unavailable in the production release candidate", async ({\n  page,\n}) => {\n  await page.goto("/");\n  await expect(\n    page.getByRole("application", {\n      name: "Бесконечное полотно TutorBoard",\n    }),\n  ).toBeVisible();\n\n  await expect(\n    page.getByRole("button", { name: "Smart Ink (I)" }),\n  ).toHaveCount(0);\n  await page.keyboard.press("i");\n  await expect(\n    page.getByLabel("Подсказка по навигации").getByText("Навигация"),\n  ).toBeVisible();\n  await expect(page.getByTestId("interaction-state")).toHaveText("idle");\n  await expect(page.getByTestId("object-count")).toHaveText("0 объекта");\n});\n''',
              encoding="utf-8",
          )

          Path("docs/architecture/SMART_INK_RELEASE_GATE.md").write_text(
              '''# Smart Ink production release gate\n\n## Purpose\n\n`VITE_FEATURE_SMART_INK` separates the shipped Smart Ink code and command-reader\ncompatibility from product availability. Development and test stages enable the\ntool by default. Production keeps it disabled until cross-browser captured\nevidence closes the Phase 9 quality gate.\n\n## Effective behavior\n\nWhen the flag is disabled:\n\n- the Smart Ink toolbar action is absent;\n- shortcut `I` has no effect;\n- the recognizer and automatic replacement path are not invoked;\n- the Smart Ink diagnostics subscriber is not mounted;\n- existing `core.objects.replace` commands and normalized board objects remain\n  readable;\n- `BoardDocument 1.0`, stored revisions and collaboration contracts remain\n  unchanged.\n\n`VITE_FEATURE_SMART_INK_DIAGNOSTICS` is subordinate to the main release flag. A\ndiagnostics request cannot activate Smart Ink by itself.\n\n## Stage defaults\n\n| Stage | Smart Ink | Diagnostics |\n| --- | --- | --- |\n| development | enabled | enabled |\n| test | enabled | enabled |\n| production | disabled | disabled |\n\nProduction images accept the build argument\n`--build-arg VITE_FEATURE_SMART_INK=true` for a later approved promotion. The\ndefault image remains gated.\n\n## Verification\n\nThe repository verifies both sides of the gate:\n\n1. unit tests cover strict environment parsing and subordinate diagnostics;\n2. component tests cover hidden toolbar, inert shortcut and local/server prop\n   propagation;\n3. the regular browser smoke builds the test-stage enabled bundle;\n4. a second Chromium/Firefox smoke rebuilds the production bundle with Smart Ink\n   disabled and verifies the gated UI;\n5. the immutable production image uses the disabled default.\n\n## Rollback\n\nRebuild or redeploy with `VITE_FEATURE_SMART_INK=false`. Stored documents require\nno migration, because the gate controls tool availability only.\n''',
              encoding="utf-8",
          )

          smart_ink_doc = Path("docs/architecture/SMART_INK.md")
          smart_text = smart_ink_doc.read_text(encoding="utf-8")
          appendix = '''\n\n## Production release gate\n\nTool availability is controlled by `VITE_FEATURE_SMART_INK`. Development and\ntest enable it by default; production disables it until the captured Chromium\nand Firefox gate is approved. Diagnostics are mounted only when both Smart Ink\nand `VITE_FEATURE_SMART_INK_DIAGNOSTICS` are enabled. See\n[`SMART_INK_RELEASE_GATE.md`](SMART_INK_RELEASE_GATE.md).\n'''
          if "## Production release gate" not in smart_text:
              smart_ink_doc.write_text(smart_text.rstrip() + appendix, encoding="utf-8")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run focused tests
        run: >-
          npx vitest run
          src/app/configuration/environment.test.ts
          src/app/SmartInkReleaseGate.test.tsx
          src/app/ProductShell.smart-ink-gate.test.tsx
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add . ':!.github/workflows/smart-ink-release-gate-helper.yml'
          git commit -m "feat: add Smart Ink production release gate"
          git push origin HEAD:agent/phase9-smart-ink-release-gate
