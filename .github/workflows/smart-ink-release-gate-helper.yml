          )
          replace_once(
              "src/app/bootstrap/main.tsx",
              '    {environment.features.smartInkDiagnostics ? (',
              '    {environment.features.smartInk &&\n    environment.features.smartInkDiagnostics ? (',
          )

          replace_once(
              "src/app/ProductShell.tsx",
              '                repository={serverSync.repository}\n              />',
              '                repository={serverSync.repository}\n                smartInkEnabled={environment.features.smartInk}\n              />',
          )
          replace_once(
              "src/app/ProductShell.tsx",
              '                repository={repository}\n              />',
              '                repository={repository}\n                smartInkEnabled={environment.features.smartInk}\n              />',
          )

          replace_once(
              "src/app/PersistedApp.tsx",
              '  readonly repository: BoardDocumentRepository;\n}',
              '  readonly repository: BoardDocumentRepository;\n  readonly smartInkEnabled?: boolean;\n}',
          )
          replace_once(
              "src/app/PersistedApp.tsx",
              '  readonly onNotification:\n    ((notification: ProductNotification) => void) | undefined;\n}',
              '  readonly onNotification:\n    ((notification: ProductNotification) => void) | undefined;\n  readonly smartInkEnabled: boolean;\n}',
          )
          replace_once(
              "src/app/PersistedApp.tsx",
              '  enableSnapshots,\n  onNotification,\n}: WorkspaceProps)',
              '  enableSnapshots,\n  onNotification,\n  smartInkEnabled,\n}: WorkspaceProps)',
          )
          replace_once(
              "src/app/PersistedApp.tsx",
              '      persistenceStatus={statusView(autosaveState)}\n    />',
              '      persistenceStatus={statusView(autosaveState)}\n      smartInkEnabled={smartInkEnabled}\n    />',
          )
          replace_once(
              "src/app/PersistedApp.tsx",
              '  onNotification,\n  repository,\n}: PersistedAppProps)',
              '  onNotification,\n  repository,\n  smartInkEnabled = true,\n}: PersistedAppProps)',
          )
          text = Path("src/app/PersistedApp.tsx").read_text(encoding="utf-8")
          text = text.replace(
              '        repository={repository}\n      />',
              '        repository={repository}\n        smartInkEnabled={smartInkEnabled}\n      />',
          )
          text = text.replace(
              '      repository={repository}\n    />',
              '      repository={repository}\n      smartInkEnabled={smartInkEnabled}\n    />',
          )
          Path("src/app/PersistedApp.tsx").write_text(text, encoding="utf-8")

          replace_once(
              "src/app/SyncedApp.tsx",
              '  readonly repository: BoardPlatformRepository;\n}',
              '  readonly repository: BoardPlatformRepository;\n  readonly smartInkEnabled?: boolean;\n}',
          )
          replace_once(
              "src/app/SyncedApp.tsx",
              '  queue,\n  repository,\n}: SyncedAppProps)',
              '  queue,\n  repository,\n  smartInkEnabled = true,\n}: SyncedAppProps)',
          )
          replace_once(
              "src/app/SyncedApp.tsx",
              '        remoteCursors={participants.flatMap((participant) =>',
              '        smartInkEnabled={smartInkEnabled}\n        remoteCursors={participants.flatMap((participant) =>',
          )

          replace_once(
              "src/app/App.tsx",
              '  readonly geometryOsClient?: GeometryOsClient | undefined;\n  readonly historyEnabled?: boolean;',
              '  readonly geometryOsClient?: GeometryOsClient | undefined;\n  readonly historyEnabled?: boolean;\n  readonly smartInkEnabled?: boolean;',
          )
          replace_once(
              "src/app/App.tsx",
              '  readOnly = false,\n  remoteCursors = [],\n}: AppProps = {})',
              '  readOnly = false,\n  remoteCursors = [],\n  smartInkEnabled = true,\n}: AppProps = {})',
          )
          replace_once(
              "src/app/App.tsx",
              '  const registry = useMemo(() => createDefaultKonvaRendererRegistry(), []);\n  const sceneSelector = useMemo(() => createBoardSceneSelector(), []);',
              '  const registry = useMemo(() => createDefaultKonvaRendererRegistry(), []);\n  const availableDrawingTools = useMemo(\n    () =>\n      smartInkEnabled\n        ? drawingTools\n        : drawingTools.filter((tool) => tool.id !== "drawing.smart-ink"),\n    [smartInkEnabled],\n  );\n  const sceneSelector = useMemo(() => createBoardSceneSelector(), []);',
          )
          replace_once(
              "src/app/App.tsx",
              '          committed.ok &&\n          requestSmartInk &&',
              '          committed.ok &&\n          smartInkEnabled &&\n          requestSmartInk &&',
          )
          replace_once(
              "src/app/App.tsx",
              '    [commitCommand, commitDrawingObject, createCommandMetadata],',
              '    [\n      commitCommand,\n      commitDrawingObject,\n      createCommandMetadata,\n      smartInkEnabled,\n    ],',
          )
          replace_once(
              "src/app/App.tsx",
              '    (tool: ActiveToolId) => {\n      applyDrawingAction({ kind: "cancel" });',
              '    (tool: ActiveToolId) => {\n      if (!smartInkEnabled && tool === "drawing.smart-ink") {\n        return;\n      }\n      applyDrawingAction({ kind: "cancel" });',
          )
          replace_once(
              "src/app/App.tsx",
              '    [applyDrawingAction],\n  );\n\n  useEffect(() => {\n    const handleShortcut',
              '    [applyDrawingAction, smartInkEnabled],\n  );\n\n  useEffect(() => {\n    if (!smartInkEnabled && activeTool === "drawing.smart-ink") {\n      activateTool(navigationToolId);\n    }\n  }, [activeTool, activateTool, smartInkEnabled]);\n\n  useEffect(() => {\n    const handleShortcut',
          )
          replace_once(
              "src/app/App.tsx",
              '      const tool = drawingTools.find(',
              '      const tool = availableDrawingTools.find(',
          )
          replace_once(
              "src/app/App.tsx",
              '    activateTool,\n    closeShortcuts,',
              '    activateTool,\n    availableDrawingTools,\n    closeShortcuts,',
