name: T2 temporary boundary repair

on:
  push:
    branches:
      - agent/t2-teacher-board-workspace
    paths:
      - .github/workflows/t2-boundary-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/t2-teacher-board-workspace
      - name: Route T2 through the core public contract
        shell: python
        run: |
          from pathlib import Path

          core = Path("src/core/public.ts")
          text = core.read_text()
          export_block = '''\nexport type {\n  BoardInvitationSecretResult,\n  BoardInvitationSummary,\n  CreateBoardInvitationInput,\n  StandaloneBoardDescriptor,\n  StandaloneBoardManagementRepository,\n  TeacherManagementContext,\n  TeacherManagementRole,\n  UpdateBoardInvitationInput,\n  UpdateStandaloneBoardInput,\n} from "./ports/standalone-board-management-repository";\n'''
          if "StandaloneBoardManagementRepository" not in text:
              core.write_text(text.rstrip() + "\n" + export_block)

          management = Path("src/adapters/board-http/management.ts")
          text = management.read_text()
          old = '''import { documentId, type DocumentId } from "../../core/public";\nimport type {\n  BoardInvitationSecretResult,\n  BoardInvitationSummary,\n  CreateBoardInvitationInput,\n  StandaloneBoardDescriptor,\n  StandaloneBoardManagementRepository,\n  TeacherManagementContext,\n  UpdateBoardInvitationInput,\n  UpdateStandaloneBoardInput,\n} from "../../core/ports/standalone-board-management-repository";'''
          new = '''import {\n  documentId,\n  type BoardInvitationSecretResult,\n  type BoardInvitationSummary,\n  type CreateBoardInvitationInput,\n  type DocumentId,\n  type StandaloneBoardDescriptor,\n  type StandaloneBoardManagementRepository,\n  type TeacherManagementContext,\n  type UpdateBoardInvitationInput,\n  type UpdateStandaloneBoardInput,\n} from "../../core/public";'''
          if text.count(old) != 1:
              raise SystemExit(f"management import anchor count={text.count(old)}")
          management.write_text(text.replace(old, new, 1))

          replacements = {
              "src/app/TeacherBoardsBootstrap.tsx": (
                  'from "../core/ports/standalone-board-management-repository";',
                  'from "../core/public";',
              ),
              "src/app/TeacherBoardsWorkspace.tsx": (
                  'from "../core/ports/standalone-board-management-repository";',
                  'from "../core/public";',
              ),
          }
          for path, (old_value, new_value) in replacements.items():
              target = Path(path)
              value = target.read_text()
              if value.count(old_value) != 1:
                  raise SystemExit(f"{path}: import anchor count={value.count(old_value)}")
              target.write_text(value.replace(old_value, new_value, 1))
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/core/public.ts src/adapters/board-http/management.ts src/app/TeacherBoardsBootstrap.tsx src/app/TeacherBoardsWorkspace.tsx
      - run: npm run architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/unit/adapters/board-http/management.test.ts
      - name: Commit boundary repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: route T2 through core public boundary"
          git push origin HEAD:agent/t2-teacher-board-workspace
