name: Apply ordered envelope v1.3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply ordered protocol source changes
        run: python .automation/apply-p0-v13.py
      - name: Generate board contract artifacts
        run: npm run board-contract:generate
      - name: Add clock-skew regression
        run: |
          cat > tests/unit/core/board/commands/timestamp-ordering.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import {
            actorId,
            commandId,
            createEmptyBoardDocument,
            documentId,
            reduceBoardDocument,
          } from "../../../../../src/core/public";

          describe("BoardCommand timestamp ordering", () => {
            it("accepts a command created by a client whose clock is behind", () => {
              const document = createEmptyBoardDocument({
                createdAt: "2026-08-05T08:00:00.000Z",
                id: documentId("document:clock-skew"),
                title: "Clock skew",
              });
              const future = reduceBoardDocument(document, {
                actorId: actorId("actor:fast-clock"),
                id: commandId("command:future-clock"),
                kind: "core.document.rename",
                timestamp: "2026-08-05T12:00:00.000Z",
                title: "Fast clock",
              });
              expect(future.ok).toBe(true);
              if (!future.ok) throw new Error(future.error.message);

              const past = reduceBoardDocument(future.document, {
                actorId: actorId("actor:slow-clock"),
                id: commandId("command:past-clock"),
                kind: "core.document.rename",
                timestamp: "2026-08-05T07:00:00.000Z",
                title: "Slow clock accepted",
              });

              expect(past).toMatchObject({
                document: {
                  title: "Slow clock accepted",
                  updatedAt: "2026-08-05T12:00:00.000Z",
                },
                ok: true,
              });
            });
          });
          EOF
      - run: npm run format
      - name: Remove temporary implementation files
        run: rm -f .automation/apply-p0-v13.py .github/workflows/automation-p0-v13.yml
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(sync): add ordered envelope v1.3"
          git push origin HEAD:feature/p0-ordered-envelope-v13
      - run: npm run board-contract:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run architecture
      - run: npm run build
