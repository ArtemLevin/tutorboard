name: T1 format

on:
  push:
    branches:
      - agent/t1-standalone-launch
    paths:
      - .github/workflows/t1-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/t1-standalone-launch
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/adapters/board-http/standalone.ts src/app/StandaloneBoardBootstrap.tsx src/app/SyncedApp.tsx tests/e2e/standalone-launch.spec.ts tests/unit/adapters/board-http/standalone.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/board-http/standalone.ts src/app/StandaloneBoardBootstrap.tsx src/app/SyncedApp.tsx tests/e2e/standalone-launch.spec.ts tests/unit/adapters/board-http/standalone.test.ts
          git commit -m "style: format T1 standalone launch"
          git push origin HEAD:agent/t1-standalone-launch
