name: Temporary 3D-4C panel hook fix

on:
  push:
    branches:
      - agent/3d-4c-generalized-sections

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix memo dependency boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/solid-3d/Solid3DEditorPanel.tsx')
          text = path.read_text()
          old = '''function visiblePoints(record: Solid3DRecord): readonly Solid3DPoint[] {\n  return record.points.filter((point) => !isSolidSectionHelperPoint(point));\n}\n'''
          new = '''function visiblePoints(points: readonly Solid3DPoint[]): readonly Solid3DPoint[] {\n  return points.filter((point) => !isSolidSectionHelperPoint(point));\n}\n'''
          if old not in text:
              raise SystemExit('visiblePoints helper marker missing')
          text = text.replace(old, new, 1)
          old_use = 'const points = useMemo(() => visiblePoints(record), [record.points]);'
          new_use = 'const points = useMemo(() => visiblePoints(record.points), [record.points]);'
          if old_use not in text:
              raise SystemExit('visiblePoints use marker missing')
          path.write_text(text.replace(old_use, new_use, 1))
          PY
      - run: npm run format
      - name: Commit hook fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(3d): stabilize constrained-section panel hooks"
          git push
