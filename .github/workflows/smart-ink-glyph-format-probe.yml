name: Temporary Smart Ink glyph formatting probe

on:
  pull_request:
    paths:
      - 'src/modules/smart-ink/v2/glyph-session.ts'
      - 'src/modules/smart-ink/v2/unified.ts'
      - 'tests/unit/modules/smart-ink-v2/glyph-session.test.ts'
      - 'tests/unit/modules/smart-ink-v2/unified.test.ts'
      - '.github/workflows/smart-ink-glyph-format-probe.yml'

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show prettier format adjustments
        run: |
          npx prettier --write \
            src/modules/smart-ink/v2/glyph-session.ts \
            src/modules/smart-ink/v2/unified.ts \
            tests/unit/modules/smart-ink-v2/glyph-session.test.ts \
            tests/unit/modules/smart-ink-v2/unified.test.ts
          git diff -- src/modules/smart-ink/v2/glyph-session.ts src/modules/smart-ink/v2/unified.ts tests/unit/modules/smart-ink-v2/glyph-session.test.ts tests/unit/modules/smart-ink-v2/unified.test.ts
