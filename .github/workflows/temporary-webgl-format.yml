name: Temporary WebGL formatting
on:
  push:
    branches: [fix/3d-webgl-lifecycle-hardening-20261021]
    paths:
      - ".github/workflows/temporary-webgl-format.yml"
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed code
        run: |
          npx prettier --write src/adapters/solid-3d-three/Solid3DViewport.tsx src/adapters/solid-3d-three/Solid3DViewport.test.tsx
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/adapters/solid-3d-three/Solid3DViewport.tsx src/adapters/solid-3d-three/Solid3DViewport.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format WebGL lifecycle follow-up"
            git push origin HEAD:refs/heads/fix/3d-webgl-lifecycle-hardening-20261021
          fi
