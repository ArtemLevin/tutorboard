name: Apply canvas mode gestures

on:
  push:
    branches:
      - feature/canvas-mode-gestures

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/canvas-mode-gestures
          fetch-depth: 0

      - name: Detect patch payload
        id: patch
        run: |
          if [ -f .automation/apply-canvas-mode-gestures.mjs ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.patch.outputs.needed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.patch.outputs.needed == 'true'
        run: npm ci

      - name: Apply implementation
        if: steps.patch.outputs.needed == 'true'
        run: node .automation/apply-canvas-mode-gestures.mjs

      - name: Format and validate
        if: steps.patch.outputs.needed == 'true'
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Run focused browser tests
        if: steps.patch.outputs.needed == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --project=chromium tests/e2e/canvas-mode-gestures.spec.ts tests/e2e/canvas-context-menu.spec.ts tests/e2e/object-settings-right-double-click.spec.ts

      - name: Publish implementation
        if: steps.patch.outputs.needed == 'true'
        run: |
          rm -rf .automation
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(canvas): add quick mode gestures and selection copy menu'
          git push origin HEAD:feature/canvas-mode-gestures
