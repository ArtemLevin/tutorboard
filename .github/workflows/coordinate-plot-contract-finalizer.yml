name: Coordinate plot contract finalizer

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: coordinate-plot-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/coordinate-plot-domain-model'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finalize and verify Board contract
        run: |
          node scripts/finalize-coordinate-plot-contract.mjs
          npm run board-contract:generate
          npm run format
          npm run board-contract:check
          npm run lint
          npm run typecheck

      - name: Commit clean contract artifacts
        run: |
          rm -f \
            .github/workflows/coordinate-plot-contract-finalizer.yml \
            scripts/finalize-coordinate-plot-contract.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: synchronize BoardDocument 1.1 contract fixtures"
          git push
