name: Run minimal board chrome patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: run-minimal-board-chrome-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feature/minimal-board-chrome'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: feature/minimal-board-chrome
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Decode verified patcher
        run: |
          cat scripts/minimal-board-chrome-patcher/part-*.b64 > /tmp/minimal-board-chrome-patcher.b64
          test "$(sha256sum /tmp/minimal-board-chrome-patcher.b64 | cut -d' ' -f1)" = \
            "6a2c47b2d69b9230692be889733d571e44415655fd13a5e898421434bd9d186c"
          base64 --decode /tmp/minimal-board-chrome-patcher.b64 \
            | gzip --decompress \
            > /tmp/minimal-board-chrome-patcher.mjs
          test "$(sha256sum /tmp/minimal-board-chrome-patcher.mjs | cut -d' ' -f1)" = \
            "277f66900837eba0a17e97aea5c860d1e4998490266523e0727ec4068fa0d532"
          node --check /tmp/minimal-board-chrome-patcher.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Apply and format implementation
        run: |
          node /tmp/minimal-board-chrome-patcher.mjs
          rm -rf \
            .agent/minimal-board-chrome.trigger \
            .github/workflows/apply-minimal-board-chrome.yml \
            .github/workflows/kick-minimal-board-chrome.yml \
            scripts/minimal-board-chrome-patcher \
            scripts/minimal-board-chrome-patcher.mjs.gz.b64
          npm run format

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: introduce minimal board chrome"
          git push origin HEAD:feature/minimal-board-chrome
