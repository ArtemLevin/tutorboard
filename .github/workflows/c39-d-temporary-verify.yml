name: C39-D temporary formatter and focused checks
on:
  push:
    branches: [perf/c3-9-d-viewport-validated-fast-path]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format modified sources and export blobs
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/core/board/commands/reducer.ts tests/performance/c39-viewport-command-cost.test.ts tests/unit/core/c39-viewport-fast-path.test.ts
          for file in src/core/board/commands/reducer.ts tests/performance/c39-viewport-command-cost.test.ts tests/unit/core/c39-viewport-fast-path.test.ts; do
            printf 'C39DFMT:%s:' "$file"
            base64 --wrap=0 "$file"
            printf '\n'
          done
      - name: Run focused unit regressions
        run: npx vitest run tests/unit/core/c39-viewport-fast-path.test.ts tests/unit/core/reducer.test.ts
      - name: Run focused performance paired comparison
        run: npm run performance -- tests/performance/c39-viewport-command-cost.test.ts
      - name: Typecheck
        run: npm run typecheck
