name: Temporary cold cache formatting

on:
  pull_request:
    paths:
      - .github/workflows/c39-cold-cache-temporary-formatter.yml

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format exact changed code
        run: |
          set -euo pipefail
          for path in \
            src/adapters/canvas-konva/BoardStage.tsx \
            src/adapters/canvas-konva/board-frame-trace.ts \
            tests/e2e/c39-large-board-profile.spec.ts \
            scripts/c39/summarize-cold-cache.mjs \
            tests/node/c39-cold-cache-summary.test.mjs \
            .github/workflows/c39-cold-ink-cache-ab.yml; do
            npx prettier --write "$path"
            printf 'C39COLDPRETTIER:%s:' "$path"
            base64 -w0 "$path"
            printf '\n'
          done
