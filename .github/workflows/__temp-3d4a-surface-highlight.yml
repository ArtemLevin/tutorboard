name: Temporary 3D-4A surface highlight wiring

on:
  push:
    branches:
      - agent/3d-4a-persistent-transform
  pull_request:

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Wire analytic surface highlight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/solid-3d/Solid3DEditorPanel.tsx')
          text = path.read_text()
          highlight = '              highlightedSurfaceId={hoveredSurfaceId}\n'
          if highlight not in text:
              marker = '              highlightedElement={highlightedElement}\n'
              if marker not in text:
                  raise SystemExit('viewport highlight marker missing')
              text = text.replace(marker, marker + highlight, 1)
          path.write_text(text)
          PY
      - run: npm run format
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/solid-3d/Solid3DEditorPanel.tsx
          git commit -m "feat(3d): highlight hovered analytic surfaces"
          git push
