name: Roadmap Docs Update

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: roadmap-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    if: github.event.pull_request.head.ref == 'docs/roadmap-after-2.8.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v7
        with:
          ref: docs/roadmap-after-2.8.1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Update roadmap documentation
        run: node scripts/update-roadmap-docs.mjs

      - name: Format documentation
        run: npx prettier --write PLAN.md README.md

      - name: Verify documentation and repository gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run architecture

      - name: Commit documentation
        run: |
          if git diff --quiet -- PLAN.md README.md; then
            echo "Roadmap documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md README.md
          git commit -m "docs: align TutorBoard roadmap with GeometryOS dependencies"
          git push origin HEAD:docs/roadmap-after-2.8.1
