name: Temporary 3D-4B gizmo synchronization

on:
  push:
    branches:
      - agent/3d-4b-construction-studio

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Copy validated 4A interaction layer
        run: |
          git fetch origin agent/3d-4a-persistent-transform
          for path in \
            src/adapters/solid-3d-three/rotation-gizmo.ts \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/app/solid-3d/Solid3DEditorPanel.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.tsx \
            src/core/solid-3d/model-transform.ts \
            tests/unit/adapters/solid-3d-three/rotation-gizmo.test.ts \
            src/app/solid-3d/Solid3DOrientationEditor.test.tsx \
            tests/unit/core/solid-3d/model-transform.test.ts \
            tests/unit/modules/solid-3d/board-projection-rotation.test.ts; do
              git show origin/agent/3d-4a-persistent-transform:$path > $path
          done
      - run: npm run format
      - name: Commit synchronization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(3d): inherit final transactional rotation gizmo"
          git push
