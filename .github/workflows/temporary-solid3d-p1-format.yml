name: Temporary 3D P1 source formatting
on:
  push:
    branches: [fix/solid3d-tool-isolation-reconstruction-20261021]
    paths:
      - ".github/workflows/temporary-solid3d-p1-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply project formatter
        run: |
          npx prettier --write src/app/solid-3d/Solid3DEditorPanel.tsx src/app/solid-3d/Solid3DEditorPanel.test.tsx src/app/solid-3d/Solid3DConstructionEditor.tsx src/app/solid-3d/Solid3DConstructionEditor.test.tsx src/core/solid-3d/construction.ts tests/unit/core/solid-3d/construction.test.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/solid-3d/Solid3DEditorPanel.tsx src/app/solid-3d/Solid3DEditorPanel.test.tsx src/app/solid-3d/Solid3DConstructionEditor.tsx src/app/solid-3d/Solid3DConstructionEditor.test.tsx src/core/solid-3d/construction.ts tests/unit/core/solid-3d/construction.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format tool isolation and reconstruction fixes"
            git push origin HEAD:refs/heads/fix/solid3d-tool-isolation-reconstruction-20261021
          fi
