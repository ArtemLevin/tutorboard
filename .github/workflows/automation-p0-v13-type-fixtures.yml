name: Fix ordered envelope type fixtures

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Update ordered test types and remove accidental export
        run: |
          python - <<'PY'
          from pathlib import Path

          public = Path('src/core/public.ts')
          text = public.read_text(encoding='utf-8')
          marker = '\nexport {\n  mathInkRequestId,'
          index = text.find(marker)
          if index >= 0:
              text = text[:index] + '\n'
          public.write_text(text, encoding='utf-8')

          http = Path('tests/unit/adapters/board-http/client.test.ts')
          text = http.read_text(encoding='utf-8')
          text = text.replace('  type BoardCommandEnvelope,', '  type OrderedBoardCommandEnvelope,')
          text = text.replace('const envelope: BoardCommandEnvelope = {', 'const envelope: OrderedBoardCommandEnvelope = {')
          old_command = '''  commands: [\n    {\n      actorId: actorId("user:tutor"),\n      id: commandId("command:rename"),\n      kind: "core.document.rename",\n      timestamp: "2026-07-28T18:00:00.000Z",\n      title: "Synced",\n    },\n  ],'''
          new_command = '''  commands: [\n    {\n      command: {\n        actorId: actorId("user:tutor"),\n        id: commandId("command:rename"),\n        kind: "core.document.rename",\n        timestamp: "2026-07-28T18:00:00.000Z",\n        title: "Synced",\n      },\n      order: { baseRevisionAtCreation: 0, lamport: 1 },\n    },\n  ],'''
          if old_command not in text:
              raise SystemExit('HTTP envelope fixture missing')
          text = text.replace(old_command, new_command)
          text = text.replace('  schemaVersion: "1.2",', '  schemaVersion: "1.3",', 1)
          old_remote_map = '''                commands: envelope.commands.map((command) => ({\n                  ...command,\n                  actorId: "user:other",\n                })),'''
          new_remote_map = '''                commands: envelope.commands.map((item) => ({\n                  ...item,\n                  command: { ...item.command, actorId: "user:other" },\n                })),'''
          if old_remote_map not in text:
              raise SystemExit('HTTP remote map fixture missing')
          text = text.replace(old_remote_map, new_remote_map)
          old_malformed = '''                commands: [\n                  {\n                    actorId: "user:other",\n                    id: "command:malformed",\n                    kind: "core.document.rename",\n                    timestamp: "2026-07-28T18:00:00.000Z",\n                  },\n                ],\n                idempotencyKey: "remote:malformed",'''
          new_malformed = '''                commands: [\n                  {\n                    command: {\n                      actorId: "user:other",\n                      id: "command:malformed",\n                      kind: "core.document.rename",\n                      timestamp: "2026-07-28T18:00:00.000Z",\n                    },\n                    order: { baseRevisionAtCreation: 0, lamport: 1 },\n                  },\n                ],\n                idempotencyKey: "remote:malformed",'''
          if old_malformed not in text:
              raise SystemExit('HTTP malformed fixture missing')
          http.write_text(text.replace(old_malformed, new_malformed), encoding='utf-8')

          sync = Path('tests/unit/modules/server-sync/sync.test.ts')
          text = sync.read_text(encoding='utf-8')
          text = text.replace('  type BoardCommandEnvelope,\n', '')
          text = text.replace(
              '  type PendingBoardCommand,\n  type PendingBoardCommandQueue,\n',
              '  type OrderedBoardCommandEnvelope,\n  type PendingBoardCommand,\n  type PendingBoardCommandOrderingInput,\n  type PendingBoardCommandQueue,\n',
          )
          text = text.replace(
              '    command: BoardCommand,\n  ): Promise<PendingBoardCommand> {',
              '    command: BoardCommand,\n    ordering: PendingBoardCommandOrderingInput = {},\n  ): Promise<PendingBoardCommand> {',
              1,
          )
          text = text.replace(
              '      idempotencyKey,\n      sequence: (this.items.at(-1)?.sequence ?? 0) + 1,',
              '      idempotencyKey,\n      order: {\n        baseRevisionAtCreation: ordering.baseRevisionAtCreation ?? 0,\n        lamport:\n          Math.max(\n            ordering.observedLamport ?? 0,\n            ordering.baseRevisionAtCreation ?? 0,\n            this.items.at(-1)?.order.lamport ?? 0,\n          ) + 1,\n      },\n      sequence: (this.items.at(-1)?.sequence ?? 0) + 1,',
              1,
          )
          text = text.replace(
              '  readonly pushed: BoardCommandEnvelope[] = [];',
              '  readonly pushed: OrderedBoardCommandEnvelope[] = [];',
          )
          text = text.replace(
              '  push(envelope: BoardCommandEnvelope): Promise<PushBoardCommandsResult> {',
              '  push(\n    envelope: OrderedBoardCommandEnvelope,\n  ): Promise<PushBoardCommandsResult> {',
          )
          text = text.replace(
              'expect(repository.pushed[1]?.commands[0]?.timestamp).toBe(\n      "2026-07-28T18:03:00.000Z",\n    );',
              'expect(repository.pushed[1]?.commands[0]?.command.timestamp).toBe(\n      "2026-07-28T18:01:00.000Z",\n    );',
          )
          sync.write_text(text, encoding='utf-8')
          PY
      - run: npm run format
      - name: Remove temporary workflow
        run: rm -f .github/workflows/automation-p0-v13-type-fixtures.yml
      - name: Commit type fixture updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(sync): complete ordered envelope type migration"
          git push origin HEAD:feature/p0-ordered-envelope-v13
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run architecture
      - run: npm run build
