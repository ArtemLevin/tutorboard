name: Temporary frontend formatter

on:
  push:
    branches:
      - agent/media-m1-contract-activation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/tmp-format-media-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: format media contract activation"
          git push origin HEAD:agent/media-m1-contract-activation
