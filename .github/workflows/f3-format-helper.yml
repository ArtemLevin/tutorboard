name: F3 temporary formatting helper
on:
  push:
    branches:
      - feat/f3-upload-before-command

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed files and emit checksum-labeled result
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/app/board-chrome/BoardToolDock.tsx
            src/app/board/controllers/useBoardMediaController.ts
            src/app/configuration/environment.test.ts
            src/app/media-asset-import.test.ts
            src/app/media-asset-import.ts
            src/app/media-upload-flow.test.tsx
            src/app/SyncedApp.tsx
          )
          npx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "F3_FORMAT_BASE64:${file}:$(base64 -w0 "${file}")"
          done
