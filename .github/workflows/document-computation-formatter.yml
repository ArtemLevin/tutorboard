name: Document computation formatter

on:
  push:
    branches:
      - perf/off-main-thread-document-computation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/adapters/board-document-worker/client.ts src/adapters/board-document-worker/worker.ts src/app/SyncedApp.tsx src/modules/server-sync/sync.ts tests/unit/adapters/board-document-worker/client.test.ts tests/unit/modules/server-sync/sync.test.ts tests/unit/modules/local-persistence/autosave.test.ts tests/unit/adapters/persistence-dexie/repository.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: apply document computation formatting"
          git push origin HEAD:perf/off-main-thread-document-computation
