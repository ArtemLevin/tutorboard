name: Apply minimal board chrome

on:
  push:
    branches:
      - feature/minimal-board-chrome

permissions:
  contents: write

concurrency:
  group: apply-minimal-board-chrome
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: feature/minimal-board-chrome
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Decode patcher
        run: |
          base64 --decode scripts/minimal-board-chrome-patcher.mjs.gz.b64 \
            | gzip --decompress \
            > /tmp/minimal-board-chrome-patcher.mjs
          node --check /tmp/minimal-board-chrome-patcher.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Apply and format implementation
        run: |
          node /tmp/minimal-board-chrome-patcher.mjs
          rm -f \
            .github/workflows/apply-minimal-board-chrome.yml \
            .github/workflows/kick-minimal-board-chrome.yml \
            scripts/minimal-board-chrome-patcher.mjs.gz.b64
          npm run format

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: introduce minimal board chrome"
          git push origin HEAD:feature/minimal-board-chrome
