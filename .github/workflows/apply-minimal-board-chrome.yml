name: Apply minimal board chrome

on:
  push:
    branches:
      - feature/minimal-board-chrome

permissions:
  contents: write

concurrency:
  group: apply-minimal-board-chrome
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/minimal-board-chrome
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Decode implementation patch
        shell: bash
        run: |
          cat > /tmp/minimal-board-chrome.b64 <<'PATCH'

PATCH
          base64 --decode /tmp/minimal-board-chrome.b64 | gzip --decompress > /tmp/apply-minimal-board-chrome.mjs
          node --check /tmp/apply-minimal-board-chrome.mjs
      - name: Install dependencies
        run: npm ci
      - name: Apply implementation
        run: node /tmp/apply-minimal-board-chrome.mjs
      - name: Format
        run: npm run format
      - name: Verify source
        run: |
          npm run typecheck
          npm run test
          npm run architecture
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: introduce minimal board chrome"
          git push origin HEAD:feature/minimal-board-chrome
