name: Temporary 3D fallback formatting
on:
  push:
    branches: [fix/solid-3d-review-2026-10-21]
    paths: [.github/workflows/temporary-solid-3d-guard-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/core/board/commands/reducer.ts tests/unit/core/solid-3d/project-section-stale.test.ts tests/e2e/solid-3d-fallback.spec.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/board/commands/reducer.ts tests/unit/core/solid-3d/project-section-stale.test.ts tests/e2e/solid-3d-fallback.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format projection guard and regression"
            git push origin HEAD:refs/heads/fix/solid-3d-review-2026-10-21
          fi
