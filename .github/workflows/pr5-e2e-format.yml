name: Format formula recognition E2E

on:
  push:
    branches:
      - feat/configurable-formula-recognition

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/configurable-formula-recognition
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/math-ink-recognition-production.spec.ts
      - run: rm .github/workflows/pr5-e2e-format.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "chore: format formula recognition E2E"
          git push origin HEAD:feat/configurable-formula-recognition
