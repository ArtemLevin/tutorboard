name: Apply object settings browser test patch

on:
  push:
    branches:
      - feature/object-settings-right-double-click

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/object-settings-right-double-click
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update browser scenarios
        run: node scripts/apply-object-settings-e2e.mjs

      - name: Format browser scenarios
        run: npx prettier --write "tests/e2e/*.ts"

      - name: Verify test discovery and TypeScript
        run: |
          npm run typecheck
          npx playwright test --list
          npm run lint

      - name: Commit product-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          git rm .github/workflows/apply-object-settings-e2e.yml scripts/apply-object-settings-e2e.mjs
          git commit -m "test: cover right double-click settings entry"
          git push origin HEAD:feature/object-settings-right-double-click
