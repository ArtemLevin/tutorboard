name: Temporary F3.2.3 unit test formatter
on:
  push:
    branches: [feat/f3-2-3-asset-export-recovery]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write tests/unit/modules/document-transfer/media-snapshot.test.ts
          echo "F323_UNIT:$(base64 -w0 tests/unit/modules/document-transfer/media-snapshot.test.ts)"
