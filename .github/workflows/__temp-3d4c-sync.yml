name: Temporary 3D-4C base synchronization

on:
  push:
    branches:
      - agent/3d-4c-generalized-sections

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Synchronize stabilized 4B files
        run: |
          git fetch origin agent/3d-4b-construction-studio
          for path in \
            src/adapters/solid-3d-three/Solid3DViewport.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.tsx \
            src/app/solid-3d/Solid3DOrientationEditor.test.tsx \
            src/app/solid-3d/Solid3DConstructionEditor.tsx \
            src/app/solid-3d/Solid3DConstructionEditor.test.tsx \
            src/app/solid-3d/Solid3DParameterEditor.tsx \
            src/core/solid-3d/model-transform.ts \
            src/core/solid-3d/construction.ts \
            src/core/board/validation/schema.ts \
            src/modules/text-shape-placement/parametric-3d.ts \
            src/modules/text-shape-placement/public.ts \
            tests/unit/core/solid-3d/model-transform.test.ts \
            tests/unit/core/solid-3d/construction.test.ts \
            tests/unit/core/solid-3d/semantic-solid-persistence.test.ts \
            tests/unit/modules/solid-3d/board-projection-rotation.test.ts; do
              git show origin/agent/3d-4b-construction-studio:$path > $path
          done
      - name: Sanitize point selection after topology changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/solid-3d/Solid3DEditorPanel.tsx')
          text = path.read_text()
          text = text.replace(
              '  const points = visiblePoints(record);',
              '  const points = useMemo(() => visiblePoints(record), [record.points]);',
              1,
          )
          marker = '''  const closeButtonRef = useRef<HTMLButtonElement>(null);\n\n  const selectedTuple = useMemo(\n'''
          replacement = '''  const closeButtonRef = useRef<HTMLButtonElement>(null);\n  const sanitizedSelectedPointIds = useMemo(\n    () =>\n      selectedPointIds.filter((id) => points.some((point) => point.id === id)),\n    [points, selectedPointIds],\n  );\n\n  const selectedTuple = useMemo(\n'''
          if marker not in text:
              raise SystemExit('selection marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '      selectedPointIds.length === 3',
              '      sanitizedSelectedPointIds.length === 3',
              1,
          )
          text = text.replace('            selectedPointIds[0]!,', '            sanitizedSelectedPointIds[0]!,', 1)
          text = text.replace('            selectedPointIds[1]!,', '            sanitizedSelectedPointIds[1]!,', 1)
          text = text.replace('            selectedPointIds[2]!,', '            sanitizedSelectedPointIds[2]!,', 1)
          text = text.replace(
              '    [selectedPointIds],\n  );',
              '    [sanitizedSelectedPointIds],\n  );',
              1,
          )
          text = text.replace(
              '      const nextSelection = [...selectedPointIds.slice(-2), point.id];',
              '      const nextSelection = [...sanitizedSelectedPointIds.slice(-2), point.id];',
              1,
          )
          text = text.replace(
              '    [onRecordChange, points, readOnly, record, selectedPointIds],',
              '    [onRecordChange, points, readOnly, record, sanitizedSelectedPointIds],',
              1,
          )
          text = text.replace(
              '<strong>{selectedPointIds.length} / 3</strong>',
              '<strong>{sanitizedSelectedPointIds.length} / 3</strong>',
              1,
          )
          text = text.replace(
              'checked={selectedPointIds.includes(point.id)}',
              'checked={sanitizedSelectedPointIds.includes(point.id)}',
          )
          text = text.replace(
              '!selectedPointIds.includes(point.id) &&\n                        selectedPointIds.length >= 3',
              '!sanitizedSelectedPointIds.includes(point.id) &&\n                        sanitizedSelectedPointIds.length >= 3',
          )
          builder = '''            <Solid3DSectionConstraintBuilder\n              onRecordChange={onRecordChange}\n'''
          builder_replacement = '''            <Solid3DSectionConstraintBuilder\n              key={`${JSON.stringify(record.definition)}:${points\n                .map(({ id }) => id)\n                .join(",")}`}\n              onRecordChange={onRecordChange}\n'''
          if builder not in text:
              raise SystemExit('constraint builder marker not found')
          text = text.replace(builder, builder_replacement, 1)
          path.write_text(text)
          PY
      - run: npm run format
      - name: Commit synchronization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(3d): synchronize stacked base and sanitize section selection"
          git push
