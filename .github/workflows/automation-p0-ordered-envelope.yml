name: Apply P0 ordered envelope v1.3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply ordered protocol implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker missing in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Queue exposes durable ordering metadata and preserves it during rebase.
          replace(
              'src/adapters/persistence-dexie/sync-queue.ts',
              '  type PendingBoardCommand,\n  type PendingBoardCommandQueue,\n',
              '  type PendingBoardCommand,\n  type PendingBoardCommandOrderingInput,\n  type PendingBoardCommandQueue,\n',
          )
          replace(
              'src/adapters/persistence-dexie/sync-queue.ts',
              '    idempotencyKey: stored.idempotencyKey,\n    sequence: stored.sequence,',
              '    idempotencyKey: stored.idempotencyKey,\n    order: {\n      baseRevisionAtCreation: stored.baseRevisionAtCreation,\n      lamport: stored.lamport,\n    },\n    sequence: stored.sequence,',
          )
          replace(
              'src/adapters/persistence-dexie/sync-queue.ts',
              '    ordering: {\n      readonly baseRevisionAtCreation?: number;\n      readonly observedLamport?: number;\n    } = {},',
              '    ordering: PendingBoardCommandOrderingInput = {},',
          )
          replace(
              'src/adapters/persistence-dexie/sync-queue.ts',
              '              baseRevisionAtCreation:\n                previous?.baseRevisionAtCreation ?? 0,',
              '              baseRevisionAtCreation:\n                previous?.baseRevisionAtCreation ??\n                item.order.baseRevisionAtCreation,',
          )
          replace(
              'src/adapters/persistence-dexie/sync-queue.ts',
              '              lamport: previous?.lamport ?? item.sequence,',
              '              lamport: previous?.lamport ?? item.order.lamport,',
          )

          # Reducer timestamp is audit metadata. Keep document.updatedAt monotonic.
          reducer = Path('src/core/board/commands/reducer.ts')
          text = reducer.read_text(encoding='utf-8')
          text = text.replace('  | "command.stale-timestamp"\n', '')
          stale = '''\n  if (Date.parse(command.timestamp) < Date.parse(document.updatedAt)) {\n    return failure(\n      document,\n      "command.stale-timestamp",\n      "Command timestamp precedes the current document revision.",\n    );\n  }\n'''
          if stale not in text:
              raise SystemExit('stale timestamp validation missing')
          text = text.replace(stale, '')
          old_accept = '''function accept(\n  original: BoardDocument,\n  candidate: BoardDocument,\n): CommandResult {\n  const validation = validateBoardDocument(candidate);\n\n  if (!validation.valid) {\n    return failure(\n      original,\n      "command.invalid-result",\n      "Command result violates BoardDocument invariants.",\n    );\n  }\n\n  return { ok: true, document: candidate };\n}'''
          new_accept = '''function accept(\n  original: BoardDocument,\n  candidate: BoardDocument,\n): CommandResult {\n  const originalTime = Date.parse(original.updatedAt);\n  const candidateTime = Date.parse(candidate.updatedAt);\n  const normalized =\n    Number.isNaN(originalTime) ||\n    Number.isNaN(candidateTime) ||\n    candidateTime >= originalTime\n      ? candidate\n      : { ...candidate, updatedAt: original.updatedAt };\n  const validation = validateBoardDocument(normalized);\n\n  if (!validation.valid) {\n    return failure(\n      original,\n      "command.invalid-result",\n      "Command result violates BoardDocument invariants.",\n    );\n  }\n\n  return { ok: true, document: normalized };\n}'''
          if old_accept not in text:
              raise SystemExit('accept function marker missing')
          reducer.write_text(text.replace(old_accept, new_accept), encoding='utf-8')

          # Sync engine reads legacy/ordered envelopes and writes ordered v1.3.
          sync = Path('src/modules/server-sync/sync.ts')
          text = sync.read_text(encoding='utf-8')
          text = text.replace('  type PendingBoardCommandQueue,\n', '  type PendingBoardCommandQueue,\n  type OrderedBoardCommand,\n')
          start = text.index('function nextTimestamp(')
          end = text.index('\nfunction applyCommand(', start)
          text = text[:start] + '''function rebaseCommand(\n  document: BoardDocument,\n  command: BoardCommand,\n): BoardCommand {\n  const result = reduceBoardDocument(document, command);\n  if (!result.ok) {\n    throw new SyncRecoveryError(\n      "board.sync.rebase-failed",\n      `Локальная команда ${command.id} конфликтует с удалёнными изменениями: ${result.error.message}`,\n    );\n  }\n  return command;\n}\n\nfunction commandsFromBatch(\n  batch: ServerBoardCommandBatch,\n): readonly BoardCommand[] {\n  return batch.envelope.schemaVersion === "1.3"\n    ? batch.envelope.commands.map(({ command }) => command)\n    : batch.envelope.commands;\n}\n\nfunction orderedFromPending(item: PendingBoardCommand): OrderedBoardCommand {\n  return { command: item.command, order: item.order };\n}\n''' + text[end:]
          text = text.replace('    for (const command of batch.envelope.commands) {', '    for (const command of commandsFromBatch(batch)) {')
          text = text.replace('  pending: readonly PendingBoardCommand[],\n  now: () => string,\n', '  pending: readonly PendingBoardCommand[],\n')
          text = text.replace('    const command = rebaseCommand(document, item.command, now());', '    const command = rebaseCommand(document, item.command);')
          text = text.replace('      const replayed = replayPending(head, this.#pending, this.#now);', '      const replayed = replayPending(head, this.#pending);')
          text = text.replace('        const replayed = replayPending(cached, this.#pending, this.#now);', '        const replayed = replayPending(cached, this.#pending);')
          text = text.replace('        const replayed = replayPending(\n          this.#confirmed,\n          this.#pending,\n          this.#now,\n        );', '        const replayed = replayPending(this.#confirmed, this.#pending);')
          text = text.replace('      const replayed = replayPending(this.#confirmed, this.#pending, this.#now);', '      const replayed = replayPending(this.#confirmed, this.#pending);')
          text = text.replace('          const command = rebaseCommand(document, candidate, this.#now());', '          const command = rebaseCommand(document, candidate);')
          text = text.replace('          command,\n        );', '          command,\n          { baseRevisionAtCreation: this.#confirmed.revision },\n        );', 1)
          # second enqueue in apply()
          marker = '''            command,\n          );\n          this.#pending = [...this.#pending, queued];'''
          repl = '''            command,\n            { baseRevisionAtCreation: this.#confirmed.revision },\n          );\n          this.#pending = [...this.#pending, queued];'''
          if marker not in text:
              raise SystemExit('second enqueue marker missing')
          text = text.replace(marker, repl, 1)
          text = text.replace('            commands: [first.command],', '            commands: [orderedFromPending(first)],')
          text = text.replace('            schemaVersion: "1.2",', '            schemaVersion: "1.3",')
          old_duplicate = '''      if (\n        accepted.envelope.commands.length !== 1 ||\n        JSON.stringify(accepted.envelope.commands[0]) !==\n          JSON.stringify(item.command)\n      ) {'''
          new_duplicate = '''      const acceptedCommands = commandsFromBatch(accepted);\n      if (\n        acceptedCommands.length !== 1 ||\n        JSON.stringify(acceptedCommands[0]) !== JSON.stringify(item.command)\n      ) {'''
          if old_duplicate not in text:
              raise SystemExit('duplicate marker missing')
          text = text.replace(old_duplicate, new_duplicate)
          sync.write_text(text, encoding='utf-8')

          # HTTP tolerant reader for legacy and ordered envelopes.
          client = Path('src/adapters/board-http/client.ts')
          text = client.read_text(encoding='utf-8')
          old_schema = '''const envelopeSchema = z\n  .object({\n    actorId: identifierSchema,\n    baseRevision: z.number().int().nonnegative(),\n    commands: z.array(z.unknown()).min(1).max(100),\n    documentId: identifierSchema,\n    expectedDocumentSha256: sha256Schema,\n    idempotencyKey: z.string().min(1).max(128),\n    schemaVersion: z.literal("1.2"),\n  })\n  .strict();'''
          new_schema = '''const envelopeBase = {\n  actorId: identifierSchema,\n  baseRevision: z.number().int().nonnegative(),\n  documentId: identifierSchema,\n  expectedDocumentSha256: sha256Schema,\n  idempotencyKey: z.string().min(1).max(128),\n} as const;\nconst commandOrderSchema = z\n  .object({\n    baseRevisionAtCreation: z.number().int().nonnegative(),\n    lamport: z.number().int().positive(),\n  })\n  .strict();\nconst legacyEnvelopeSchema = z\n  .object({\n    ...envelopeBase,\n    commands: z.array(z.unknown()).min(1).max(100),\n    schemaVersion: z.enum(["1.0", "1.2"]),\n  })\n  .strict();\nconst orderedEnvelopeSchema = z\n  .object({\n    ...envelopeBase,\n    commands: z\n      .array(\n        z\n          .object({ command: z.unknown(), order: commandOrderSchema })\n          .strict(),\n      )\n      .min(1)\n      .max(100),\n    schemaVersion: z.literal("1.3"),\n  })\n  .strict();\nconst envelopeSchema = z.discriminatedUnion("schemaVersion", [\n  legacyEnvelopeSchema,\n  orderedEnvelopeSchema,\n]);'''
          if old_schema not in text:
              raise SystemExit('HTTP envelope schema marker missing')
          text = text.replace(old_schema, new_schema)
          old_return = '''  return {\n    ...parsed.data,\n    envelope: {\n      ...parsed.data.envelope,\n      actorId: actorId(parsed.data.envelope.actorId),\n      commands: parsed.data.envelope.commands.map(parseServerCommand),\n      documentId: documentId(parsed.data.envelope.documentId),\n    },\n  };'''
          new_return = '''  const envelope = parsed.data.envelope;\n  return {\n    ...parsed.data,\n    envelope:\n      envelope.schemaVersion === "1.3"\n        ? {\n            ...envelope,\n            actorId: actorId(envelope.actorId),\n            commands: envelope.commands.map(({ command, order }) => ({\n              command: parseServerCommand(command),\n              order,\n            })),\n            documentId: documentId(envelope.documentId),\n          }\n        : {\n            ...envelope,\n            actorId: actorId(envelope.actorId),\n            commands: envelope.commands.map(parseServerCommand),\n            documentId: documentId(envelope.documentId),\n          },\n  };'''
          if old_return not in text:
              raise SystemExit('HTTP parseBatch return marker missing')
          client.write_text(text.replace(old_return, new_return), encoding='utf-8')

          # Board contract v1.3.
          contract = Path('scripts/board-contract-lib.mjs')
          text = contract.read_text(encoding='utf-8')
          text = text.replace('const nonNegativeInteger = { minimum: 0, type: "integer" };', 'const nonNegativeInteger = { minimum: 0, type: "integer" };\nconst positiveInteger = { minimum: 1, type: "integer" };')
          text = text.replace('const commandDefinitions = {\n  ...boardDefinitions,\n  ...commands,\n  BoardCommand: boardCommand,\n};', 'const commandOrder = strictObject({\n  baseRevisionAtCreation: nonNegativeInteger,\n  lamport: positiveInteger,\n});\nconst orderedBoardCommand = strictObject({\n  command: reference("BoardCommand"),\n  order: reference("BoardCommandOrder"),\n});\nconst commandDefinitions = {\n  ...boardDefinitions,\n  ...commands,\n  BoardCommand: boardCommand,\n  BoardCommandOrder: commandOrder,\n  OrderedBoardCommand: orderedBoardCommand,\n};')
          text = text.replace('    "BoardCommandEnvelope 1.1",', '    "BoardCommandEnvelope 1.3",')
          text = text.replace('      commands: array(reference("BoardCommand"), {', '      commands: array(reference("OrderedBoardCommand"), {', 1)
          text = text.replace('      schemaVersion: { const: "1.2" },\n    }),\n    commandDefinitions,', '      schemaVersion: { const: "1.3" },\n    }),\n    commandDefinitions,', 1)
          text = text.replace('- `BoardCommandEnvelope 1.1` carries one atomic, idempotent command batch', '- `BoardCommandEnvelope 1.3` carries one atomic, idempotent ordered command batch')
          text = text.replace('      commands: [\n        {\n          actorId:', '      commands: [\n        {\n          command: {\n            actorId:', 1)
          text = text.replace('          title: "Linear functions: lesson summary",\n        },\n        {\n          actorId:', '            title: "Linear functions: lesson summary",\n          },\n          order: { baseRevisionAtCreation: 7, lamport: 8 },\n        },\n        {\n          command: {\n            actorId:', 1)
          text = text.replace('          timestamp: "2026-07-28T17:00:01.000Z",\n        },\n      ],', '            timestamp: "2026-07-28T17:00:01.000Z",\n          },\n          order: { baseRevisionAtCreation: 7, lamport: 9 },\n        },\n      ],', 1)
          text = text.replace('      schemaVersion: "1.2",\n    },\n    "fixtures/board-document.json"', '      schemaVersion: "1.3",\n    },\n    "fixtures/board-document.json"', 1)
          text = text.replace('      boardCommandEnvelope: "1.0",', '      boardCommandEnvelope: "1.3",')
          contract.write_text(text, encoding='utf-8')

          # Update ADR conflict policy.
          adr = Path('docs/adr/ADR-011-server-board-sync.md')
          text = adr.read_text(encoding='utf-8')
          text = text.replace('Remote batches are applied first. Pending local commands are then replayed in\ntheir durable order. A stale timestamp is moved to the first millisecond after\nthe confirmed document timestamp; other reducer conflicts stop automatic\nrebase and open the recovery UI.', 'Remote batches are applied first in server-revision order. Pending local\ncommands are then replayed in durable sequence order. Each queued command keeps\nits Lamport value and base revision observed at creation. Wall-clock timestamps\nserve audit and presentation only; reducer conflicts stop automatic rebase and\nopen the recovery UI.')
          adr.write_text(text, encoding='utf-8')
          PY
      - name: Generate board contract artifacts
        run: npm run board-contract:generate
      - name: Add clock-skew and ordered-envelope tests
        run: |
          cat > tests/unit/core/board/commands/timestamp-ordering.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import {
            actorId,
            commandId,
            createEmptyBoardDocument,
            documentId,
            reduceBoardDocument,
          } from "../../../../../src/core/public";

          describe("BoardCommand timestamp ordering", () => {
            it("accepts a valid command from a client whose clock is behind", () => {
              const document = createEmptyBoardDocument({
                createdAt: "2026-08-05T08:00:00.000Z",
                id: documentId("document:clock-skew"),
                title: "Clock skew",
              });
              const first = reduceBoardDocument(document, {
                actorId: actorId("actor:fast-clock"),
                id: commandId("command:future-clock"),
                kind: "core.document.rename",
                timestamp: "2026-08-05T12:00:00.000Z",
                title: "Fast clock",
              });
              expect(first.ok).toBe(true);
              if (!first.ok) throw new Error(first.error.message);

              const second = reduceBoardDocument(first.document, {
                actorId: actorId("actor:slow-clock"),
                id: commandId("command:past-clock"),
                kind: "core.document.rename",
                timestamp: "2026-08-05T07:00:00.000Z",
                title: "Slow clock accepted",
              });

              expect(second).toMatchObject({
                document: {
                  title: "Slow clock accepted",
                  updatedAt: "2026-08-05T12:00:00.000Z",
                },
                ok: true,
              });
            });
          });
          EOF
      - run: npm run format
      - name: Remove temporary workflow
        run: rm -f .github/workflows/automation-p0-ordered-envelope.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(sync): add ordered envelope v1.3"
          git push origin HEAD:feature/p0-ordered-envelope-v13
      - run: npm run board-contract:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run architecture
      - run: npm run build
