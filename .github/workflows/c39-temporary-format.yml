name: C39 temporary formatting export
on:
  push:
    branches:
      - perf/c3-9-a-representative-baseline
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format C39 test files and export resulting text
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write tests/fixtures/dense-board.ts tests/unit/core/c39-dense-board-fixture.test.ts tests/e2e/c39-large-board-profile.spec.ts
          for file in tests/fixtures/dense-board.ts tests/unit/core/c39-dense-board-fixture.test.ts tests/e2e/c39-large-board-profile.spec.ts; do
            printf 'C39FMT:%s:' "$file"
            base64 --wrap=0 "$file"
            printf '\n'
          done
