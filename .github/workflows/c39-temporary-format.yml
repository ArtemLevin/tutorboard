name: C39 temporary formatter

on:
  pull_request:
    paths:
      - .github/workflows/c39-temporary-format.yml
      - scripts/c39/compare-profiles.mjs
      - tests/node/c39-compare-profiles.test.mjs

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and emit exact source
        run: |
          set -euo pipefail
          npx prettier --write scripts/c39/compare-profiles.mjs tests/node/c39-compare-profiles.test.mjs
          printf 'C39FMT_SCRIPT='
          base64 -w0 scripts/c39/compare-profiles.mjs
          printf '\nC39FMT_TEST='
          base64 -w0 tests/node/c39-compare-profiles.test.mjs
          printf '\n'
