name: T0 lint fixer

on:
  push:
    branches:
      - agent/t0-frontend-security-prep

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/t0-frontend-security-prep
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted lint-safe rewrites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          queue = Path('src/adapters/persistence-dexie/sync-queue.ts')
          text = queue.read_text()
          old = '''  async setAccessScope(scope: BoardLocalAccessScope): Promise<number> {
    if (
      !cacheScopeSchema.safeParse(scope.cacheScopeId).success ||
      !accessEpochSchema.safeParse(scope.accessEpoch).success
    ) {
      throw new Error("Board access scope is invalid.");
    }
    this.#scope = { ...scope };
    return 0;
  }
'''
          new = '''  setAccessScope(scope: BoardLocalAccessScope): Promise<number> {
    if (
      !cacheScopeSchema.safeParse(scope.cacheScopeId).success ||
      !accessEpochSchema.safeParse(scope.accessEpoch).success
    ) {
      return Promise.reject(new Error("Board access scope is invalid."));
    }
    this.#scope = { ...scope };
    return Promise.resolve(0);
  }
'''
          if old not in text:
              raise SystemExit('setAccessScope target not found')
          text = text.replace(old, new, 1)
          old = '''            const context = current.success
              ? current.data
              : previous.success
                ? previous.data
                : legacy.success
                  ? legacy.data
                  : null;
            quarantined.push({
              actorId:
                current.success || previous.success
                  ? (context?.actorId ?? null)
                  : null,
              cacheScopeId: scope.cacheScopeId,
              capturedAt,
              commandSha256:
                current.success || previous.success
                  ? (context?.commandSha256 ?? null)
                  : null,
'''
          new = '''            const context = current.success
              ? current.data
              : previous.success
                ? previous.data
                : legacy.success
                  ? legacy.data
                  : null;
            const actorIdValue = current.success
              ? current.data.actorId
              : previous.success
                ? previous.data.actorId
                : null;
            const commandSha256Value = current.success
              ? current.data.commandSha256
              : previous.success
                ? previous.data.commandSha256
                : null;
            quarantined.push({
              actorId: actorIdValue,
              cacheScopeId: scope.cacheScopeId,
              capturedAt,
              commandSha256: commandSha256Value,
'''
          if old not in text:
              raise SystemExit('quarantine narrowing target not found')
          queue.write_text(text.replace(old, new, 1))

          controller = Path('src/app/board/controllers/useBoardDocumentController.ts')
          text = controller.read_text()
          text = text.replace(
              'import { useCallback, useEffect, useRef, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useRef, useState } from "react";',
              1,
          )
          old = '''  const effectiveMutationPolicy =
    mutationPolicy ??
    (readOnly
      ? ({ canWrite: false, reason: "missing-board-write" } as const)
      : writableBoardMutationPolicy);
'''
          new = '''  const effectiveMutationPolicy = useMemo(
    () =>
      mutationPolicy ??
      (readOnly
        ? ({ canWrite: false, reason: "missing-board-write" } as const)
        : writableBoardMutationPolicy),
    [mutationPolicy, readOnly],
  );
'''
          if old not in text:
              raise SystemExit('mutation policy target not found')
          controller.write_text(text.replace(old, new, 1))
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Apply safe ESLint fixes
        run: npm run lint -- --fix
      - name: Format repository
        run: npm run format
      - name: Verify lint
        run: npm run lint
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: satisfy T0 lint and hook invariants"
          git push origin HEAD:agent/t0-frontend-security-prep
