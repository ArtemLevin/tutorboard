name: T0 lint fixer

on:
  push:
    branches:
      - agent/t0-frontend-security-prep

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/t0-frontend-security-prep
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply targeted rewrites
        run: node scripts/t0-lint-fix.mjs
      - name: Apply safe ESLint fixes
        run: npm run lint -- --fix
      - name: Format repository
        run: npm run format
      - name: Verify lint
        run: npm run lint
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: satisfy T0 lint and hook invariants"
          git push origin HEAD:agent/t0-frontend-security-prep
