name: Apply Dexie crypto transaction fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-command-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/p0-command-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Keep the Dexie transaction alive during WebCrypto validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/adapters/persistence-dexie/sync-queue.ts')
          text = path.read_text(encoding='utf-8')
          old = '          const decoded = await decodePending(raw, expectedDocumentId);'
          new = '''          const decoded = await Dexie.waitFor(\n            decodePending(raw, expectedDocumentId),\n          );'''
          if old not in text:
              raise SystemExit('decodePending transaction call was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm run format
      - name: Remove temporary workflow
        run: rm -f .github/workflows/automation-dexie-wait-p0.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sync): preserve Dexie transaction during command hashing"
          git push origin HEAD:feature/p0-command-integrity
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run architecture
      - run: npm run build
