name: Handwritten function PR 3 ID fix

on:
  push:
    branches:
      - feat/handwritten-function-workflow

permissions:
  contents: write

concurrency:
  group: handwritten-function-pr3-id-fix
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-pr3-id-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/handwritten-function-workflow
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compact handwritten stroke object IDs
        run: |
          set +e
          node --input-type=module <<'NODE' > pr3-id-fix.log 2>&1
          import fs from "node:fs";
          const path = "src/app/App.tsx";
          let source = fs.readFileSync(path, "utf8");
          const replacements = [
            [
              `function handwrittenStrokeObjectId(
  sessionId: string,
  stroke: HandwrittenFunctionStroke,
  index: number,
): BoardObjectId {
  return boardObjectId(
    \`object:handwritten-function:\${sessionId}:\${index}:\${stroke.id}\`,
  );
}`,
              `function handwrittenStrokeObjectId(
  sessionId: string,
  index: number,
): BoardObjectId {
  const sessionToken = sessionId.slice(-36);
  return boardObjectId(\`object:hf:\${sessionToken}:\${index}\`);
}`,
              "helper",
            ],
            [
              `objectId: (stroke, index) =>
                handwrittenStrokeObjectId(
                  handwrittenFunctionState.sessionId,
                  stroke,
                  index,
                ),`,
              `objectId: (_stroke, index) =>
                handwrittenStrokeObjectId(
                  handwrittenFunctionState.sessionId,
                  index,
                ),`,
              "preview call",
            ],
            [
              `objectId: (stroke, index) =>
            handwrittenStrokeObjectId(state.sessionId, stroke, index),`,
              `objectId: (_stroke, index) =>
            handwrittenStrokeObjectId(state.sessionId, index),`,
              "materialization call",
            ],
          ];
          for (const [before, after, label] of replacements) {
            if (!source.includes(before)) {
              throw new Error(`Expected ${label} was not found.`);
            }
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          status=$?
          cat pr3-id-fix.log
          if [ "$status" -ne 0 ]; then
            mkdir -p docs/diagnostics
            cp pr3-id-fix.log docs/diagnostics/HANDWRITTEN_FUNCTION_PR3_ID_FIX.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/HANDWRITTEN_FUNCTION_PR3_ID_FIX.txt
            git commit -m "chore: capture handwritten ID fix failure [skip-pr3-id-fix]"
            git push origin HEAD:feat/handwritten-function-workflow
            exit "$status"
          fi
      - name: Format and commit fix
        run: |
          npx prettier --write src/app/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          git commit -m "fix: compact handwritten stroke object IDs [skip-pr3-id-fix]"
          git push origin HEAD:feat/handwritten-function-workflow
      - name: Verify focused workflow
        run: |
          npm run typecheck
          npm run handwriting:pr3
