name: Temporary piecewise limit diagnostics
on:
  pull_request:
    paths:
      - 'tests/unit/modules/coordinate-plot-editor/piecewise-corrections.test.ts'
      - '.github/workflows/piecewise-limit-diagnostics.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx vitest run tests/unit/modules/coordinate-plot-editor/piecewise-corrections.test.ts --reporter=verbose
