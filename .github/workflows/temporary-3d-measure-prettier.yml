name: Temporary 3D measure formatting
on:
  push:
    branches: [feat/3d-point-distance-measurements-20261021]
    paths:
      - ".github/workflows/temporary-3d-measure-prettier.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/adapters/solid-3d-three/Solid3DViewport.tsx tests/e2e/solid-3d.spec.ts
          git config user.name "TutorBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/adapters/solid-3d-three/Solid3DViewport.tsx tests/e2e/solid-3d.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format measurement feature and browser regression"
            git push origin HEAD:refs/heads/feat/3d-point-distance-measurements-20261021
          fi
